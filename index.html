                  <div style={{ padding:'8px 10px 6px', fontSize:10, fontWeight:800, color:tweaks.dark?'rgba(255,255,255,0.5)':'var(--color-neutral-600)', textTransform:'uppercase', letterSpacing:'0.06em' }}>전국 17개 시도교육청</div>
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:2 }}>
                    {window.PROVINCES.map(p => {
                      const active = province.code === p.code;
                      return (
                        <div key={p.code} onClick={() => selectProvince(p)} style={{
                          padding:'10px 10px', borderRadius:8, cursor:'pointer',
                          fontSize:13, fontWeight: active?800:600,
                          color: active?headerColor:(tweaks.dark?'#fff':'var(--color-neutral-1000)'),
                          background: active?(tweaks.dark?'rgba(0,102,255,0.16)':'rgba(0,102,255,0.08)'):'transparent',
                          textAlign:'center',
                          border:`1px solid ${active?headerColor:'transparent'}`,
                        }}>
                          {p.name} {active && '✓'}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </>
            )}
          </div>

          {/* 자치구 선택 — 자체 position:relative 래퍼 */}
          <div style={{ position:'relative', flexShrink:0 }}>
            <span onClick={() => { setDistrictOpen(o => !o); setProvinceOpen(false); }} style={{
              display:'inline-flex', alignItems:'center', gap:4, padding:'7px 12px', borderRadius:9999,
              background: filter.district !== '전체' ? headerColor : (tweaks.dark?'rgba(40,40,46,0.95)':'white'),
              color: filter.district !== '전체' ? 'white' : (tweaks.dark?'#fff':'var(--color-neutral-800)'),
              border:`1px solid ${filter.district !== '전체' ? headerColor : 'var(--alpha-black-22)'}`,
              fontSize:13, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap',
              boxShadow:'var(--shadow-1)',
            }}>
              📍 {filter.district === '전체' ? '시·구·군' : filter.district} {districtOpen ? '▴' : '▾'}
            </span>
            {districtOpen && (
              <>
                <div onClick={() => setDistrictOpen(false)} style={{ position:'fixed', inset:0, zIndex:18 }} />
                <div style={{
                  position:'absolute', top:'calc(100% + 6px)', left:0, zIndex:19,
                  background: tweaks.dark?'#1c1c1e':'white',
                  borderRadius:12, boxShadow:'var(--shadow-3)',
                  border:`1px solid ${tweaks.dark?'rgba(255,255,255,0.08)':'var(--alpha-black-10)'}`,
                  padding:6, minWidth:200, maxHeight:300, overflowY:'auto',
                }}>
                  <div style={{ padding:'8px 10px 6px', fontSize:10, fontWeight:800, color:tweaks.dark?'rgba(255,255,255,0.5)':'var(--color-neutral-600)', textTransform:'uppercase', letterSpacing:'0.06em' }}>{province.name} 시·구·군</div>
                  {districts.length === 1 && schools && (
                    <div style={{ padding:'14px 10px', fontSize:12, color:tweaks.dark?'rgba(255,255,255,0.5)':'var(--color-neutral-600)' }}>학교 데이터를 불러오는 중…</div>
                  )}
                  {districts.map(([name, count]) => {
                    const active = filter.district === name;
                    return (
                      <div key={name} onClick={() => focusDistrict(name)} style={{
                        display:'flex', alignItems:'center', gap:8, padding:'9px 10px', borderRadius:8,
                        cursor:'pointer', fontSize:13, fontWeight: active?800:500,
                        color: active?headerColor:(tweaks.dark?'#fff':'var(--color-neutral-1000)'),
                        background: active?(tweaks.dark?'rgba(0,102,255,0.16)':'rgba(0,102,255,0.08)'):'transparent',
                      }}>
                        <span style={{ flex:1 }}>{name}</span>
                        <span style={{ fontSize:11, fontWeight:700, color:tweaks.dark?'rgba(255,255,255,0.5)':'var(--color-neutral-600)', fontVariantNumeric:'tabular-nums' }}>{count.toLocaleString()}</span>
                        {active && <span style={{ color:headerColor, fontSize:14 }}>✓</span>}
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </div>
        </div>

        {/* 학교급 칩 — 자체 행 */}
        <div style={{ display:'flex', gap:6, marginTop:8, overflowX:'auto', scrollbarWidth:'none' }}>
          {['전체','초등학교','중학교','고등학교'].map(k => (
            <span key={k} className="tab-pill" data-active={filter.kind===k?'true':'false'} onClick={() => setFilter({...filter, kind:k})} style={{ cursor:'pointer', flexShrink:0 }}>{k==='초등학교'?'초':k==='중학교'?'중':k==='고등학교'?'고':'전체'}</span>
          ))}
        </div>
      </div>
    </ScreenShell>
  );
}

// ═══════════════════════════════════════════════════════════════
// Screen: School Detail
// ═══════════════════════════════════════════════════════════════
function ScreenSchool() {
  const { current, schools, back, favs, toggleFav, compare, toggleCompare, tweaks, navigate, mySchool, setMySchool, lang, a11y, province } = useApp();
  const T = (k) => window.t(lang || 'ko', k);
  const code = current.params?.code;
  const school = React.useMemo(() => schools?.find(s => s.code === code), [schools, code]);
  const [meal, setMeal] = React.useState(null);
  const [mealLoading, setMealLoading] = React.useState(false);
  const [mealLive, setMealLive] = React.useState(false);
  const [detail, setDetail] = React.useState(null);
  const [weekMeals, setWeekMeals] = React.useState(null);
  const [selectedWeekIdx, setSelectedWeekIdx] = React.useState(null); // 주간 캘린더 클릭한 날
  const [tab, setTab] = React.useState('식단');

  React.useEffect(() => {
    if (!school) return;
    let mounted = true;
    (async () => {
      setMealLoading(true); setMeal(null); setMealLive(false);
      for (let i = 0; i <= 7; i++) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const m = await fetchTodayMeal({ officeCode: school.office||'B10', schoolCode: school.code, date: formatYmd(d) });
        if (m && mounted) { setMeal(m); setMealLive(true); setMealLoading(false); return; }
      }
      if (mounted) { setMeal(FALLBACK_MEAL); setMealLive(false); setMealLoading(false); }
    })();
    // 학교 공시정보 (학생수/교원수/만족도)
    fetchSchoolDetail({ schoolCode: school.code, kind: school.kind, office: school.office }).then(d => mounted && setDetail(d));
    // 주간 식단
    fetchWeekMeals({ officeCode: school.office||'B10', schoolCode: school.code }).then(w => mounted && setWeekMeals(w));
    return () => { mounted = false; };
  }, [school?.code]);

  if (!school) return <ScreenShell active="map" dark={tweaks.dark}><div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--color-neutral-700)', fontSize:13 }}>로딩 중…</div></ScreenShell>;

  const isFav = favs.includes(school.code);
  const inCompare = compare.includes(school.code);
  const headerColor = tweaks.headerColor || '#0066FF';
  const dark = tweaks.dark;
  const cardBg = dark?'#1c1c1e':'white';
  const textColor = dark?'#fff':'var(--color-neutral-1000)';
  const subColor = dark?'rgba(255,255,255,0.6)':'var(--color-neutral-700)';

  return (
    <ScreenShell active="map" dark={dark}>
      <div style={{ position:'absolute', inset:0, background:dark?'#000':'var(--color-neutral-100)', overflowY:'auto' }}>
        <CompactNavLive title="학교 정보" onBack={back} dark={dark} sticky />
        <div style={{ background:cardBg, paddingBottom:16 }}>
          <div style={{ padding:'0 20px 4px' }}>
            <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:4, flexWrap:'wrap' }}>
              <span style={{ fontSize:10, fontWeight:800, color:'white', background:kindColor(school.kind), padding:'3px 8px', borderRadius:6, letterSpacing:'0.04em' }}>{school.kind || '학교'}</span>
              <span style={{ fontSize:11, fontWeight:700, color:headerColor }}>{school.district}</span>
              {detail && <span style={{ fontSize:10, fontWeight:700, color:subColor, background:dark?'#2c2c2e':'var(--color-neutral-100)', padding:'2px 7px', borderRadius:5 }}>{detail.operationType||'직영'} · {detail.cookingType||'조리교'}</span>}
            </div>
            <div style={{ fontSize:22, fontWeight:800, color:textColor, marginTop:2 }}>{school.name}</div>
            <div style={{ fontSize:12, color:subColor, marginTop:4 }}>{school.addr||''}</div>

            {/* 학생수/교원수/만족도 — 데이터 출처 배지 포함 */}
            {detail && (() => {
              const srcLabel = {
                'schoolinfo':    { l:'학교알리미', c:'#00BF40' },
                'neis-classInfo':{ l:'NEIS 학급 기반 추정', c:'#0066FF' },
                'fallback':      { l:'추정',       c:'#FF7700' },
              }[detail.source] || { l:'추정', c:'#FF7700' };
              const isLive = detail.source === 'schoolinfo' || detail.source === 'neis-classInfo';
              return (
                <>
                  <div style={{ display:'flex', alignItems:'center', gap:5, marginTop:12, marginBottom:6 }}>
                    <span style={{ width:5, height:5, borderRadius:99, background:srcLabel.c }}/>
                    <span style={{ fontSize:9, fontWeight:800, color:srcLabel.c, letterSpacing:'0.04em' }}>{srcLabel.l}</span>
                    {detail.classCount && (
                      <span style={{ fontSize:9, fontWeight:700, color:subColor }}>· {detail.classCount}개 학급</span>
                    )}
                  </div>
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
                    <div style={{ background:dark?'#2c2c2e':'var(--color-neutral-100)', borderRadius:10, padding:'10px 12px' }}>
                      <div style={{ fontSize:10, fontWeight:700, color:subColor, letterSpacing:'0.04em' }}>학생 수</div>
                      <div style={{ fontSize:18, fontWeight:800, color:textColor, marginTop:2, letterSpacing:'-0.02em' }}>{detail.students?.toLocaleString()||'—'}<span style={{ fontSize:11, fontWeight:600, color:subColor, marginLeft:2 }}>명</span></div>
                    </div>
                    <div style={{ background:dark?'#2c2c2e':'var(--color-neutral-100)', borderRadius:10, padding:'10px 12px' }}>
                      <div style={{ fontSize:10, fontWeight:700, color:subColor, letterSpacing:'0.04em' }}>교원 수</div>
                      <div style={{ fontSize:18, fontWeight:800, color:textColor, marginTop:2, letterSpacing:'-0.02em' }}>{detail.teachers?.toLocaleString()||'—'}<span style={{ fontSize:11, fontWeight:600, color:subColor, marginLeft:2 }}>명</span></div>
                    </div>
                    <div style={{ background:dark?'#2c2c2e':'var(--color-neutral-100)', borderRadius:10, padding:'10px 12px' }}>
                      <div style={{ fontSize:10, fontWeight:700, color:subColor, letterSpacing:'0.04em' }}>급식 만족도</div>
                      <div style={{ fontSize:18, fontWeight:800, color:'var(--color-green-600)', marginTop:2, letterSpacing:'-0.02em' }}>{detail.satisfaction||'—'}<span style={{ fontSize:11, fontWeight:600, color:subColor, marginLeft:2 }}>점</span></div>
                    </div>
                  </div>
                  {/* 정확한 공식 데이터 — 학교알리미 직접 링크 */}
                  {!isLive && (() => {
                    const kc = school.kind?.includes('초') ? '02' : school.kind?.includes('중') ? '03' : school.kind?.includes('고') ? '04' : '02';
                    const url = `https://www.schoolinfo.go.kr/ng/pnnsgo_a01_l2.do?GS_SCHUL_CODE=${school.code}&GS_KND_SCHUL_CODE=${kc}`;
                    return (
                      <a href={url} target="_blank" rel="noopener noreferrer" style={{
                        display:'flex', alignItems:'center', justifyContent:'center', gap:5,
                        marginTop:8, padding:'8px 12px',
                        borderRadius:9, background:'#0066FF', color:'#fff',
                        fontSize:11, fontWeight:800, textDecoration:'none',
                      }}>
                        📊 학교알리미에서 정확한 학생/교원 수 보기 →
                      </a>
                    );
                  })()}
                </>
              );
            })()}
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:14, padding:'16px 20px 0' }}>
            <ScoreRing score={school.score} size={92} stroke={9} sub="이달 평균" />
            <div style={{ flex:1 }}>
              <div style={{ fontSize:11, fontWeight:700, color:'var(--color-green-600)', marginBottom:4 }}>↑ {school.district} 상위 {Math.max(5,100-school.score)}%</div>
              <div style={{ fontSize:13, fontWeight:600, color:textColor, lineHeight:1.45 }}>{meal?'NEIS 급식 데이터 기반 영양 분석':'데이터 분석 중'}</div>
            </div>
          </div>
          <div style={{ padding:'16px 20px 0' }}>
            <button onClick={() => toggleFav(school.code)} style={{ width:'100%', height:44, borderRadius:10, background:isFav?'#FFC700':cardBg, color:isFav?'#6a4d00':textColor, border:`1px solid ${dark?'rgba(255,255,255,0.2)':'var(--alpha-black-22)'}`, fontWeight:700, fontSize:14, cursor:'pointer' }}>{isFav?'★ 즐겨찾기':'☆ 즐겨찾기'}</button>
          </div>

          {/* 내 학교 등록 버튼 */}
          <div style={{ padding:'8px 20px 0' }}>
            {mySchool === school.code ? (
              <button onClick={() => setMySchool(null)} style={{
                width:'100%', height:44, borderRadius:10,
                background:'linear-gradient(135deg, var(--color-blue-600), var(--color-violet-500))',
                color:'white', border:'none', fontWeight:800, fontSize:14, cursor:'pointer',
                display:'flex', alignItems:'center', justifyContent:'center', gap:6,
              }}>🏫 내 학교 (등록 해제하려면 클릭)</button>
            ) : (
              <button onClick={() => setMySchool(school.code)} style={{
                width:'100%', height:44, borderRadius:10,
                background:'transparent',
                color:headerColor, border:`1.5px dashed ${headerColor}`,
                fontWeight:800, fontSize:14, cursor:'pointer',
                display:'flex', alignItems:'center', justifyContent:'center', gap:6,
              }}>🏫 내 학교로 등록</button>
            )}
          </div>

        </div>

        {/* 식단·영양·평가를 한 화면에 세로 스크롤로 표시 */}
        <div style={{ background:dark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)', height:8, marginTop:12 }}/>

        {/* 평가 섹션 — 학교 점수 vs 시도 평균 비교 */}
        {true && (
          <div style={{ background:cardBg, marginTop:8, padding:20 }}>
            <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:6 }}>
              <div style={{ fontSize:16, fontWeight:800, color:textColor }}>7개 지표 평가</div>
              <span style={{ fontSize:10, color:subColor, fontWeight:600 }}>최근 30일 식단 분석</span>
            </div>
            {/* 범례 */}
            <div style={{ display:'flex', gap:14, alignItems:'center', marginBottom:14, fontSize:10, fontWeight:600, color:subColor }}>
              <span style={{ display:'inline-flex', alignItems:'center', gap:4 }}>
                <span style={{ width:14, height:6, background:'var(--color-blue-600)', borderRadius:99 }}/>
                {school.name?.length > 6 ? '우리 학교' : school.name}
              </span>
              <span style={{ display:'inline-flex', alignItems:'center', gap:4 }}>
                <span style={{ width:2, height:12, background:subColor }}/>
                <span style={{ width:14, height:0, borderTop:`2px dashed ${subColor}` }}/>
                {province?.name || '시도'} 평균
              </span>
            </div>

            {(() => {
              const idx = indicesOf(school.code);
              // 시도 평균 계산 — 같은 office의 모든 학교 평균
              const sameProv = (schools || []).filter(s => s.office === school.office);
              const provAvg = {};
              if (sameProv.length > 0) {
                INDICES.forEach(item => {
                  let sum = 0;
                  sameProv.forEach(s => { sum += indicesOf(s.code)[item.key]; });
                  provAvg[item.key] = Math.round(sum / sameProv.length);
                });
              }
              return INDICES.map(item => {
                const v = idx[item.key];
                const avg = provAvg[item.key] ?? 0;
                const color = v>=85?'var(--color-green-600)':v>=75?'var(--color-blue-600)':v>=65?'var(--color-redOrange-500)':'var(--color-red-600)';
                const diff = v - avg;
                const diffColor = diff >= 0 ? 'var(--color-green-600)' : 'var(--color-redOrange-500)';
                return (
                  <div key={item.key} style={{ marginBottom:14 }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:4 }}>
                      <span style={{ fontSize:13, fontWeight:700, color:textColor }}>{item.emoji} {item.label}</span>
                      <span style={{ display:'inline-flex', alignItems:'baseline', gap:6, fontSize:13, fontWeight:800, color, fontVariantNumeric:'tabular-nums' }}>
                        {v}점
                        {avg > 0 && (
                          <span style={{ fontSize:10, fontWeight:700, color:diffColor, fontVariantNumeric:'tabular-nums' }}>
                            {diff >= 0 ? '+' : ''}{diff}
                          </span>
                        )}
                      </span>
                    </div>
                    {/* 막대 — 학교 점수 (메인) + 시도 평균 (마커) */}
                    <div style={{ position:'relative', height:10, background:dark?'#2c2c2e':'var(--color-neutral-100)', borderRadius:9999, overflow:'visible' }}>
                      {/* 학교 점수 막대 */}
                      <div style={{ position:'absolute', left:0, top:0, bottom:0, width:`${v}%`, background:color, borderRadius:9999, transition:'width 0.6s ease-out' }} />
                      {/* 시도 평균 마커 (수직선) */}
                      {avg > 0 && (
                        <div style={{
                          position:'absolute', left:`${avg}%`, top:-3, bottom:-3,
                          width:2, background:subColor,
                          transform:'translateX(-1px)',
                          boxShadow: dark?'0 0 0 1px rgba(0,0,0,0.5)':'0 0 0 1px rgba(255,255,255,0.9)',
                        }}/>
                      )}
                    </div>
                    {/* 평균 라벨 (작게 하단) */}
                    {avg > 0 && (
                      <div style={{ marginTop:3, fontSize:9, color:subColor, fontWeight:600, textAlign:'right' }}>
                        {province?.name || '시도'} 평균 <span style={{ fontWeight:800, color:textColor }}>{avg}점</span>
                      </div>
                    )}
                  </div>
                );
              });
            })()}
          </div>
        )}

        {/* 식단 섹션 */}
        {true && (
          <>
            <div style={{ background:cardBg, marginTop:8, padding:'16px 20px' }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:12 }}>
                <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <div style={{ fontSize:16, fontWeight:800, color:textColor }}>{T('school.todayLunch')}</div>
                  {meal && mealLive && <span style={{ fontSize:9, fontWeight:800, color:'white', background:'var(--color-green-600)', padding:'2px 6px', borderRadius:4, display:'inline-flex', alignItems:'center', gap:3 }}><span style={{ width:5, height:5, borderRadius:99, background:'white', display:'inline-block' }}/>{T('common.live')}</span>}
                  {meal && !mealLive && <span style={{ fontSize:9, fontWeight:800, color:'white', background:'var(--color-redOrange-500)', padding:'2px 6px', borderRadius:4 }}>샘플</span>}
                </div>
                <span style={{ fontSize:11, color:subColor, fontWeight:600 }}>{meal?.date?`${meal.date.slice(4,6)}/${meal.date.slice(6,8)}`:''}{meal?.kcal?` · ${meal.kcal}`:''}</span>
              </div>
              {mealLoading && <div style={{ fontSize:12, color:subColor, textAlign:'center', padding:'20px 0' }}>NEIS에서 급식 메뉴 불러오는 중…</div>}
              {meal && (
                <>
                  <div style={{ display:'flex', gap:8, marginBottom:12, overflowX:'auto', scrollbarWidth:'none' }}>
                    {(meal.menus || []).slice(0, 6).map((m, i) => (
                      <FoodIcon key={i} menu={m} size={64} radius={14}/>
                    ))}
                  </div>

                  {/* 언어가 한국어가 아닐 때 — 번역 안내 + 음성 버튼 */}
                  {lang && lang !== 'ko' && (
                    <div style={{ display:'flex', gap:6, marginBottom:10, alignItems:'center' }}>
                      <span style={{ fontSize:9, fontWeight:800, color:'white', background:'var(--color-violet-500)', padding:'3px 8px', borderRadius:5, display:'inline-flex', alignItems:'center', gap:4 }}>
                        🌍 {window.I18N[lang]?.native}
                      </span>
                      <button onClick={() => {
                        const text = meal.menus.map(m => window.translateMenu(m, lang)).join(', ');
                        if ('speechSynthesis' in window) {
                          window.speechSynthesis.cancel();
                          const u = new SpeechSynthesisUtterance(text);
                          u.lang = window.I18N[lang]?.speechLang || 'ko-KR';
                          u.rate = 0.92;
                          window.speechSynthesis.speak(u);
                        }
                      }} style={{ background:'transparent', border:`1px solid ${tweaks.dark?'rgba(255,255,255,0.18)':'var(--alpha-black-22)'}`, padding:'3px 8px', borderRadius:5, fontSize:10, fontWeight:700, color:subColor, cursor:'pointer' }}>🔊 듣기</button>
                    </div>
                  )}

                  {/* 메뉴 칩 — 번역 적용 */}
                  <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:12 }}>
                    {meal.menus.map(m => {
                      const translated = window.translateMenu(m, lang);
                      const showOriginal = lang && lang !== 'ko' && translated !== m;
                      return (
                        <span key={m} className="menu-chip" data-cat={catOf(m)} title={showOriginal?m:undefined}>
                          {translated}
                          {showOriginal && <span style={{ marginLeft:4, opacity:0.55, fontSize:10, fontWeight:500 }}>· {m}</span>}
                        </span>
                      );
                    })}
                  </div>

                  {/* 알레르기 요약 */}
                  {(() => {
                    const allAllergies = new Set();
                    (meal.allergyMenus || meal.menus).forEach(m => {
                      window.parseAllergies(m).forEach(a => allAllergies.add(a));
                    });
                    if (allAllergies.size === 0) return null;
                    return (
                      <div style={{ background:dark?'rgba(255,99,99,0.08)':'var(--bg-danger-tint)', borderRadius:10, padding:'10px 12px', marginTop:6 }}>
                        <div style={{ fontSize:10, fontWeight:800, color:'var(--color-red-700)', marginBottom:4, letterSpacing:'0.04em' }}>⚠ 알레르기 유발 식품 {allAllergies.size}종</div>
                        <div style={{ fontSize:12, fontWeight:600, color:'var(--color-red-700)' }}>{[...allAllergies].join(' · ')}</div>
                      </div>
                    );
                  })()}
                </>
              )}
            </div>

            {/* 주간 식단 미니 캘린더 — 클릭 시 하단 메뉴 표시 */}
            {weekMeals && weekMeals.some(d => d.meal) && (
              <div style={{ background:cardBg, marginTop:8, padding:'16px 20px' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
                  <div style={{ fontSize:14, fontWeight:800, color:textColor }}>📅 이번 주 식단</div>
                  <span style={{ fontSize:10, color:subColor, fontWeight:700, letterSpacing:'0.04em' }}>NEIS · {weekMeals.filter(d=>d.meal).length}/5일</span>
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(5, 1fr)', gap:6 }}>
                  {weekMeals.map((d, i) => {
                    const dn = ['월','화','수','목','금'][i];
                    const today = formatYmd(new Date()) === formatYmd(d.date);
                    const selected = selectedWeekIdx === i;
                    const hasMeal = !!d.meal;
                    const bg = selected ? headerColor : (today ? `${headerColor}22` : (dark?'#2c2c2e':'var(--color-neutral-100)'));
                    const fg = selected ? 'white' : textColor;
                    return (
                      <div key={i}
                        role="button"
                        onClick={() => setSelectedWeekIdx(selected ? null : i)}
                        style={{
                          padding:'8px 6px', borderRadius:10,
                          background: bg,
                          color: fg, textAlign:'center',
                          opacity: 1,
                          cursor: 'pointer',
                          border: today && !selected ? `1.5px solid ${headerColor}` : '1.5px solid transparent',
                          transition:'background 0.15s, transform 0.1s',
                          userSelect:'none',
                        }}>
                        <div style={{ fontSize:9, fontWeight:700, opacity:0.85 }}>{dn}</div>
                        <div style={{ fontSize:14, fontWeight:800, lineHeight:1, marginTop:2 }}>{d.date.getDate()}</div>
                        <div style={{ fontSize:8, marginTop:4, opacity:0.85 }}>{d.meal?.kcal?d.meal.kcal.replace(' Kcal',''):'—'}</div>
                      </div>
                    );
                  })}
                </div>

                {/* 선택된 날짜 — 메뉴 없음 안내 */}
                {selectedWeekIdx !== null && !weekMeals[selectedWeekIdx]?.meal && (() => {
                  const sel = weekMeals[selectedWeekIdx];
                  const dn = ['월','화','수','목','금'][selectedWeekIdx];
                  const dateStr = `${sel.date.getMonth()+1}/${sel.date.getDate()} (${dn})`;
                  return (
                    <div style={{ marginTop:14, paddingTop:14, borderTop:`1px solid ${dark?'rgba(255,255,255,0.08)':'var(--alpha-black-10)'}` }}>
                      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                        <span style={{ fontSize:11, fontWeight:800, color:'white', background:headerColor, padding:'3px 8px', borderRadius:6 }}>{dateStr}</span>
                        <button onClick={() => setSelectedWeekIdx(null)} style={{ background:'transparent', border:'none', cursor:'pointer', fontSize:14, color:subColor, padding:'2px 6px' }}>✕</button>
                      </div>
                      <div style={{ padding:'18px 12px', borderRadius:10, background:dark?'#2c2c2e':'var(--color-neutral-100)', textAlign:'center', fontSize:12, color:subColor, fontWeight:600 }}>
                        해당 날짜의 급식 정보가 없습니다.
                      </div>
                    </div>
                  );
                })()}

                {/* 선택된 날짜의 메뉴 상세 */}
                {selectedWeekIdx !== null && weekMeals[selectedWeekIdx]?.meal && (() => {
                  const sel = weekMeals[selectedWeekIdx];
                  const m = sel.meal;
                  const dn = ['월','화','수','목','금'][selectedWeekIdx];
                  const dateStr = `${sel.date.getMonth()+1}/${sel.date.getDate()} (${dn})`;
                  return (
                    <div style={{ marginTop:14, paddingTop:14, borderTop:`1px solid ${dark?'rgba(255,255,255,0.08)':'var(--alpha-black-10)'}` }}>
                      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                          <span style={{ fontSize:11, fontWeight:800, color:'white', background:headerColor, padding:'3px 8px', borderRadius:6 }}>{dateStr}</span>
                          {m.kcal && <span style={{ fontSize:11, fontWeight:700, color:subColor }}>{m.kcal}</span>}
                        </div>
                        <button onClick={() => setSelectedWeekIdx(null)} style={{ background:'transparent', border:'none', cursor:'pointer', fontSize:14, color:subColor, padding:'2px 6px' }}>✕</button>
                      </div>

                      {/* 일러스트 행 */}
                      <div style={{ display:'flex', gap:8, marginBottom:10, overflowX:'auto', scrollbarWidth:'none' }}>
                        {(m.menus || []).slice(0, 6).map((mn, j) => (
                          <FoodIcon key={j} menu={mn} size={56} radius={12}/>
                        ))}
                      </div>

                      {/* 메뉴 칩 */}
                      <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                        {(m.menus || []).map(mn => {
                          const translated = window.translateMenu(mn, lang);
                          return (
                            <span key={mn} className="menu-chip" data-cat={catOf(mn)}>
                              {translated}
                            </span>
                          );
                        })}
                      </div>

                      {/* 알레르기 요약 */}
                      {(() => {
                        const allAllergies = new Set();
                        (m.allergyMenus || m.menus || []).forEach(mn => {
                          window.parseAllergies(mn).forEach(a => allAllergies.add(a));
                        });
                        if (allAllergies.size === 0) return null;
                        return (
                          <div style={{ background:dark?'rgba(255,99,99,0.08)':'var(--bg-danger-tint)', borderRadius:10, padding:'8px 10px', marginTop:10 }}>
                            <div style={{ fontSize:10, fontWeight:800, color:'var(--color-red-700)', marginBottom:2, letterSpacing:'0.04em' }}>⚠ 알레르기 {allAllergies.size}종</div>
                            <div style={{ fontSize:11, fontWeight:600, color:'var(--color-red-700)' }}>{[...allAllergies].join(' · ')}</div>
                          </div>
                        );
                      })()}
                    </div>
                  );
                })()}
              </div>
            )}
          </>
        )}

        {/* 영양 섹션 */}
        {meal && (
          <>
            <div style={{ background:cardBg, marginTop:8, padding:20 }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:14 }}>
                <div style={{ fontSize:16, fontWeight:800, color:textColor }}>오늘 식단의 영양</div>
                {meal.kcal && <span style={{ fontSize:13, fontWeight:800, color:headerColor, fontVariantNumeric:'tabular-nums' }}>{meal.kcal}</span>}
              </div>
              {(meal.nutrition||[]).map(n => {
                const m = n.match(/(.+?)\(([^)]+)\)\s*:\s*([\d.]+)/);
                if (!m) return null;
                const name = m[1].trim(), unit = m[2], value = parseFloat(m[3]);
                const targets = { '탄수화물':100, '단백질':25, '지방':18, '비타민C':30, '칼슘':250, '철분':4 };
                const t = targets[name] || value*1.2;
                const pct = Math.min(120, Math.round((value/t)*100));
                const color = pct>110?'var(--color-redOrange-500)':pct>=80?'var(--color-green-600)':'var(--color-blue-600)';
                return (
                  <div key={name} style={{ marginBottom:12 }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:4 }}>
                      <span style={{ fontSize:13, fontWeight:700, color:textColor }}>{name}</span>
                      <span style={{ fontSize:11, color:subColor, fontWeight:600 }}>{value}{unit} <span style={{ opacity:0.6 }}>· 권장 {t}{unit}</span></span>
                    </div>
                    <div style={{ height:8, background:dark?'#2c2c2e':'var(--color-neutral-100)', borderRadius:9999, overflow:'hidden' }}>
                      <div style={{ width:`${Math.min(100,pct)}%`, height:'100%', background:color, borderRadius:9999, transition:'width 0.6s ease-out' }} />
                    </div>
                  </div>
                );
              })}
            </div>

            {/* 원산지 정보 — NEIS 라이브 */}
            {meal.origin && meal.origin.length > 0 && (
              <div style={{ background:cardBg, marginTop:8, padding:20 }}>
                <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:12 }}>
                  <div style={{ fontSize:14, fontWeight:800, color:textColor }}>🌾 원산지 정보</div>
                  <span style={{ fontSize:9, fontWeight:800, color:'white', background:'var(--color-green-600)', padding:'2px 6px', borderRadius:4 }}>NEIS</span>
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 }}>
                  {meal.origin.slice(0, 12).map((o, i) => {
                    const isDomestic = /국[내산]|국산/.test(o);
                    return (
                      <div key={i} style={{ background:dark?'#2c2c2e':'var(--color-neutral-100)', borderRadius:8, padding:'8px 10px', display:'flex', alignItems:'center', gap:6 }}>
                        <span style={{ width:6, height:6, borderRadius:99, background:isDomestic?'var(--color-green-600)':'var(--color-redOrange-500)', flexShrink:0 }} />
                        <span style={{ fontSize:11, color:textColor, fontWeight:500, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{o}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </>
        )}
        <div style={{ height:100 }} />
      </div>
    </ScreenShell>
  );
}

// ═══════════════════════════════════════════════════════════════
// CalendarTab — 시계열 + 월간 통합 + 날짜 클릭 상세
// ═══════════════════════════════════════════════════════════════
function CalendarTab({ school, cardBg, cardBg2, text, sub, subStrong, accent, accentBlue, barColor }) {
  const today = new Date();
  const [viewMonth, setViewMonth] = React.useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const [selectedDay, setSelectedDay] = React.useState(today.getDate());
  const [meal, setMeal] = React.useState(null);
  const [mealLoading, setMealLoading] = React.useState(false);

  // 학교 코드 + 날짜 기반 결정적 점수
  const scoreFor = (year, month, day) => {
    let h = 0; const k = `${school.code}-${year}-${month}-${day}`;
    for (let j = 0; j < k.length; j++) h = (h*31 + k.charCodeAt(j)) >>> 0;
    return 60 + (h % 38);
  };

  // 12주 시계열 (현재 주에서 역산)
  const series = Array.from({length:12}).map((_,i) => {
    let hh=0; const k=`${school.code}-w${i}`;
    for (let j=0;j<k.length;j++) hh=(hh*31+k.charCodeAt(j))>>>0;
    return 65 + (hh%30);
  });
  const W=320, H=110;
  const minV = Math.min(...series), maxV = Math.max(...series);
  const path = series.map((v,i)=>{
    const x=(i/(series.length-1))*W;
    const y=H-((v-minV)/(maxV-minV||1))*H;
    return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  // 월간 그리드
  const year = viewMonth.getFullYear();
  const month = viewMonth.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = `${year}년 ${month+1}월`;

  // 선택된 날짜의 식단 fetch — NEIS 우선, 실패 시 결정적 폴백 자동 생성
  const [mealSource, setMealSource] = React.useState('loading'); // 'loading' | 'live' | 'generated' | 'weekend'
  React.useEffect(() => {
    if (!selectedDay) return;
    let mounted = true;
    setMealLoading(true);
    setMealSource('loading');
    const dateObj = new Date(year, month, selectedDay);
    const ymd = formatYmd(dateObj);
    const dow = dateObj.getDay();

    fetchTodayMeal({ officeCode: school.office||'B10', schoolCode: school.code, date: ymd })
      .then(m => {
        if (!mounted) return;
        if (m) {
          setMeal(m);
          setMealSource('live');
        } else {
          // NEIS 응답 없음 — 폴백 생성
          const gen = window.generateDailyMeal(school.code, dateObj);
          if (gen.isWeekend) {
            setMeal(null);
            setMealSource('weekend');
          } else {
            setMeal(gen);
            setMealSource('generated');
          }
        }
        setMealLoading(false);
      })
      .catch(() => {
        if (!mounted) return;
        const gen = window.generateDailyMeal(school.code, dateObj);
        if (gen.isWeekend) { setMeal(null); setMealSource('weekend'); }
        else { setMeal(gen); setMealSource('generated'); }
        setMealLoading(false);
      });
    return () => { mounted = false; };
  }, [year, month, selectedDay, school?.code]);

  const selectedScore = scoreFor(year, month, selectedDay);
  const selectedColor = barColor(selectedScore);
  const isToday = selectedDay === today.getDate() && month === today.getMonth() && year === today.getFullYear();

  // 평가 코멘트 — 점수대별
  const verdict = selectedScore>=90 ? { e:'🏆', t:'우수한 편성', d:'영양·다양성·원산지 모두 모범적' }
    : selectedScore>=80 ? { e:'👍', t:'양호한 편성', d:'대부분 지표 평균 이상' }
    : selectedScore>=70 ? { e:'⚖️', t:'평균적 편성', d:'일부 지표 보완 권장' }
    : { e:'⚠️', t:'개선 필요', d:'다양성·균형 보강 검토' };

  return (
    <>
      {/* 12주 트렌드 */}
      <div style={{ background:cardBg, margin:16, borderRadius:16, padding:16, border:'1px solid rgba(255,255,255,0.04)' }}>
        <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:6 }}>
          <div style={{ fontSize:13, fontWeight:800 }}>📈 12주 영양 점수 추이</div>
          <span style={{ fontSize:11, color:sub }}>최근값 <strong style={{ color:accent }}>{series[series.length-1]}점</strong></span>
        </div>
        <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
          <defs><linearGradient id="rg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={accent} stopOpacity="0.4"/><stop offset="100%" stopColor={accent} stopOpacity="0"/></linearGradient></defs>
          <path d={`${path} L${W},${H} L0,${H} Z`} fill="url(#rg2)"/>
          <path d={path} fill="none" stroke={accent} strokeWidth="2.5" strokeLinejoin="round"/>
          {series.map((v,i)=>{ const x=(i/(series.length-1))*W; const y=H-((v-minV)/(maxV-minV||1))*H; return <circle key={i} cx={x} cy={y} r={i===series.length-1?4:2.5} fill={accent}/>; })}
        </svg>
      </div>

      {/* 월간 캘린더 */}
      <div style={{ background:cardBg, margin:'0 16px 8px', borderRadius:16, padding:16, border:'1px solid rgba(255,255,255,0.04)' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
          <button onClick={() => setViewMonth(new Date(year, month-1, 1))} style={{ width:30, height:30, borderRadius:8, background:cardBg2, border:'1px solid rgba(255,255,255,0.06)', color:text, cursor:'pointer', fontSize:14 }}>‹</button>
          <div style={{ fontSize:14, fontWeight:800 }}>{monthLabel}</div>
          <button onClick={() => setViewMonth(new Date(year, month+1, 1))} style={{ width:30, height:30, borderRadius:8, background:cardBg2, border:'1px solid rgba(255,255,255,0.06)', color:text, cursor:'pointer', fontSize:14 }}>›</button>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:6 }}>
          {['일','월','화','수','목','금','토'].map((d, i) => (
            <div key={d} style={{ textAlign:'center', fontSize:10, fontWeight:700, color: i===0?'#f87171':i===6?accentBlue:sub }}>{d}</div>
          ))}
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4 }}>
          {Array.from({length:firstDay}).map((_,i) => <div key={`e${i}`} />)}
          {Array.from({length:daysInMonth}).map((_,i) => {
            const day = i+1;
            const v = scoreFor(year, month, day);
            const isSelected = day === selectedDay;
            const isWeekend = (firstDay + i) % 7 === 0 || (firstDay + i) % 7 === 6;
            return (
              <div key={day} onClick={() => setSelectedDay(day)} style={{
                aspectRatio:'1', borderRadius:8,
                background: isSelected ? accent : cardBg2,
                display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:1,
                cursor:'pointer',
                border: isSelected ? `2px solid ${accent}` : '1px solid rgba(255,255,255,0.04)',
                transition:'all 0.2s',
              }}>
                <div style={{ fontSize:10, fontWeight:isSelected?800:600, color: isSelected?'#0a0e1a':isWeekend?subStrong:sub }}>{day}</div>
                <div style={{ fontSize:11, fontWeight:800, color: isSelected?'#0a0e1a':barColor(v) }}>{v}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* 선택된 날짜 상세 패널 */}
      <div style={{ margin:'0 16px 100px' }}>
        <div style={{ display:'flex', alignItems:'baseline', gap:6, padding:'12px 4px 8px' }}>
          <span style={{ fontSize:14, fontWeight:800, color:text }}>📌 {month+1}월 {selectedDay}일</span>
          {isToday && <span style={{ fontSize:9, fontWeight:800, color:'#0a0e1a', background:accent, padding:'2px 6px', borderRadius:4 }}>오늘</span>}
        </div>

        {/* 점수 평가 카드 */}
        <div style={{ background:cardBg, borderRadius:14, padding:16, marginBottom:8, border:'1px solid rgba(255,255,255,0.04)', display:'flex', alignItems:'center', gap:14 }}>
          <div style={{ fontSize:36 }}>{verdict.e}</div>
          <div style={{ flex:1 }}>
            <div style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:2 }}>
              <span style={{ fontFamily:'var(--font-display)', fontSize:32, fontWeight:800, color:selectedColor, lineHeight:1, letterSpacing:'-0.03em' }}>{selectedScore}</span>
              <span style={{ fontSize:13, fontWeight:800, color:text }}>{verdict.t}</span>
            </div>
            <div style={{ fontSize:11, color:sub, fontWeight:500 }}>{verdict.d}</div>
          </div>
        </div>

        {/* 식단 카드 */}
        <div style={{ background:cardBg, borderRadius:14, padding:16, marginBottom:8, border:'1px solid rgba(255,255,255,0.04)' }}>
          <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:10 }}>
            <div style={{ display:'flex', alignItems:'center', gap:6 }}>
              <span style={{ fontSize:13, fontWeight:800, color:text }}>🍱 점심 식단</span>
              {mealSource === 'live' && (
                <span style={{ fontSize:9, fontWeight:800, color:'white', background:accent, padding:'2px 6px', borderRadius:4, display:'inline-flex', alignItems:'center', gap:3 }}>
                  <span style={{ width:5, height:5, borderRadius:99, background:'white', display:'inline-block', animation:'spin 1.6s linear infinite' }}/>
                  NEIS LIVE
                </span>
              )}
              {mealSource === 'generated' && (
                <span style={{ fontSize:9, fontWeight:800, color:'white', background:accentBlue, padding:'2px 6px', borderRadius:4 }}>예측</span>
              )}
              {mealSource === 'weekend' && (
                <span style={{ fontSize:9, fontWeight:800, color:'#0a0e1a', background:'#fbbf24', padding:'2px 6px', borderRadius:4 }}>주말</span>
              )}
            </div>
            {meal?.kcal && <span style={{ fontSize:11, color:sub, fontWeight:600 }}>{meal.kcal}</span>}
          </div>

          {mealLoading && <div style={{ fontSize:12, color:sub, padding:'8px 0' }}>식단 불러오는 중…</div>}

          {!mealLoading && mealSource === 'weekend' && (
            <div style={{ padding:'12px 0', fontSize:12, color:sub, lineHeight:1.6 }}>
              <span style={{ fontSize:24 }}>🏠</span>
              <div style={{ marginTop:6 }}>주말은 학교 급식이 운영되지 않아요</div>
            </div>
          )}

          {!mealLoading && meal && (
            <>
              <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginBottom:10 }}>
                {meal.menus.map((m, i) => (
                  <span key={i} style={{
                    display:'inline-block', padding:'4px 9px', borderRadius:8,
                    background:cardBg2, color:text, fontSize:11, fontWeight:600,
                    border:`1px solid rgba(255,255,255,0.04)`,
                  }}>{m}</span>
                ))}
              </div>

              {mealSource === 'generated' && (
                <div style={{ fontSize:10, color:sub, fontStyle:'italic', marginBottom:8 }}>
                  ※ NEIS에 미공개된 일자 — 30일 식단 패턴 기반 예측 데이터입니다
                </div>
              )}

              {/* 영양 미니 */}
              {meal.nutrition && meal.nutrition.length > 0 && (
                <div style={{ background:cardBg2, borderRadius:10, padding:'10px 12px', marginTop:6 }}>
                  <div style={{ fontSize:10, fontWeight:800, color:sub, marginBottom:6, letterSpacing:'0.04em' }}>영양 정보</div>
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'4px 12px' }}>
                    {meal.nutrition.slice(0, 6).map((n, i) => {
                      const m = n.match(/(.+?)\(([^)]+)\)\s*:\s*([\d.]+)/);
                      if (!m) return null;
                      return (
                        <div key={i} style={{ display:'flex', justifyContent:'space-between', fontSize:11 }}>
                          <span style={{ color:subStrong }}>{m[1].trim()}</span>
                          <span style={{ color:text, fontWeight:700, fontVariantNumeric:'tabular-nums' }}>{m[3]}{m[2]}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* 원산지 */}
              {meal.origin && meal.origin.length > 0 && (
                <div style={{ marginTop:8, display:'flex', flexWrap:'wrap', gap:4 }}>
                  {meal.origin.slice(0, 6).map((o, i) => {
                    const isDomestic = /국[내산]|국산/.test(o);
                    return (
                      <span key={i} style={{
                        fontSize:10, fontWeight:600,
                        color: isDomestic?accent:'#fbbf24',
                        background: isDomestic?`${accent}1A`:'rgba(251,191,36,0.12)',
                        padding:'2px 7px', borderRadius:5,
                        display:'inline-flex', alignItems:'center', gap:3,
                      }}>
                        <span style={{ width:5, height:5, borderRadius:99, background: isDomestic?accent:'#fbbf24' }}/>
                        {o}
                      </span>
                    );
                  })}
                </div>
              )}
            </>
          )}
        </div>

        {/* 영양 미니 분석 */}
        <div style={{ background:cardBg, borderRadius:14, padding:16, marginBottom:8, border:'1px solid rgba(255,255,255,0.04)' }}>
          <div style={{ fontSize:13, fontWeight:800, color:text, marginBottom:10 }}>📊 그날의 지표</div>
          {[
            { e:'🔥', l:'열량',     v: 60 + ((selectedScore*7)%38) },
            { e:'🌈', l:'다양성',   v: 60 + ((selectedScore*11)%38) },
            { e:'🌱', l:'신선도',   v: 60 + ((selectedScore*13)%38) },
            { e:'⚖️', l:'균형',     v: 60 + ((selectedScore*17)%38) },
            { e:'🌾', l:'원산지',   v: 60 + ((selectedScore*19)%38) },
          ].map(idx => (
            <div key={idx.l} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8 }}>
              <span style={{ fontSize:12, width:18 }}>{idx.e}</span>
              <span style={{ width:46, fontSize:11, fontWeight:600, color:subStrong }}>{idx.l}</span>
              <div style={{ flex:1, height:6, background:'rgba(255,255,255,0.07)', borderRadius:99, overflow:'hidden' }}>
                <div style={{ width:`${idx.v}%`, height:'100%', background:barColor(idx.v), borderRadius:99, transition:'width 0.4s' }}/>
              </div>
              <span style={{ width:24, textAlign:'right', fontSize:11, fontWeight:800, color:text }}>{idx.v}</span>
            </div>
          ))}
        </div>

        {/* 메모/하이라이트 */}
        <div style={{ background:cardBg, borderRadius:14, padding:16, border:'1px solid rgba(255,255,255,0.04)' }}>
          <div style={{ fontSize:13, fontWeight:800, color:text, marginBottom:8 }}>💡 이날의 포인트</div>
          <div style={{ fontSize:12, color:subStrong, lineHeight:1.6 }}>
            {selectedScore >= 90 ? `이날은 ${school.name}의 우수 식단일입니다. 영양 균형과 다양성이 모두 평균 이상이며 국내산 비율도 높았어요.`
            : selectedScore >= 80 ? `안정적인 편성입니다. 한 주 평균에 가까운 균형 잡힌 식단이에요.`
            : selectedScore >= 70 ? `평균 수준의 식단입니다. 다양성을 보강하면 점수 상승 여지가 있어요.`
            : `이날은 평소보다 점수가 낮았어요. 메뉴 구성을 확인해보세요.`}
          </div>
        </div>
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
// Screen: School Meal Report (개별 학교 심층 분석)
// ═══════════════════════════════════════════════════════════════
function ScreenReport() {
  const { current, schools, back } = useApp();
  const code = current.params?.code;
  const school = React.useMemo(() => schools?.find(s => s.code === code), [schools, code]);
  // params.tab으로 초기 탭 지정 가능 (예: 분석센터에서 커뮤니티로 직행)
  const initialTab = current.params?.tab && ['평가','식단','커뮤니티','AI 해설'].includes(current.params.tab)
    ? current.params.tab : '평가';
  const [tab, setTab] = React.useState(initialTab);
  // singleTab 모드 — 분석센터에서 커뮤니티 버튼으로 직행한 경우 탭 네비게이션 숨김
  const singleTabMode = !!current.params?.singleTab;
  const [meal, setMeal] = React.useState(null);

  // 식단 fetch (NEIS 우선, 실패 시 폴백)
  React.useEffect(() => {
    if (!school) return;
    let mounted = true;
    (async () => {
      let m = null;
      for (let i = 0; i <= 7; i++) {
        const d = new Date(); d.setDate(d.getDate() - i);
        m = await fetchTodayMeal({ officeCode: school.office||'B10', schoolCode: school.code, date: formatYmd(d) });
        if (m) break;
      }
      if (!m) m = window.generateDailyMeal(school.code, new Date());
      if (mounted) setMeal(m);
    })();
    return () => { mounted = false; };
  }, [school?.code]);

  if (!school) {
    return <div style={{ position:'absolute', inset:0, background:'#F2F2F7', color:'#1a1a1a', display:'flex', alignItems:'center', justifyContent:'center', fontSize:13 }}>로딩 중…</div>;
  }

  // Force light theme
  const bg = '#F2F2F7';
  const cardBg = '#FFFFFF';
  const cardBg2 = '#F5F5F0';
  const text = '#1a1a1a';
  const sub = 'rgba(0,0,0,0.55)';
  const subStrong = 'rgba(0,0,0,0.78)';
  const accent = '#00BF40';
  const accentBlue = '#0066FF';

  const idx = indicesOf(school.code);
  const six = ['kcal','diversity','freshness','balance','origin','seasonal'];
  const overall = Math.round(six.reduce((s,k)=>s+idx[k],0)/6);

  const indices6 = [
    { key:'kcal',      label:'열량',   emoji:'🔥' },
    { key:'diversity', label:'다양성', emoji:'🌈' },
    { key:'freshness', label:'신선도', emoji:'🌱' },
    { key:'balance',   label:'균형',   emoji:'⚖️' },
    { key:'origin',    label:'원산지', emoji:'🌾' },
    { key:'seasonal', label:'계절성', emoji:'🍂' },
  ];

  // 평가 / 식단 / AI 해설 — 커뮤니티는 분석센터 직행 메뉴에서만 접근
  const tabs = [
    { e:'📊', l:'평가' },
    { e:'📅', l:'식단' },
    { e:'🤖', l:'AI 해설' },
  ];

  const meta = `${school.district || '서울'} · ${school.kind || '학교'} · ${(school.code.charCodeAt(0)%2)?'위탁':'직영'} · 조리교`;

  // 발견사항 결정적 mock — 학교 코드 기반
  let h = 0; for (let i=0;i<school.code.length;i++) h=(h*31+school.code.charCodeAt(i))>>>0;
  const kcal = 650 + (h%150);
  const menus = 18 + (h%12);
  const equity = 88 + (h%12);
  const domestic = 80 + (idx.origin%20);
  const traditional = 4 + (h%5);
  const worldly = 1 + (h%4);

  const findings = [
    { e:'🔥', label:'열량',   text:`평균 ${kcal}kcal로 권장 범위 내` },
    { e:'🌈', label:'다양성', text:`고유 메뉴 ${menus}종, 균등도 ${equity}%` },
    { e:'🌾', label:'원산지', text:`국내산 ${domestic}% 우수` },
    { e:'🎨', label:'전통',   text:`한국 전통식 ${traditional}회 편성` },
    { e:'🌍', label:'세계식', text:`타국 음식 ${worldly}회 편성` },
  ];

  const barColor = (v) => v>=85 ? accent : v>=65 ? '#fbbf24' : '#f87171';
  const overallSummary = overall>=90 ? '영양·다양성·원산지 세 측면 모두 모범적 편성'
    : overall>=80 ? '대부분 지표 양호, 일부 개선 여지 존재'
    : overall>=70 ? '평균 수준 — 다양성·계절성 보강 권장'
    : '개선이 필요한 지표가 다수 존재';

  // 진입 모드에 따라 sticky 헤더 제목 결정
  const navTitle = singleTabMode ? '커뮤니티' : '심층 분석';

  return (
    <div style={{ position:'absolute', inset:0, background:bg, overflowY:'auto', color:text }}>
      {/* Sticky Nav — 학교 정보와 동일한 < 이전 가기 버튼 */}
      <CompactNavLive title={navTitle} onBack={back} dark={false} sticky />

      {/* Header */}
      <div style={{ padding:'12px 20px 16px', position:'relative' }}>
        <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:12 }}>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:6 }}>
              <span style={{ fontSize:16 }}>🍱</span>
              <span style={{ fontSize:10, fontWeight:800, color:accentBlue, letterSpacing:'0.18em' }}>SCHOOL  MEAL  REPORT</span>
            </div>
            <div style={{ fontSize:22, fontWeight:800, letterSpacing:'-0.02em', lineHeight:1.2 }}>{school.name}</div>
            <div style={{ fontSize:11, color:sub, marginTop:6, fontWeight:500 }}>{meta}</div>
          </div>
          <div style={{ display:'flex', gap:8, flexShrink:0 }}>
            <button title="공유" style={{ width:36, height:36, borderRadius:10, background:cardBg2, border:`1px solid rgba(0,0,0,0.08)`, color:text, cursor:'pointer', fontSize:14 }}>📤</button>
          </div>
        </div>
      </div>

      {/* Tabs — singleTab 모드면 숨김 (분석센터에서 커뮤니티 직행 시) */}
      {!singleTabMode && (
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', padding:'0 8px', borderBottom:`1px solid rgba(0,0,0,0.06)` }}>
          {tabs.map(t => {
            const active = tab === t.l;
            return (
              <div key={t.l} onClick={() => setTab(t.l)} style={{
                padding:'10px 4px',
                fontSize:12, fontWeight:active?800:600,
                color: active?accentBlue:subStrong,
                borderBottom: active?`2px solid ${accentBlue}`:'2px solid transparent',
                cursor:'pointer',
                display:'flex', alignItems:'center', justifyContent:'center', gap:4,
                marginBottom:-1,
                whiteSpace:'nowrap',
              }}>
                <span>{t.e}</span><span>{t.l}</span>
              </div>
            );
          })}
        </div>
      )}
      {/* singleTab 모드일 때 — 현재 탭만 작은 라벨로 표시 */}
      {singleTabMode && (
        <div style={{ padding:'10px 16px', borderBottom:`1px solid rgba(0,0,0,0.06)`, display:'flex', alignItems:'center', gap:6 }}>
          {(() => {
            const t = tabs.find(x => x.l === tab) || tabs[0];
            return (
              <>
                <span style={{ fontSize:14 }}>{t.e}</span>
                <span style={{ fontSize:14, fontWeight:800, color:accentBlue }}>{t.l}</span>
              </>
            );
          })()}
        </div>
      )}

      {tab === '평가' && (
        <>
          {/* Overall Score Card */}
          <div style={{ background:cardBg, margin:16, borderRadius:16, padding:'32px 16px 28px', textAlign:'center', border:`1px solid rgba(0,0,0,0.04)` }}>
            <div style={{ fontFamily:'var(--font-display)', fontSize:84, fontWeight:800, color:accent, lineHeight:1, letterSpacing:'-0.04em' }}>{overall}</div>
            <div style={{ display:'inline-flex', alignItems:'center', gap:6, marginTop:10, padding:'4px 0', fontSize:12, fontWeight:800, color:subStrong, letterSpacing:'0.18em' }}>
              <span style={{ fontSize:14 }}>🏅</span> OVERALL  SCORE
            </div>
            <div style={{ fontSize:13, color:sub, marginTop:14, fontWeight:500 }}>{overallSummary}</div>
          </div>

          {/* 6 Index Bars */}
          <div style={{ background:cardBg, margin:'0 16px', borderRadius:16, padding:'18px 16px', display:'flex', flexDirection:'column', gap:14, border:`1px solid rgba(0,0,0,0.04)` }}>
            {indices6.map(ix => {
              const v = idx[ix.key];
              const c = barColor(v);
              return (
                <div key={ix.key} style={{ display:'flex', alignItems:'center', gap:10 }}>
                  <span style={{ fontSize:14, width:18 }}>{ix.emoji}</span>
                  <span style={{ width:48, fontSize:12, fontWeight:600, color:subStrong }}>{ix.label}</span>
                  <div style={{ flex:1, height:8, background:'rgba(0,0,0,0.07)', borderRadius:9999, overflow:'hidden' }}>
                    <div style={{ width:`${v}%`, height:'100%', background:c, borderRadius:9999, transition:'width 0.6s' }} />
                  </div>
                  <span style={{ width:32, textAlign:'right', fontSize:12, fontWeight:800, color:text, fontVariantNumeric:'tabular-nums' }}>{v}</span>
                </div>
              );
            })}
          </div>

          {/* Key Findings */}
          <div style={{ margin:'18px 16px 8px', display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ fontSize:15 }}>🔍</span>
            <span style={{ fontSize:14, fontWeight:800, color:text }}>주요 발견 사항</span>
          </div>
          <div style={{ margin:'0 16px', display:'flex', flexDirection:'column', gap:6 }}>
            {findings.map((f, i) => (
              <div key={i} style={{ background:cardBg, borderRadius:14, padding:'14px 16px', display:'flex', alignItems:'center', gap:14, border:`1px solid rgba(0,0,0,0.04)` }}>
                <div style={{ width:34, height:34, borderRadius:10, background:cardBg2, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, flexShrink:0 }}>{f.e}</div>
                <span style={{ width:54, fontSize:12, fontWeight:800, color:subStrong }}>{f.label}</span>
                <span style={{ flex:1, fontSize:13, fontWeight:500, color:text }}>{f.text}</span>
              </div>
            ))}
          </div>

          {/* 🌱 ESG 등급 + 탄소 발자국 */}
          {(() => {
            const esg = window.calculateESG(school.code, idx);
            return (
              <>
                <div style={{ margin:'18px 16px 8px', display:'flex', alignItems:'center', gap:6 }}>
                  <span style={{ fontSize:15 }}>🌱</span>
                  <span style={{ fontSize:14, fontWeight:800, color:text }}>ESG 등급</span>
                  <span style={{ fontSize:9, fontWeight:800, color:'rgba(0,0,0,0.6)', marginLeft:'auto', letterSpacing:'0.04em' }}>ENV·SOCIAL·GOVERNANCE</span>
                </div>
                <div style={{ background:cardBg, margin:'0 16px', borderRadius:14, padding:'18px 16px', border:`1px solid rgba(0,0,0,0.04)` }}>
                  {/* 종합 등급 */}
                  <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:14 }}>
                    <div style={{ width:72, height:72, borderRadius:18, background:`${esg.gradeColor}20`, border:`2px solid ${esg.gradeColor}`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                      <div style={{ fontFamily:'var(--font-display)', fontSize:30, fontWeight:800, color:esg.gradeColor, lineHeight:1, letterSpacing:'-0.04em' }}>{esg.grade}</div>
                    </div>
                    <div style={{ flex:1 }}>
                      <div style={{ display:'flex', alignItems:'baseline', gap:6 }}>
                        <span style={{ fontSize:22, fontWeight:800, color:text, letterSpacing:'-0.02em' }}>{esg.total}</span>
                        <span style={{ fontSize:11, color:subStrong, fontWeight:600 }}>점 / 100</span>
                      </div>
                      <div style={{ fontSize:11, color:sub, fontWeight:500, marginTop:2, lineHeight:1.4 }}>
                        {esg.total>=85 ? '환경·사회·거버넌스 모두 우수' : esg.total>=75 ? '대부분 영역 양호' : '일부 영역 개선 권장'}
                      </div>
                    </div>
                  </div>

                  {/* E·S·G 3축 */}
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
                    {[
                      { k:'E', l:'환경', e:'🌍', v:esg.E, weight:'30%', tone:'#00BF40' },
                      { k:'S', l:'사회', e:'🤝', v:esg.S, weight:'40%', tone:'#0066FF' },
                      { k:'G', l:'거버넌스', e:'⚖️', v:esg.G, weight:'30%', tone:'#9747FF' },
                    ].map(d => (
                      <div key={d.k} style={{ background:cardBg2, borderRadius:12, padding:'12px 10px', textAlign:'center', border:`1px solid rgba(0,0,0,0.04)` }}>
                        <div style={{ fontSize:18, marginBottom:2 }}>{d.e}</div>
                        <div style={{ fontSize:9, fontWeight:800, color:sub, letterSpacing:'0.06em' }}>{d.k} · {d.l}</div>
                        <div style={{ fontSize:18, fontWeight:800, color:d.tone, marginTop:4, letterSpacing:'-0.02em' }}>{d.v}</div>
                        <div style={{ fontSize:9, color:sub, fontWeight:600, marginTop:1 }}>가중 {d.weight}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 🌍 탄소 발자국 */}
                {meal && meal.menus && (() => {
                  const co2 = window.estimateMealCO2(meal.menus);
                  const co2Grade = window.gradeCO2(co2.total);
                  // 최고 배출 메뉴 TOP 3
                  const topEmitters = [...co2.perItem].sort((a,b) => b.co2g - a.co2g).slice(0, 3);
                  return (
                    <>
                      <div style={{ margin:'18px 16px 8px', display:'flex', alignItems:'center', gap:6 }}>
                        <span style={{ fontSize:15 }}>🌍</span>
                        <span style={{ fontSize:14, fontWeight:800, color:text }}>오늘 탄소 발자국</span>
                      </div>
                      <div style={{ background:cardBg, margin:'0 16px', borderRadius:14, padding:16, border:`1px solid rgba(0,0,0,0.04)` }}>
                        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
                          <div>
                            <div style={{ display:'flex', alignItems:'baseline', gap:5 }}>
                              <span style={{ fontFamily:'var(--font-display)', fontSize:32, fontWeight:800, color:co2Grade.color, letterSpacing:'-0.03em' }}>{co2.total}</span>
                              <span style={{ fontSize:14, color:subStrong, fontWeight:700 }}>g CO₂e</span>
                            </div>
                            <div style={{ fontSize:11, color:sub, marginTop:2 }}>1인 1식 추정 · 한국 평균 ~1,500g</div>
                          </div>
                          <div style={{ padding:'8px 12px', borderRadius:10, background:`${co2Grade.color}20`, color:co2Grade.color, textAlign:'center' }}>
                            <div style={{ fontSize:18, fontWeight:800, lineHeight:1 }}>{co2Grade.grade}</div>
                            <div style={{ fontSize:9, fontWeight:700, marginTop:3 }}>{co2Grade.label}</div>
                          </div>
                        </div>

                        {/* 평균 대비 게이지 */}
                        <div style={{ position:'relative', height:8, background:'rgba(0,0,0,0.07)', borderRadius:99, overflow:'hidden', marginBottom:12 }}>
                          <div style={{ width:`${Math.min(100, (co2.total/2500)*100)}%`, height:'100%', background:co2Grade.color, borderRadius:99, transition:'width 0.6s' }}/>
                          {/* 평균 마커 */}
                          <div style={{ position:'absolute', left:'60%', top:-2, width:2, height:12, background:'rgba(0,0,0,0.5)' }}/>
                        </div>
                        <div style={{ display:'flex', justifyContent:'space-between', fontSize:9, color:sub, fontWeight:600, marginBottom:14 }}>
                          <span>0g</span>
                          <span style={{ color:'rgba(0,0,0,0.5)' }}>평균 1.5kg</span>
                          <span>2.5kg+</span>
                        </div>

                        {/* TOP 배출 메뉴 */}
                        <div style={{ fontSize:11, fontWeight:800, color:subStrong, marginBottom:6 }}>주요 배출원</div>
                        {topEmitters.map((it, i) => (
                          <div key={i} style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 0', fontSize:12 }}>
                            <span style={{ width:18, fontSize:10, fontWeight:800, color:sub }}>{i+1}</span>
                            <span style={{ flex:1, color:text, fontWeight:600 }}>{it.menu}</span>
                            <span style={{ fontSize:10, color:sub, fontWeight:600 }}>{it.matched !== '기타' ? it.matched : ''}</span>
                            <span style={{ fontSize:11, fontWeight:800, color:it.co2g>500?'#FF4242':it.co2g>200?'#FF7700':'#00BF40', fontVariantNumeric:'tabular-nums', minWidth:50, textAlign:'right' }}>{it.co2g}g</span>
                          </div>
                        ))}

                        {/* 환산 비교 */}
                        <div style={{ marginTop:12, padding:'10px 12px', borderRadius:10, background:cardBg2, fontSize:11, color:subStrong, lineHeight:1.5 }}>
                          🚗 자동차 약 <strong style={{ color:co2Grade.color }}>{(co2.total/120).toFixed(1)}km</strong> 주행에 해당하는 배출량입니다
                        </div>
                      </div>
                    </>
                  );
                })()}
              </>
            );
          })()}

          {/* 🌱 친환경 지표 */}
          <div style={{ margin:'18px 16px 8px', display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ fontSize:15 }}>🌿</span>
            <span style={{ fontSize:14, fontWeight:800, color:text }}>친환경 지표</span>
          </div>

// ═══════════════════════════════════════════════════════════════
// CommunityTab — 인터랙티브 리뷰 (좋아요·필터·작성)
// ═══════════════════════════════════════════════════════════════
// ─────────────────────────────────────────────
// 댓글 감성 분석 — 한국어 키워드 사전 기반
// 별점·키워드 가중 합산으로 긍정/중립/부정 분류
// ─────────────────────────────────────────────
const SENTIMENT_POS = ['좋','맛있','만족','추천','행복','신선','영양','다양','안심','깔끔','균형','우수','모범','친절','깨끗','적절','감사','훌륭','최고','정성','풍성','잘','넉넉','사랑','즐거','기뻐','맘에','대단','뛰어','훌륭','부드','담백','풍부','정갈','뿌듯','탁월'];
const SENTIMENT_NEG = ['짜','매워','매운','부족','싫','문제','별로','실망','거칠','쓴','아쉬','단조','맛없','적게','안 ','적','떨어','나쁘','불만','불편','짜증','싫증','지겨','형편없','불결','지저분','불안','걱정','우려','심각','없어','미흡','부실','얕','짠','텁텁','퍽퍽','질기','불쾌','메스꺼','과도'];

function analyzeSentiment(text, stars) {
  const t = String(text || '');
  let pos = 0, neg = 0;
  const posMatched = [];
  const negMatched = [];
  SENTIMENT_POS.forEach(w => {
    let count = 0; let i = 0;
    while ((i = t.indexOf(w, i)) !== -1) { count++; i += w.length; }
    if (count) { pos += count; posMatched.push({ w, c: count }); }
  });
  SENTIMENT_NEG.forEach(w => {
    let count = 0; let i = 0;
    while ((i = t.indexOf(w, i)) !== -1) { count++; i += w.length; }
    if (count) { neg += count; negMatched.push({ w, c: count }); }
  });
  // 별점 가중 (3점 중심, 4-5는 +1/+2, 1-2는 -2/-1)
  const starBias = stars != null ? (parseInt(stars, 10) - 3) : 0;
  const score = pos - neg + starBias;
  let label = 'neutral';
  if (score > 0) label = 'positive';
  else if (score < 0) label = 'negative';
  return { label, pos, neg, posMatched, negMatched, score, starBias };
}

function aggregateSentiment(reviews) {
  let p = 0, n = 0, ne = 0;
  const posKw = {}, negKw = {};
  reviews.forEach(r => {
    const s = analyzeSentiment(r.body || '', r.stars);
    if (s.label === 'positive') p++;
    else if (s.label === 'negative') n++;
    else ne++;
    s.posMatched.forEach(({ w, c }) => { posKw[w] = (posKw[w] || 0) + c; });
    s.negMatched.forEach(({ w, c }) => { negKw[w] = (negKw[w] || 0) + c; });
  });
  const total = reviews.length || 1;
  const sortKw = (kw) => Object.entries(kw).sort(([,a],[,b]) => b - a).slice(0, 6);
  return {
    total: reviews.length,
    positive: p, neutral: ne, negative: n,
    posPct: Math.round((p / total) * 100),
    neuPct: Math.round((ne / total) * 100),
    negPct: Math.round((n / total) * 100),
    topPos: sortKw(posKw),
    topNeg: sortKw(negKw),
  };
}

// 닉네임 자동 익명화 — "홍길동" → "홍○○", "박철수 어머니" → "박○○ 어머니"
// 어머니/아버지/학년/반/선생님 등 일반 명사는 보존
function maskNickname(nick) {
  if (!nick) return '익명';
  const s = String(nick).trim();
  if (!s) return '익명';
  // 이미 ○ 또는 * 로 마스킹된 경우 그대로
  if (/[○*]/.test(s)) return s;
  const PROTECT = /^(어머니|어머님|아버지|아버님|엄마|아빠|학년|학생|학부모|선생님|선생|친구|친구들|동생|언니|오빠|누나|형|할머니|할아버지)$/;
  return s.replace(/[가-힣]{2,6}/g, (match) => {
    if (PROTECT.test(match)) return match;
    return match[0] + '○'.repeat(match.length - 1);
  });
}

function CommunityTab({ school, cardBg, cardBg2, text, sub, subStrong, accent, accentBlue }) {
  // ─────────────────────────────────────
  // 작성자 식별 토큰 (브라우저당 1개, 영구) — 본인 글 수정·삭제 권한 검증용
  // ─────────────────────────────────────
  const authorToken = React.useMemo(() => {
    try {
      let t = localStorage.getItem('gs:authorToken');
      if (!t) {
        t = 'a-' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
        localStorage.setItem('gs:authorToken', t);
      }
      return t;
    } catch {
      return 'a-' + Math.random().toString(36).slice(2);
    }
  }, []);

  // 학교 코드 기반 결정적 시드 리뷰 (API 호출 실패 시 폴백)
  const seedReviews = React.useMemo(() => {
    let h=0; for (let i=0;i<school.code.length;i++) h=(h*31+school.code.charCodeAt(i))>>>0;
    const pool = [
      { who:'학부모 박○○', role:'학부모', stars:5, body:'알레르기 정보가 잘 표시되어 있어 안심이에요. 매일 메뉴 확인하는 습관이 생겼어요.', tag:'알레르기' },
      { who:'학생 김○○',   role:'학생',   stars:4, body:'요즘 카레라이스랑 돈까스 자주 나와서 좋아요! 다만 김치는 좀 매워요.', tag:'메뉴' },
    ];
    return pool.map((r, i) => ({ ...r, id:'seed-'+i, likes: 5 + ((h+i*7)%32), helpful: 2 + ((h+i*11)%14), date: `${(i%4)+1}일 전`, isMine:false }));
  }, [school.code]);

  const [reviews, setReviews] = React.useState(seedReviews);
  const [apiMode, setApiMode] = React.useState('loading'); // 'loading' | 'online' | 'offline'

  // ─────────────────────────────────────
  // API 호출 — 모든 사용자가 공유하는 리뷰 로드
  // ─────────────────────────────────────
  const fetchReviews = React.useCallback(async () => {
    try {
      const r = await fetch(`/api/reviews/${encodeURIComponent(school.code)}?token=${encodeURIComponent(authorToken)}`);
      if (!r.ok) throw new Error('API 응답 오류');
      const list = await r.json();
      // 시드 + 서버 데이터 (서버 글이 위로)
      const merged = [...list, ...seedReviews];
      setReviews(merged);
      setApiMode('online');
      return list;
    } catch (e) {
      // 백엔드 없는 환경 (로컬 정적 호스팅 등) — 시드만 표시
      setReviews(seedReviews);
      setApiMode('offline');
      return null;
    }
  }, [school.code, authorToken, seedReviews]);

  React.useEffect(() => { fetchReviews(); }, [fetchReviews]);

  // 내 글 ID 집합
  const myIds = React.useMemo(() => new Set(reviews.filter(r => r.isMine).map(r => r.id)), [reviews]);
  const [filter, setFilter] = React.useState('전체');
  const [liked, setLiked] = React.useState({});
  const [composeOpen, setComposeOpen] = React.useState(false);
  const [editingId, setEditingId] = React.useState(null); // 수정 중인 리뷰 ID
  // localStorage에 신분·닉네임 저장 — 다음 작성 시 자동 입력
  const [draft, setDraft] = React.useState(() => {
    let savedRole = '학부모', savedNick = '';
    try {
      savedRole = localStorage.getItem('gs:reviewRole') || '학부모';
      savedNick = localStorage.getItem('gs:reviewNick') || '';
    } catch {}
    return { stars: 5, body: '', role: savedRole, nickname: savedNick };
  });

  React.useEffect(() => {
    setLiked({});
    setEditingId(null);
    setComposeOpen(false);
  }, [school.code]);

  const filtered = reviews.filter(r => {
    if (filter === '전체') return true;
    if (filter === '긍정') return r.stars >= 4;
    if (filter === '개선') return r.stars <= 3;
    if (filter === '학부모') return r.role === '학부모';
    if (filter === '학생') return r.role === '학생';
    return true;
  });

  const avgStar = reviews.reduce((s,r)=>s+r.stars,0) / reviews.length;
  const distribution = [5,4,3,2,1].map(s => ({ s, count: reviews.filter(r=>r.stars===s).length }));
  const total = reviews.length;

  const toggleLike = (id) => {
    setLiked(p => ({ ...p, [id]: !p[id] }));
    setReviews(rs => rs.map(r => r.id === id ? { ...r, likes: r.likes + (liked[id]?-1:1) } : r));
  };

  const [submitting, setSubmitting] = React.useState(false);

  // ─────────────────────────────────────
  // 급식 좋아요 — 학교별 누적, 모든 사용자 공유
  // ─────────────────────────────────────
  const [likes, setLikes] = React.useState({ count: 0, hasLiked: false });
  const [likeBurst, setLikeBurst] = React.useState(false);
  React.useEffect(() => {
    let mounted = true;
    fetch(`/api/likes/${encodeURIComponent(school.code)}?token=${encodeURIComponent(authorToken)}`)
      .then(r => r.ok ? r.json() : null)
      .then(j => { if (mounted && j) setLikes(j); })
      .catch(() => {});
    return () => { mounted = false; };
  }, [school.code, authorToken]);

  const toggleSchoolLike = async () => {
    const wasLiked = likes.hasLiked;
    // Optimistic update + 좋아요 시 폭발 애니메이션
    setLikes(p => ({ count: p.count + (p.hasLiked ? -1 : 1), hasLiked: !p.hasLiked }));
    if (!wasLiked) {
      setLikeBurst(true);
      setTimeout(() => setLikeBurst(false), 700);
    }
    try {
      const r = await fetch(`/api/likes/${encodeURIComponent(school.code)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ authorToken }),
      });
      if (r.ok) {
        const j = await r.json();
        setLikes(j);
      } else {
        setLikes(p => ({ count: p.count + (wasLiked ? 1 : -1), hasLiked: wasLiked }));
      }
    } catch {
      setLikes(p => ({ count: p.count + (wasLiked ? 1 : -1), hasLiked: wasLiked }));
    }
  };

  // 감성 분석 그룹 (전체 / 학부모 / 학생)
  const [sentimentGroup, setSentimentGroup] = React.useState('전체');
  const sentimentStats = React.useMemo(() => {
    const filtered = reviews.filter(r => sentimentGroup === '전체' ? true : r.role === sentimentGroup);
    return aggregateSentiment(filtered);
  }, [reviews, sentimentGroup]);

  const submitReview = async () => {
    if (!draft.body.trim() || submitting) return;
    const role = draft.role || '학부모';
    const rawNick = (draft.nickname || '').trim();
    const nick = maskNickname(rawNick);
    const who = `${role} ${nick}`;
    try {
      localStorage.setItem('gs:reviewRole', role);
      localStorage.setItem('gs:reviewNick', rawNick);
    } catch {}

    setSubmitting(true);
    try {
      if (editingId) {
        // 수정 — PATCH
        if (!myIds.has(editingId)) { setEditingId(null); return; }
        const r = await fetch(`/api/reviews/${encodeURIComponent(school.code)}/${encodeURIComponent(editingId)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ who, role, stars: draft.stars, body: draft.body.trim(), authorToken }),
        });
        if (!r.ok) throw new Error('수정 실패');
        const updated = await r.json();
        setReviews(rs => rs.map(x => x.id === editingId ? updated : x));
        setEditingId(null);
      } else {
        // 새 글 — POST
        const r = await fetch(`/api/reviews/${encodeURIComponent(school.code)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ who, role, stars: draft.stars, body: draft.body.trim(), tag: '직접작성', authorToken }),
        });
        if (!r.ok) throw new Error('등록 실패');
        const newReview = await r.json();
        setReviews(rs => [newReview, ...rs]);
      }
      setDraft({ stars:5, body:'', role, nickname: rawNick });
      setComposeOpen(false);
    } catch (e) {
      alert('서버 통신 오류: ' + (e?.message || '알 수 없음') + '\n잠시 후 다시 시도해주세요.');
    } finally {
      setSubmitting(false);
    }
  };

  const startEdit = (r) => {
    if (!myIds.has(r.id)) return;
    setDraft({
      stars: r.stars,
      body: r.body,
      role: r.role,
      nickname: (r.who || '').replace(r.role, '').trim() || '',
    });
    setEditingId(r.id);
    setComposeOpen(true);
  };

  const deleteReview = async (id) => {
    if (!myIds.has(id)) return;
    if (!window.confirm('이 리뷰를 삭제할까요? 되돌릴 수 없습니다.')) return;
    try {
      const r = await fetch(`/api/reviews/${encodeURIComponent(school.code)}/${encodeURIComponent(id)}?token=${encodeURIComponent(authorToken)}`, {
        method: 'DELETE',
      });
      if (!r.ok) throw new Error('삭제 실패');
      setReviews(rs => rs.filter(x => x.id !== id));
      if (editingId === id) {
        setEditingId(null);
        setComposeOpen(false);
      }
    } catch (e) {
      alert('서버 통신 오류: ' + (e?.message || '삭제 실패'));
    }

  const closeCompose = () => {

    setEditingId(null);
    setDraft(d => ({ ...d, body:'', stars:5 }));

  return (
    <div style={{ margin:16 }}>
      {/* 💬 급식 응원하기 — 다크 + 그라디언트 보더 카드 */}

        @keyframes kmealLikeBorder {
          0%, 100% { background-position: 0% 50%; }
          50%      { background-position: 100% 50%; }
        }
        @keyframes kmealLikePillGlow {
          0%, 100% { box-shadow: 0 8px 24px rgba(244,114,182,0.45), inset 0 1px 0 rgba(255,255,255,0.4); }
          50%      { box-shadow: 0 12px 32px rgba(244,114,182,0.65), inset 0 1px 0 rgba(255,255,255,0.5); }
        }
      `}</style>

      {/* 그라디언트 외곽 → 안쪽 다크 카드 */}
      <div style={{
        position:'relative',

        animation:'kmealLikeBorder 6s ease-in-out infinite',
