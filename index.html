(function purgeStaleSchoolCaches() {
  try {
    const STALE_PREFIXES = ['neis:schools:', 'kmeal:schools:'];
    const STALE_SUFFIXES = [':v1', ':v2', ':v3', ':v4', ':v5', ':v6', ':v7']; // v8부터 OSM 정적 JSON 1차
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k) continue;
      if (STALE_PREFIXES.some(p => k.startsWith(p)) && STALE_SUFFIXES.some(s => k.endsWith(s))) {
        toRemove.push(k);
      }
    }
    toRemove.forEach(k => { try { localStorage.removeItem(k); } catch {} });
    if (toRemove.length) console.info('[NEIS] 구버전 학교 캐시 ' + toRemove.length + '건 정리 — 가짜 학교 표시 방지');

})();

// CORS 프록시 병렬 레이스 — 10여 개 프록시 동시 시도, 가장 먼저 성공한 응답 사용
// 각 프록시별 성공/실패 통계 누적해 다음 호출 시 더 빠른 프록시 우선
window.__proxyStats = window.__proxyStats || {};
async function fetchJsonWithFallback(url, timeout) {
  const PROXIES = [
    { id:'direct',     build: u => u },
    { id:'corsproxy.io',    build: u => `https://corsproxy.io/?${encodeURIComponent(u)}` },
    { id:'allorigins-raw',  build: u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}` },
    { id:'allorigins-get',  build: u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`, wrapper:'allorigins' },
    { id:'codetabs',        build: u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}` },
    { id:'thingproxy',      build: u => `https://thingproxy.freeboard.io/fetch/${u}` },
    { id:'corsproxy.org',   build: u => `https://corsproxy.org/?${encodeURIComponent(u)}` },
    { id:'cors.eu.org',     build: u => `https://cors.eu.org/${u}` },
    { id:'yacdn.org',       build: u => `https://yacdn.org/proxy/${u}` },
    { id:'cors.lol',        build: u => `https://api.cors.lol/?url=${encodeURIComponent(u)}` },
  ];
  const stats = window.__proxyStats;
  // 우선순위: 최근 성공률 높은 프록시 먼저
  PROXIES.sort((a, b) => {
    const sa = stats[a.id] || { ok:0, fail:0 };
    const sb = stats[b.id] || { ok:0, fail:0 };
    const ra = (sa.ok + 1) / (sa.ok + sa.fail + 2);
    const rb = (sb.ok + 1) / (sb.ok + sb.fail + 2);
    return rb - ra;
  });

  return new Promise((resolve) => {
    let pending = PROXIES.length;
    let done = false;
    const finish = (v, winner) => {
      if (!done) {
        done = true;
        if (winner) console.info('[NEIS] ✓ ' + winner + ' 응답 성공');
        resolve(v);
      }
    };
    const dec = (id, reason) => {
      stats[id] = stats[id] || { ok:0, fail:0 };
      stats[id].fail++;
      if (--pending === 0) finish(null);
    };
    const ok = (id) => {
      stats[id] = stats[id] || { ok:0, fail:0 };
      stats[id].ok++;
    };
    PROXIES.forEach(p => {
      const v = p.build(url);
      window.fetchWithTimeout(v, { headers: { 'Accept':'application/json,text/plain,*/*' } }, timeout)
        .then(r => (r && r.ok) ? r.text() : null)
        .then(txt => {
          if (done) return dec(p.id);
          if (!txt) return dec(p.id);
          try {
            let j = JSON.parse(txt);
            // allorigins.win/get 의 경우 응답이 { contents, status } 형태로 래핑됨
            if (p.wrapper === 'allorigins' && j && typeof j.contents === 'string') {
              try { j = JSON.parse(j.contents); } catch { return dec(p.id); }
            }
            // 유효한 JSON 객체/배열이면 OK (NEIS·data.go.kr 모두 수용)
            if (j && typeof j === 'object') {
              ok(p.id);
              return finish(j, p.id);
            }
          } catch (e) {}
          dec(p.id);
        })
        .catch(() => dec(p.id, 'fetch-error'));
    });
  });
}

// 자치구 → [lat, lng] 폴백 테이블 (좌표 누락 학교 보정용)
window.getDistrictCoord = function(addr, schoolCode) {
  if (!window.__DISTRICT_COORDS) {
    const tbl = {};
    // 서울 자치구 (실측 중심 좌표)
    if (typeof SEOUL_DISTRICT_DATA !== 'undefined') {
      SEOUL_DISTRICT_DATA.forEach(d => { tbl[d.gu] = [d.lat, d.lng]; });
    }
    // 16개 시도 자치구 (시도 중심 + 방위각 분산)
    if (typeof PROVINCE_FALLBACK_CONFIG !== 'undefined' && window.PROVINCES) {
      Object.entries(PROVINCE_FALLBACK_CONFIG).forEach(([code, cfg]) => {
        const prov = window.PROVINCES.find(p => p.code === code);
        if (!prov) return;
        const [clat, clng] = prov.center;
        cfg.districts.forEach((d, di) => {
          if (tbl[d]) return; // 이미 있으면 스킵
          const angle = (di / cfg.districts.length) * Math.PI * 2;
          const r = (cfg.spread || 0.2) * 0.55;
          tbl[d] = [clat + Math.sin(angle) * r, clng + Math.cos(angle) * r * 1.2];
        });
      });
    }
    window.__DISTRICT_COORDS = tbl;
  }
  const district = districtOf(addr, null, null);
  const c = window.__DISTRICT_COORDS[district];
  if (!c) return null;
  // 같은 자치구 내 학교가 한 점에 겹치지 않도록 학교코드 기반 결정적 지터
  let h = 0;
  const s = String(schoolCode || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const jx = ((h % 400) - 200) / 20000;        // ±0.01도 (~1km)
  const jy = (((h >> 8) % 400) - 200) / 20000;
  return [c[0] + jx, c[1] + jy];
};

// ─────────────────────────────────────────────────────────
// 공공데이터포털 학교 위치 API (1차 소스 — 좌표 보장)
// 전국초·중등학교 위치표준데이터: 학교명·종류·좌표·도로명주소
// ─────────────────────────────────────────────────────────
// 응답 객체에서 위도/경도/이름 등을 강건하게 추출
function extractCoordValue(it, isLat) {
  // 한국 영토 범위 검증으로 위도/경도 자동 판별
  const validLat = n => Number.isFinite(n) && n > 32 && n < 39;
  const validLng = n => Number.isFinite(n) && n > 123 && n < 132;
  const valid = isLat ? validLat : validLng;

  // 1) 알려진 키 우선 시도
  const known = isLat
    ? ['lat','latitude','LAT','LA','LCT_LA','LAT_CRDNT','y','yCrdnt','yCnt','wgs84Lat','위도']
    : ['lng','lon','longitude','lot','LO','LON','LCT_LO','LO_CRDNT','x','xCrdnt','xCnt','wgs84Lon','경도'];
  for (const k of known) {
    if (it[k] != null && it[k] !== '') {
      const n = parseFloat(it[k]);
      if (valid(n)) return n;
    }
  }
  // 2) 모든 키 스캔 — 이름에 lat/lon/경도/위도 패턴 포함
  for (const k of Object.keys(it)) {
    const lk = k.toLowerCase();
    const isLatKey = isLat && (lk === 'lat' || lk.includes('lat') || lk === 'la' || k === '위도' || lk.endsWith('_la'));
    const isLngKey = !isLat && (lk === 'lng' || lk === 'lon' || lk === 'lot' || lk.includes('lng') || lk.includes('lon') || lk === 'lo' || k === '경도' || lk.endsWith('_lo') || lk.endsWith('_lot'));
    if (isLatKey || isLngKey) {
      const n = parseFloat(it[k]);
      if (valid(n)) return n;
    }
  }
  // 3) 최후 수단 — 모든 값 스캔, 한국 영토 범위 안에 들어가는 숫자 찾기
  for (const k of Object.keys(it)) {
    const v = it[k];
    if (v == null) continue;
    const n = parseFloat(v);
    if (valid(n)) return n;
  }
  return NaN;
}

function extractName(it) {
  return it.schoolName || it.schulNm || it.SCHUL_NM || it.STD_SCHUL_NM
      || it.SCHUL_NM_2 || it.fcltyNm || it.name || it.NAME || it['학교명'] || '';
}

async function fetchSchoolsFromOpenData(officeCode) {
  const ODATA = window.API_CONFIG.ODATA;
  const siNm = window.OFFICE_TO_SI[officeCode];
  if (!siNm) return [];

  const cacheKey  = `odata:schools:${officeCode}:v2`;
  const backupKey = `odata:schools:${officeCode}:v2:backup`;
  const cached = window.cacheGet(cacheKey, 24 * 60 * 60 * 1000);
  if (cached) return cached;

  console.info('[ODATA] 공공데이터 학교 위치 호출 시작 — siNm=' + siNm);
  const all = [];
  const MAX_PAGES = 15;
  // URL 변형 — data.go.kr는 환경에 따라 도메인이 다름
  const urlBuilders = [
    (page) => `${ODATA.BASE}?serviceKey=${ODATA.KEY}&pageNo=${page}&numOfRows=1000&type=json&siNm=${encodeURIComponent(siNm)}`,
    (page) => `${ODATA.BASE}?serviceKey=${ODATA.KEY}&pageNo=${page}&numOfRows=1000&type=json&SI_NM=${encodeURIComponent(siNm)}`,
    (page) => `${ODATA.BASE}?serviceKey=${ODATA.KEY}&pageNo=${page}&numOfRows=1000&dataType=json&siNm=${encodeURIComponent(siNm)}`,
  ];

  let workingBuilder = null;
  for (let pageNo = 1; pageNo <= MAX_PAGES; pageNo++) {
    let j = null;
    if (workingBuilder) {
      // 첫 페이지에서 성공한 빌더 재사용
      j = await fetchJsonWithFallback(workingBuilder(pageNo), 15000);
    } else {
      // 첫 페이지: 여러 URL 변형 순차 시도
      for (const build of urlBuilders) {
        const url = build(pageNo);
        const t0 = Date.now();
        const r = await fetchJsonWithFallback(url, 15000);
        if (r) {
          j = r;
          workingBuilder = build;
          console.info('[ODATA] URL 변형 채택, ' + (Date.now()-t0) + 'ms');
          break;
        }
      }
    }
    if (!j) { if (pageNo === 1) break; else continue; }

    // 응답 형태 다양함 — 모든 가능한 경로 시도
    let items = j?.response?.body?.items
             || j?.response?.items
             || j?.body?.items
             || j?.items
             || j?.data
             || [];
    if (!Array.isArray(items)) {
      items = items?.item ? (Array.isArray(items.item) ? items.item : [items.item]) : [];
    }
    if (!items.length) {
      // 응답이 있지만 items 비었음 — 데이터 끝 또는 응답 구조 확인
      if (pageNo === 1) {
        console.warn('[ODATA] 첫 페이지 응답 구조 확인 필요 — keys:', Object.keys(j || {}));
        // 처음 응답 데이터 일부 출력 (디버그용)
        try { console.log('[ODATA] response sample:', JSON.stringify(j).slice(0, 800)); } catch {}
      }
      break;
    }
    all.push(...items);

    // 첫 응답에서 필드 구조 로그 (디버그)
    if (pageNo === 1 && items.length && !window._loggedODATAFields) {
      window._loggedODATAFields = true;
      console.log('[ODATA] 첫 아이템 필드명:', Object.keys(items[0]));
      console.log('[ODATA] 첫 아이템 샘플:', items[0]);
    }

    const body = j?.response?.body || j?.body || j;
    const total = parseInt(body?.totalCount || body?.total_count || 0, 10);
    if (total && all.length >= total) break;
    if (items.length < 1000) break;
  }

  if (!all.length) {
    try {
      const backup = JSON.parse(localStorage.getItem(backupKey) || 'null');
      if (backup && backup.length) {
        console.warn('[ODATA] 호출 실패 → 영구 백업 캐시 (' + backup.length + '건)');
        return backup;
      }
    } catch {}
    return [];
  }
  console.info('[ODATA] 원본 ' + all.length + '건 수신');

  const parsed = all.map(it => {
    const lat = extractCoordValue(it, true);
    const lng = extractCoordValue(it, false);
    const name = extractName(it);
    if (!Number.isFinite(lat) || !Number.isFinite(lng) || !name) return null;
    const code = it.schoolId || it.schulCode || it.SD_SCHUL_CODE || it.STD_SCHUL_CD || it.insttCode
              || (officeCode + Math.abs(hashStr(name + (it.rdnmadr || it.lnmadr || ''))).toString().padStart(7,'0').slice(0,7));
    const kind = it.schoolLevel || it.schulKndScCodeNm || it.SCHUL_KND_SC_NM || it.SCHUL_KND_NM || it.crseScCodeNm || it['학교종류'] || '학교';
    const addr = it.rdnmadr || it.schulRdnmaAdres || it.lnmadr || it.schulLnmAdres || it.LCT_DTL || it['도로명주소'] || '';
    return { code, office: officeCode, name, kind, addr, lat, lng, _src: 'odata' };
  }).filter(Boolean);

  console.info('[ODATA] 좌표 유효 ' + parsed.length + ' / 원본 ' + all.length + '건');

  if (parsed.length) {
    window.cacheSet(cacheKey, parsed);
    try { localStorage.setItem(backupKey, JSON.stringify(parsed)); } catch {}
    console.info('[ODATA] ✓ ' + parsed.length + '개 학교 파싱 완료 + 백업 저장');
  } else {
    console.error('[ODATA] ⚠️ 모든 항목에서 좌표/이름 추출 실패 — 첫 아이템 필드 확인 필요 (위 로그 참고)');
  }
  return parsed;
}

// 빠른 결정적 해시 (학교 코드 합성용)
function hashStr(s) {
  let h = 0; const str = String(s || '');
  for (let i = 0; i < str.length; i++) h = ((h * 31) + str.charCodeAt(i)) >>> 0;
  return h;
}

async function fetchProvinceSchools(officeCode, { maxPages = 5 } = {}) {
  // v8 — OSM(OpenStreetMap) 사전 빌드 정적 JSON을 1차 소스로 사용
  // 빌드 스크립트: build_schools_data.js (12,442개 학교 좌표)
  // 정적 파일이라 CORS·API키 문제 없음, 즉시 로드
  const cacheKey   = `neis:schools:${officeCode}:v8`;
  const backupKey  = `neis:schools:${officeCode}:v8:backup`;
  const cached = window.cacheGet(cacheKey, 24 * 60 * 60 * 1000);
  if (cached) return cached;

  // ━━━ 1차 ⭐ 정적 JSON (OSM 기반, 좌표 100% 정확) ━━━
  try {
    const t0 = Date.now();
    const r = await fetch(`./data/schools-${officeCode}.json`, { cache: 'force-cache' });
    if (r.ok) {
      const list = await r.json();
      if (Array.isArray(list) && list.length) {
        console.info('[STATIC] ✓ data/schools-' + officeCode + '.json — ' + list.length + '개 학교 (' + (Date.now()-t0) + 'ms)');
        window.cacheSet(cacheKey, list);
        try { localStorage.setItem(backupKey, JSON.stringify(list)); } catch {}
        return list;
      }
    }
  } catch (e) {
    console.warn('[STATIC] 정적 JSON 로드 실패:', e?.message || e);
  }

  // ━━━ 2차: 공공데이터포털 (data.go.kr) — 키 활성화 시 ━━━
  let result = [];
  try {
    const odata = await fetchSchoolsFromOpenData(officeCode);
    if (odata && odata.length) {
      console.info('[fetchProvinceSchools] 공공데이터 ' + odata.length + '건 채택');
      result = odata;
    }
  } catch (e) {
    console.warn('[ODATA] 호출 중 오류:', e?.message || e);
  }

  // 결과 있으면 즉시 캐시·반환
  if (result.length) {
    window.cacheSet(cacheKey, result);
    try { localStorage.setItem(backupKey, JSON.stringify(result)); } catch {}
    return result;
  }

  // ━━━ 3차: NEIS schoolInfo (좌표 없음, 이름·주소만) ━━━
  console.info('[NEIS] 정적·공공데이터 실패 → NEIS schoolInfo 시도 — office=' + officeCode);
  const all = [];
  let pageFailures = 0;
  for (let page = 1; page <= maxPages; page++) {
    const url = `${NEIS.BASE}/schoolInfo?KEY=${NEIS.KEY}&Type=json&pIndex=${page}&pSize=1000&ATPT_OFCDC_SC_CODE=${officeCode}`;
    let j = null;
    // 페이지 단위 2회 재시도 (15초 + 12초)
    for (let attempt = 1; attempt <= 2 && !j; attempt++) {
      const t0 = Date.now();
      j = await fetchJsonWithFallback(url, attempt === 1 ? 15000 : 12000);
      if (!j) console.warn('[NEIS] page=' + page + ' attempt=' + attempt + ' 실패 (' + (Date.now()-t0) + 'ms)');
    }
    if (!j) { pageFailures++; if (page === 1) break; else continue; }
    const rows = j?.schoolInfo?.[1]?.row || [];
    if (!rows.length) break;
    all.push(...rows);
    if (rows.length < 1000) break;
  }
  if (!all.length) {
    // 모든 NEIS 호출 실패 — 영구 백업 캐시 시도
    try {
      const backup = JSON.parse(localStorage.getItem(backupKey) || 'null');
      if (backup && backup.length) {
        console.warn('[NEIS] 모든 호출 실패 → 영구 백업 캐시 사용 (' + backup.length + '건)');
        return backup;
      }
    } catch {}
    console.error('[NEIS] schoolInfo 완전 실패 — 백업 캐시 없음');
    return [];
  }
  console.info('[NEIS] 원본 ' + all.length + '건 수신');
  // NEIS는 좌표를 제공하지 않으므로, 좌표 없는 학교는 지도에서 제외
  // (이전에는 자치구 중심 + 지터로 합성했으나 사용자 입장에서 잘못된 위치로 보임)
  const parsed = all.map(s => {
    const code = s.SD_SCHUL_CODE;
    const office = s.ATPT_OFCDC_SC_CODE;
    const name = s.SCHUL_NM;
    const kind = s.SCHUL_KND_SC_NM;
    const addr = s.ORG_RDNMA || s.ORG_RDNDA || '';
    // 일부 NEIS 파생 데이터에 좌표가 있는 경우만 사용 (실제로는 거의 없음)
    const lat = parseFloat(s.LAT_CRDNT ?? s.LAT);
    const lng = parseFloat(s.LO_CRDNT ?? s.LON);
    if (!code || !name) return null;
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null; // 좌표 없으면 제외
    return { code, office, name, kind, addr, lat, lng, _src: 'neis' };
  }).filter(Boolean);
  console.info('[NEIS] 좌표 유효 ' + parsed.length + ' / 원본 ' + all.length + '건');
  if (parsed.length) {
    window.cacheSet(cacheKey, parsed);
    // 영구 백업 — TTL 무관, 다음 실행 때 NEIS 완전 다운 시 사용
    try { localStorage.setItem(backupKey, JSON.stringify(parsed)); } catch {}
    console.info('[NEIS] ✓ ' + parsed.length + '개 학교 파싱 완료 + 백업 저장');
  }
  return parsed;
}

const SCHOOLINFO = window.API_CONFIG.SCHOOLINFO;
async function fetchSchoolDetail({ schoolCode, kind, office }) {
  const cacheKey = `schoolinfo:detail:${schoolCode}:v6`;
  const cached = window.cacheGet(cacheKey, 24 * 60 * 60 * 1000);
  if (cached) return cached;

  // ━━━ 0차: 백엔드 프록시 (학교알리미 + NEIS 통합, 가장 정확) ━━━

      if (r.ok) {
        const j = await r.json();
        if (j && (j.students || j.teachers)) {
          window.cacheSet(cacheKey, j);
          return j;
        }
      }
    } catch {}
  }

  // ━━━ 1차: 학교알리미 직접 (CORS 프록시 5중 폴백, 백엔드 없는 환경용) ━━━
  const kindCode = kind?.includes('초') ? '02' : kind?.includes('중') ? '03' : kind?.includes('고') ? '04' : '02';
  const year = new Date().getFullYear();
  const baseUrl = `${SCHOOLINFO.BASE}?apiKey=${SCHOOLINFO.KEY}&apiType=student_info&pbanYr=${year}&schulKndCode=${kindCode}&schulCode=${schoolCode}`;
  const variants = [
    baseUrl,
    `https://corsproxy.io/?${encodeURIComponent(baseUrl)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(baseUrl)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(baseUrl)}`,
    `https://corsproxy.org/?${encodeURIComponent(baseUrl)}`,
  ];
  for (const v of variants) {
    try {
      const r = await window.fetchWithTimeout(v, {}, SCHOOLINFO.TIMEOUT);
      if (!r || !r.ok) continue;
      const txt = await r.text();
      if (!txt || txt.length < 80) continue;
      // 다양한 필드명 시도 (학교알리미는 시기·버전별로 다름)
      const studentMatch =
        txt.match(/<(?:STD|STDNT|TT_STD)_CNT>\s*(\d+)/i) ||
        txt.match(/"(?:STD|STDNT|TT_STD)_CNT"\s*:\s*"?(\d+)/i) ||
        txt.match(/(?:총\s*학생\s*수|전체\s*학생\s*수|학생\s*수)[^\d]{0,15}(\d{2,5})/);
      const teacherMatch =
        txt.match(/<(?:TCHR|TEACHR)_CNT>\s*(\d+)/i) ||
        txt.match(/"(?:TCHR|TEACHR)_CNT"\s*:\s*"?(\d+)/i) ||
        txt.match(/(?:총\s*교원\s*수|교원\s*수|교사\s*수)[^\d]{0,15}(\d{1,4})/);
      const satMatch =
        txt.match(/<MEAL_STSF_RT>\s*([\d.]+)/i) ||
        txt.match(/(?:급식\s*만족도|만족도)[^\d]{0,15}([\d.]+)/);
      if (studentMatch || teacherMatch) {
        const out = {
          students: studentMatch ? parseInt(studentMatch[1]) : null,
          teachers: teacherMatch ? parseInt(teacherMatch[1]) : null,
          satisfaction: satMatch ? Math.round(parseFloat(satMatch[1])) : null,
          source: 'schoolinfo',
        };
        window.cacheSet(cacheKey, out);
        return out;
      }
    } catch {}
  }

  // ━━━ 2차: NEIS classInfo로 학급 수 기반 추정 ━━━
  // 학급 수 × 학교급별 평균 학급당 학생수로 더 정확한 추정 가능
  if (office) {
    try {
      const year = new Date().getFullYear();
      const niesUrl = `${NEIS.BASE}/classInfo?KEY=${NEIS.KEY}&Type=json&pIndex=1&pSize=200&ATPT_OFCDC_SC_CODE=${office}&SD_SCHUL_CODE=${schoolCode}&AY=${year}`;
      const j = await fetchJsonWithFallback(niesUrl, 12000);
      const rows = j?.classInfo?.[1]?.row;
      if (rows && rows.length) {
        const classCount = rows.length;
        // 학교급별 평균 학급당 학생수 (교육부 통계 근사)
        const avgPerClass = kind?.includes('초') ? 22 : kind?.includes('중') ? 26 : 28;
        const students = Math.round(classCount * avgPerClass);
        // 교원수: 학급당 약 1.4명 + 관리·전담 5명 (소형) ~ 8명 (대형)
        const baseTeachers = Math.round(classCount * 1.4) + (classCount > 30 ? 8 : classCount > 15 ? 6 : 4);
        const out = {
          students,
          teachers: baseTeachers,
          satisfaction: null,
          classCount,
          source: 'neis-classInfo',
        };
        window.cacheSet(cacheKey, out);
        return out;
      }
    } catch {}
  }

  // ━━━ 3차: 결정적 추정 (마지막 폴백) ━━━
  let h = 0; for (let i=0;i<schoolCode.length;i++) h=(h*31+schoolCode.charCodeAt(i))>>>0;
  const out = {
    students: kind?.includes('초') ? 280+(h%720) : kind?.includes('중') ? 320+(h%680) : 480+(h%820),
    teachers: kind?.includes('초') ? 18+(h%32)  : kind?.includes('중') ? 24+(h%30)  : 38+(h%42),
    satisfaction: 65 + (h%30),
    operationType: (h%10) < 8 ? '직영' : '위탁',
    cookingType: (h%10) < 9 ? '조리교' : '비조리교',
    foundedYear: 1960 + (h%64),
    source: 'fallback',
  };
  window.cacheSet(cacheKey, out);
  return out;
}

// 주간 식단 (5일치)
async function fetchWeekMeals({ officeCode, schoolCode, baseDate }) {
  const base = baseDate || new Date();
  const day = base.getDay() || 7;
  const monday = new Date(base); monday.setDate(base.getDate() - (day-1));
  const dates = [];
  for (let i = 0; i < 5; i++) {
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    dates.push(d);
  }
  const results = await Promise.all(dates.map(async d => {
    const m = await fetchTodayMeal({ officeCode, schoolCode, date: formatYmd(d) });
    return { date: d, meal: m };
  }));
  return results;
}

async function fetchTodayMeal({ officeCode, schoolCode, date }) {
  const ymd = date || formatYmd(new Date());
  const cacheKey = `neis:meal:${officeCode}:${schoolCode}:${ymd}`;
  const cached = window.cacheGet(cacheKey, 60 * 60 * 1000);
  if (cached) return cached;
  const url = `${NEIS.BASE}/mealServiceDietInfo?KEY=${NEIS.KEY}&Type=json&pIndex=1&pSize=10&ATPT_OFCDC_SC_CODE=${officeCode}&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${ymd}`;
  const j = await fetchJsonWithFallback(url, NEIS.TIMEOUT);
  if (!j) return null;
  const rows = j?.mealServiceDietInfo?.[1]?.row || [];
  if (!rows.length) return null;
  const lunch = rows.find(r => r.MMEAL_SC_NM === '중식') || rows[0];
  const rawDishes = (lunch.DDISH_NM || '').split('<br/>').map(s => s.trim()).filter(Boolean);
  const out = {
    mealType: lunch.MMEAL_SC_NM, date: lunch.MLSV_YMD,
    menus: rawDishes.map(m => m.replace(/\s*\([\d.]+\)/g, '').trim()),
    allergyMenus: rawDishes,
    kcal: lunch.CAL_INFO,
    nutrition: (lunch.NTR_INFO || '').split('<br/>').map(s => s.trim()).filter(Boolean),
    origin: (lunch.ORPLC_INFO || '').split('<br/>').map(s => s.trim()).filter(Boolean),
  };
  window.cacheSet(cacheKey, out);
  return out;
}

function formatYmd(d) {
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

// 결정적 의사 랜덤 [0,1) — seed 기반 자연스러운 분포
function det01(seed) {
  const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// Generic 시도 폴백 생성기 — province 선택 시점에 lazy 호출
function generateProvinceFallback(officeCode, center) {
  const cfg = PROVINCE_FALLBACK_CONFIG[officeCode];
  if (!cfg) return [];
  const list = [];
  let codeCounter = 1;
  // district별 학교 수 분배 (균등 분배)
  const perDistrict = Math.max(1, Math.floor(cfg.count / cfg.districts.length));
  // 각 district마다 의사 중심 좌표 — 시도 중심 주변에 분산
  const districtCenters = cfg.districts.map((_, di) => {
    const angle = (di / cfg.districts.length) * Math.PI * 2;
    const r = cfg.spread * 0.55 * (0.4 + det01(di*31) * 0.6);
    return [
      center[0] + Math.sin(angle) * r,
      center[1] + Math.cos(angle) * r * 1.2,
    ];
  });
  // 실제 학교명만 사용 — 각 district의 OTHER_REAL_SCHOOLS 데이터 기반
  let seedCounter = 0;
  cfg.districts.forEach((districtName, districtIdx) => {
    const dCenter = districtCenters[districtIdx];
    const realByKind = OTHER_REAL_SCHOOLS[districtName] || {};
    const usedNames = new Set();
    ['초등학교','중학교','고등학교'].forEach(kind => {
      const realNames = realByKind[kind] || [];
      realNames.forEach((name, i) => {
        if (usedNames.has(name)) return;
        usedNames.add(name);
        // 가우시안 분포로 좌표 생성
        const u1 = det01(seedCounter*7 + officeCode.charCodeAt(0));
        const u2 = det01(seedCounter*13 + officeCode.charCodeAt(1) + 7);
        seedCounter++;
        const z1 = Math.sqrt(-2*Math.log(u1+0.0001)) * Math.cos(2*Math.PI*u2);
        const z2 = Math.sqrt(-2*Math.log(u1+0.0001)) * Math.sin(2*Math.PI*u2);
        const localSpread = cfg.spread * 0.16;
        const lat = dCenter[0] + Math.max(-2.0, Math.min(2.0, z1)) * localSpread * 0.7;
        const lng = dCenter[1] + Math.max(-2.0, Math.min(2.0, z2)) * localSpread;
        list.push({
          code: `${officeCode}${String(codeCounter++).padStart(5,'0')}`,
          office: officeCode,
          name,
          kind,
          lat, lng,
          addr: `${cfg.full} ${districtName}`,
        });
      });
    });
  });
  return list;
}

        const seedA = di*1000 + i*7 + kind.length*3;

        const u1 = det01(seedA);

        const z1 = mag * Math.cos(2*Math.PI*u2);
        const z2 = mag * Math.sin(2*Math.PI*u2);

        const offLat = Math.max(-2.0, Math.min(2.0, z1)) * localSpread * 0.75;

// 결정적 일별 식단 생성기 — NEIS 응답 없을 때 폴백
window.generateDailyMeal = function(schoolCode, dateObj) {
  // dateObj: Date instance
  const dow = dateObj.getDay();
  const ymd = `${dateObj.getFullYear()}${String(dateObj.getMonth()+1).padStart(2,'0')}${String(dateObj.getDate()).padStart(2,'0')}`;
  // 주말은 점심 없음
  if (dow === 0 || dow === 6) {
    return { isWeekend: true, date: ymd };
  }
  let h = 0; const seed = `${schoolCode}-${ymd}`;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  const pick = (arr, off=0) => arr[(h+off) % arr.length];

  const RICE = ['잡곡밥','백미밥','콩나물밥','보리밥','현미밥','오곡밥','버섯영양밥','김치볶음밥','카레라이스','짜장밥'];
  const SOUP = ['미역국','된장찌개','김치찌개','콩나물국','시래기국','북엇국','계란국','두부된장국','떡국','어묵국','오징어국','쇠고기뭇국'];
  const MAIN = ['제육볶음','불고기','닭갈비','갈비찜','고등어구이','삼치구이','돈까스','오징어볶음','두부조림','생선까스','닭다리구이','동그랑땡','함박스테이크','탕수육','데리야끼치킨','마파두부'];
  const SIDE = ['시금치나물','콩나물무침','무생채','오이무침','감자조림','어묵볶음','계란말이','브로콜리무침','단호박샐러드','표고버섯볶음','연근조림','우엉조림'];
  const KIM  = ['배추김치','깍두기','총각김치','열무김치','오이김치'];
  const DESSERT = ['요거트','오렌지','사과','바나나','수박','참외','방울토마토','우유','두유','제철과일'];

  const menus = [
    pick(RICE, 1),
    pick(SOUP, 7),
    pick(MAIN, 13),
    pick(SIDE, 23),
    pick(KIM, 31),
    pick(DESSERT, 37),
  ];
  // 학년 무관 — 일반적인 칼로리
  const kcal = 620 + ((h % 200) - 50);

  // 영양 정보
  const carbs = (75 + (h%30)).toFixed(1);
  const protein = (22 + (h%14)).toFixed(1);
  const fat = (15 + (h%9)).toFixed(1);
  const vitC = (15 + (h%20)).toFixed(1);
  const calcium = 200 + (h%180);
  const iron = (3 + (h%4)).toFixed(1);

  return {
    isWeekend: false,
    isGenerated: true,
    date: ymd,
    mealType: '중식',
    menus,
    allergyMenus: menus,
    kcal: `${kcal} Kcal`,
    nutrition: [
      `탄수화물(g) : ${carbs}`,
      `단백질(g) : ${protein}`,
      `지방(g) : ${fat}`,
      `비타민C(mg) : ${vitC}`,
      `칼슘(mg) : ${calcium}`,
      `철분(mg) : ${iron}`,
    ],
    origin: ['쌀: 국내산','김치류: 국내산','돼지고기: 국내산','계란: 국내산','쇠고기: 국내산'],
  };
};

// Claude API 호출 헬퍼 — 사용자 입력 키로 직접 호출 (browser direct)
window.callClaude = async function(apiKey, prompt, { model = 'claude-sonnet-4-5', maxTokens = 1024 } = {}) {
  if (!apiKey) throw new Error('Claude API 키 미설정');
  const url = 'https://api.anthropic.com/v1/messages';
  const body = { model, max_tokens: maxTokens, messages: [{ role:'user', content: prompt }] };
  const tryFetch = async (target) => {
    const r = await fetch(target, {
      method:'POST',
      headers: {
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };
  try {
    const d = await tryFetch(url);
    return d?.content?.[0]?.text || '';
  } catch (e) {
    const d = await tryFetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
    return d?.content?.[0]?.text || '';
  }
};

// OpenAI (ChatGPT) API 호출
window.callOpenAI = async function(apiKey, prompt, { model = 'gpt-4o-mini', maxTokens = 1024 } = {}) {
  if (!apiKey) throw new Error('OpenAI API 키 미설정');
  const url = 'https://api.openai.com/v1/chat/completions';
  const body = {
    model, max_tokens: maxTokens,
    messages: [{ role:'user', content: prompt }],
    temperature: 0.7,
  };
  const tryFetch = async (target) => {
    const r = await fetch(target, {
      method:'POST',
      headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };
  try {
    const d = await tryFetch(url);
    return d?.choices?.[0]?.message?.content || '';
  } catch (e) {
    const d = await tryFetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
    return d?.choices?.[0]?.message?.content || '';
  }
};

// Google Gemini API 호출
window.callGemini = async function(apiKey, prompt, { model = 'gemini-1.5-flash', maxTokens = 1024 } = {}) {
  if (!apiKey) throw new Error('Gemini API 키 미설정');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
  const body = {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: { maxOutputTokens: maxTokens, temperature: 0.7 },
  };
  const tryFetch = async (target) => {
    const r = await fetch(target, {
      method:'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };
  try {
    const d = await tryFetch(url);
    return d?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  } catch (e) {
    const d = await tryFetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
    return d?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  }
};

// 통합 AI 호출 — 선택된 provider 기반 디스패치
window.callAI = async function(provider, keys, prompt, opts = {}) {
  if (provider === 'openai') {
    if (!keys.openai) throw new Error('OpenAI 키 미설정');
    return window.callOpenAI(keys.openai, prompt, opts);
  }
  if (provider === 'gemini') {
    if (!keys.gemini) throw new Error('Gemini 키 미설정');
    return window.callGemini(keys.gemini, prompt, opts);
  }
  // default: claude
  if (!keys.claude) throw new Error('Claude 키 미설정');
  return window.callClaude(keys.claude, prompt, opts);
};

    model: opts.model || 'gpt-4o-mini',
    max_tokens: opts.maxTokens || 1500,
    messages: [{
      role:'user',
      content: [
        { type:'text', text:prompt },
        { type:'image_url', image_url:{ url:`data:${mediaType};base64,${imageBase64}` }},
      ],
    }],
    temperature: 0.5,
  };
  const tryFetch = async (target) => {
    const r = await fetch(target, {
      method:'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${apiKey}` },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };
  try {
    const d = await tryFetch(url);
    return d?.choices?.[0]?.message?.content || '';
  } catch (e) {
    const d = await tryFetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
    return d?.choices?.[0]?.message?.content || '';
  }
};

window.callGeminiVision = async function(apiKey, prompt, imageBase64, mediaType = 'image/jpeg', opts = {}) {
  if (!apiKey) throw new Error('Gemini API 키 미설정');
  const model = opts.model || 'gemini-1.5-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
  const body = {
    contents: [{ parts: [
      { text: prompt },
      { inline_data: { mime_type: mediaType, data: imageBase64 }},
    ]}],
    generationConfig: { maxOutputTokens: opts.maxTokens || 1500, temperature: 0.5 },
  };
  const tryFetch = async (target) => {
    const r = await fetch(target, {
      method:'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };
  try {
    const d = await tryFetch(url);
    return d?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  } catch (e) {
    const d = await tryFetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
    return d?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  }
};

// Canvas → JPEG 변환 공통 로직
window._canvasToJPEG = function(source, w0, h0, maxSize) {
  const scale = Math.min(maxSize / w0, maxSize / h0, 1);
  const w = Math.max(1, Math.round(w0 * scale));
  const h = Math.max(1, Math.round(h0 * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  if (!ctx) throw new Error('Canvas 컨텍스트 없음');
  ctx.drawImage(source, 0, 0, w, h);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
  if (!dataUrl || dataUrl === 'data:,') throw new Error('Canvas 변환 결과 비어있음');
  const base64 = dataUrl.split(',')[1] || '';
  if (!base64) throw new Error('Base64 변환 실패');
  return { dataUrl, base64, mediaType:'image/jpeg', width:w, height:h };
};

// 1) createImageBitmap 시도 (모던 브라우저, HEIC·다양한 포맷 지원)
window._loadViaBitmap = function(file) {
  return new Promise((resolve, reject) => {
    if (typeof createImageBitmap !== 'function') return reject(new Error('createImageBitmap 미지원'));
    createImageBitmap(file).then(resolve).catch(reject);
  });
};

// 2) URL.createObjectURL + Image 시도
window._loadViaObjectURL = function(file) {
  return new Promise((resolve, reject) => {
    let url;
    try { url = URL.createObjectURL(file); } catch (e) { return reject(new Error('URL 생성 실패: ' + e.message)); }
    const img = new Image();
    let to = setTimeout(() => { URL.revokeObjectURL(url); reject(new Error('Object URL 로드 타임아웃')); }, 8000);
    img.onload = () => { clearTimeout(to); URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { clearTimeout(to); URL.revokeObjectURL(url); reject(new Error('Object URL 이미지 로드 실패')); };
    img.src = url;
  });
};

// 3) FileReader → data URL → Image (가장 호환성 좋음, 메모리 사용 큼)
window._loadViaFileReader = function(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      let to = setTimeout(() => reject(new Error('FileReader 로드 타임아웃')), 8000);
      img.onload = () => { clearTimeout(to); resolve(img); };
      img.onerror = () => { clearTimeout(to); reject(new Error('FileReader 이미지 로드 실패')); };
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('FileReader 읽기 실패'));
    reader.readAsDataURL(file);
  });
};

// 이미지 압축 — 3단계 폴백 (Bitmap → ObjectURL → FileReader)
window.compressImage = async function(file, maxSize = 1024) {
  if (!file) throw new Error('파일이 없습니다');
  const errors = [];

  // 1) createImageBitmap (가장 빠르고 호환성 좋음)
  try {
    const bitmap = await window._loadViaBitmap(file);
    const w0 = bitmap.width, h0 = bitmap.height;
    if (w0 && h0) {
      const result = window._canvasToJPEG(bitmap, w0, h0, maxSize);
      try { bitmap.close && bitmap.close(); } catch {}
      return result;
    }
    errors.push('Bitmap: 크기 읽기 실패');
  } catch (e) { errors.push('Bitmap: ' + e.message); }

  // 2) Object URL + Image
  try {
    const img = await window._loadViaObjectURL(file);
    const w0 = img.naturalWidth || img.width;
    const h0 = img.naturalHeight || img.height;
    if (w0 && h0) return window._canvasToJPEG(img, w0, h0, maxSize);
    errors.push('ObjectURL: 크기 읽기 실패');
  } catch (e) { errors.push('ObjectURL: ' + e.message); }

  // 3) FileReader (최후 폴백)
  try {
    const img = await window._loadViaFileReader(file);
    const w0 = img.naturalWidth || img.width;
    const h0 = img.naturalHeight || img.height;
    if (w0 && h0) return window._canvasToJPEG(img, w0, h0, maxSize);
    errors.push('FileReader: 크기 읽기 실패');
  } catch (e) { errors.push('FileReader: ' + e.message); }

  // 모든 방법 실패
  console.warn('compressImage all methods failed:', errors);
  throw new Error('이미지를 로드할 수 없습니다 (브라우저가 이 형식을 지원하지 않습니다). JPG·PNG로 저장 후 다시 시도해주세요.');
};

window.ALLERGY_MAP = {
  '1':'난류','2':'우유','3':'메밀','4':'땅콩','5':'대두','6':'밀','7':'고등어','8':'게',
  '9':'새우','10':'돼지고기','11':'복숭아','12':'토마토','13':'아황산류','14':'호두',
  '15':'닭고기','16':'쇠고기','17':'오징어','18':'조개류','19':'잣',
};
window.parseAllergies = function(menuStr) {
  const m = menuStr.match(/\(([\d.]+)\)/);
  if (!m) return [];
  return m[1].split('.').filter(Boolean).map(n => window.ALLERGY_MAP[n]).filter(Boolean);
};

// 식이 선호별 메뉴 패턴 (할랄/코셔/채식/비건/돼지/저나트륨)
window.DIETARY_PATTERNS = {
  noPork:     { label:'돼지고기 제외', re: /돼지|제육|돈까스|족발|순대|로스|삼겹|돈|삼겹살|보쌈/, severity:'high' },
  halal:      { label:'할랄',         re: /돼지|제육|돈까스|족발|순대|보쌈|삼겹|햄|소시지|베이컨/, severity:'high' },

// 식단 위험도 체크 — meal 객체 + 사용자 알레르기/식이 → 트리거된 위험 반환
window.checkMealRisk = function(meal, myAllergies = [], dietaryPrefs = {}) {
  const risks = { allergies: [], dietary: [], menusWithAllergy: {} };
  if (!meal) return risks;

  // 알레르기 — NEIS 표시 코드(1.2.5...) 파싱
  const triggered = new Set();
  const menuRisks = {};
  const menus = meal.allergyMenus || meal.menus || [];
  menus.forEach((m, idx) => {
    const tags = window.parseAllergies(m);
    const matched = tags.filter(t => myAllergies.includes(t));
    if (matched.length) {
      const key = (meal.menus && meal.menus[idx]) || m.replace(/\s*\([\d.]+\)/g, '').trim();
      menuRisks[key] = matched;
      matched.forEach(t => triggered.add(t));
    }
  });
  risks.allergies = [...triggered];
  risks.menusWithAllergy = menuRisks;

  // 식이 선호 vs 메뉴 텍스트
  const menuText = (meal.menus || []).join(' ');
  Object.entries(window.DIETARY_PATTERNS).forEach(([key, pat]) => {
    if (dietaryPrefs[key] && pat.re.test(menuText)) {
      risks.dietary.push(pat.label);
    }
  });

  // 저나트륨 — 영양 정보 기반
  if (dietaryPrefs.lowSodium && meal.nutrition) {
    const line = meal.nutrition.find(n => n.includes('나트륨'));
    if (line) {
      const m = line.match(/(\d+\.?\d*)/);
      if (m && parseFloat(m[1]) > 1000) risks.dietary.push('나트륨 과다 (1,000mg 초과)');
    }
  }
  return risks;
};

// 자동 번역기 — DOM 워커 + LLM 배치 번역 + localStorage 캐시
// 한국어 외 언어 선택 시 화면의 모든 한글 텍스트를 자동 번역
// ═══════════════════════════════════════════════════════════════
window.autoTranslator = {
  cache: {},                  // { 'en:안녕': 'Hello' }
  origStore: new WeakMap(),   // textNode → 원본 한글
  currentLang: 'ko',
  observer: null,
  applying: false,            // MutationObserver 무한루프 방지
  busy: false,
  scheduled: null,
  HANGUL: /[가-힯ᄀ-ᇿ㄰-㆏]/,
  SKIP_SEL: 'script,style,noscript,.leaflet-container,.no-translate,svg',

  init() {
    try { this.cache = JSON.parse(localStorage.getItem('gs:trans-cache') || '{}'); } catch {}
    if (this.cache._v !== 1) this.cache = { _v: 1 };

    this.observer = new MutationObserver(muts => {
      if (this.applying || this.currentLang === 'ko') return;
      let hasNew = false;
      for (const m of muts) {
        if (m.type === 'childList' && m.addedNodes.length) hasNew = true;
        else if (m.type === 'characterData') hasNew = true;
        if (hasNew) break;
      }
      if (!hasNew) return;
      clearTimeout(this.scheduled);
      this.scheduled = setTimeout(() => this.run(this.currentLang), 250);
    });
  },

  saveCache() {
    try { localStorage.setItem('gs:trans-cache', JSON.stringify(this.cache)); } catch {}
  },

  // DOM에서 한글 텍스트 노드 수집
  collectNodes(root) {
    const nodes = [];
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (node) => {
        const t = node.nodeValue;
        if (!t || !t.trim()) return NodeFilter.FILTER_REJECT;
        if (!this.HANGUL.test(t)) return NodeFilter.FILTER_REJECT;
        const p = node.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        if (p.closest(this.SKIP_SEL)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let n; while ((n = walker.nextNode())) nodes.push(n);
    return nodes;
  },

  // input/textarea placeholder + button title/aria-label도 번역
  collectAttrs(root) {
    const out = [];
    root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el => {
      if (el.closest(this.SKIP_SEL)) return;
      ['placeholder','title','aria-label'].forEach(attr => {
        const v = el.getAttribute(attr);
        if (v && this.HANGUL.test(v)) out.push({ el, attr, value: v });
      });
    });
    return out;
  },

  async translateBatch(strings, lang) {
    if (!strings.length) return;
    const aiProvider = localStorage.getItem('gs:aiProvider') || 'claude';
    const keys = {
      claude: localStorage.getItem('gs:claudeKey') || '',
      openai: localStorage.getItem('gs:openaiKey') || '',
      gemini: localStorage.getItem('gs:geminiKey') || '',
    };
    // Gemini 우선 (가장 빠르고 저렴), 그다음 GPT, 그다음 Claude
    let provider = null;
    if (keys.gemini) provider = 'gemini';
    else if (keys.openai) provider = 'openai';
    else if (keys.claude) provider = 'claude';
    if (!provider) {
      console.warn('[autoTranslator] AI 키 없음 — 번역 불가. 설정에서 등록해주세요.');
      return;
    }

    const langName = (window.I18N[lang] && window.I18N[lang].name) || lang;
    const langNative = (window.I18N[lang] && window.I18N[lang].native) || lang;

    // 50개씩 청크로 나눠 번역 (토큰 한도 + 안정성)
    const CHUNK = 50;
    for (let i = 0; i < strings.length; i += CHUNK) {
      const slice = strings.slice(i, i + CHUNK);
      const prompt = `Translate the following Korean UI strings to ${langName} (${langNative}).
Rules:
- Output ONLY a JSON array of strings, same order, same length as input.
- Keep numbers, emojis, units (kcal, %, 등) unchanged.
- Keep proper nouns (NEIS, AI, GPT) as is.
- Translate naturally for a mobile app UI — short and friendly.
- DO NOT include any explanation or markdown.

Input array (${slice.length} items):
${JSON.stringify(slice, null, 0)}

Output:`;

      try {
        const text = await window.callAI(provider, keys, prompt, { maxTokens: 2000 });
        // JSON 배열 파싱
        const m = text.match(/\[[\s\S]*\]/);
        if (!m) continue;
        let arr;
        try { arr = JSON.parse(m[0]); } catch { continue; }
        if (!Array.isArray(arr)) continue;
        slice.forEach((src, idx) => {
          if (typeof arr[idx] === 'string' && arr[idx].trim()) {
            this.cache[lang + '||' + src] = arr[idx];
          }
        });
      } catch (e) {
        console.warn('[autoTranslator] batch failed', e);
      }
    }
    this.saveCache();
  },

  applyToDOM(lang) {
    this.applying = true;
    try {
      // 텍스트 노드
      const nodes = this.collectNodes(document.body);
      nodes.forEach(node => {
        // 원본 저장 (최초 한 번)
        if (!this.origStore.has(node)) {
          this.origStore.set(node, node.nodeValue);
        }
        const orig = this.origStore.get(node);
        if (lang === 'ko') {
          node.nodeValue = orig;
          return;
        }
        const trimmed = orig.trim();
        const cached = this.cache[lang + '||' + trimmed];
        if (cached) {
          // 앞뒤 공백 보존
          const lead = orig.match(/^\s*/)[0];
          const trail = orig.match(/\s*$/)[0];
          node.nodeValue = lead + cached + trail;
        } else {
          node.nodeValue = orig;
        }
      });

      // 속성
      const attrs = this.collectAttrs(document.body);
      attrs.forEach(({ el, attr, value }) => {
        const key = '__orig_' + attr;
        if (!el[key]) el[key] = value;
        if (lang === 'ko') {
          el.setAttribute(attr, el[key]);
          return;
        }
        const cached = this.cache[lang + '||' + el[key].trim()];
        if (cached) el.setAttribute(attr, cached);
      });
    } finally {
      this.applying = false;
    }
  },

  // 캐시에 없는 한글 문자열만 추출
  collectUncached(lang) {
    const nodes = this.collectNodes(document.body);
    const attrs = this.collectAttrs(document.body);
    const set = new Set();
    nodes.forEach(n => {
      const t = (this.origStore.get(n) || n.nodeValue).trim();
      if (t && !this.cache[lang + '||' + t]) set.add(t);
    });
    attrs.forEach(({ el, attr, value }) => {
      const t = ((el['__orig_' + attr]) || value).trim();
      if (t && !this.cache[lang + '||' + t]) set.add(t);
    });
    return Array.from(set);
  },

  async run(lang) {
    this.currentLang = lang;
    if (this.busy) return;
    this.busy = true;

    try {
      // 1) 일단 캐시 기반으로 즉시 적용
      this.applyToDOM(lang);

      // 2) ko면 끝
      if (lang === 'ko') return;

      // 3) 캐시 미스 항목 수집 → LLM 번역
      const uncached = this.collectUncached(lang);
      if (uncached.length) {
        // 토스트
        this.showToast('🌐 ' + uncached.length + '개 항목 번역 중…');
        await this.translateBatch(uncached, lang);
        this.applyToDOM(lang);
        this.showToast('✓ 번역 완료');
      }
    } finally {
      this.busy = false;
    }
  },

  showToast(msg) {
    let el = document.getElementById('__autotrans-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = '__autotrans-toast';
      el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:99999;font-family:system-ui;pointer-events:none;transition:opacity 0.3s;';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
  },

  startObserver() {
    if (this.observer) {
      this.observer.observe(document.body, { childList: true, subtree: true, characterData: true });
    }
  },
};

// 초기화
if (typeof window !== 'undefined') {
  window.autoTranslator.init();
  // DOM ready 시 옵저버 시작
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => window.autoTranslator.startObserver());
  } else {
    setTimeout(() => window.autoTranslator.startObserver(), 100);
  }
}

window.translateMenu = function(menu, lang) {
  if (!lang || lang === 'ko' || !menu) return menu;
  const cleaned = menu.replace(/\s*\([\d.]+\)/g, '').trim();
  return (window.MENU_TRANSLATIONS[cleaned] && window.MENU_TRANSLATIONS[cleaned][lang]) || cleaned;
};

// 메뉴 텍스트에서 식재료 인식 → CO2 추정 (1인 분량 120g 기준)
window.estimateMealCO2 = function(menus) {
  if (!menus || !Array.isArray(menus)) return { total:0, perItem:[] };
  let total = 0;
  const perItem = [];
  menus.forEach(menu => {
    if (!menu) return;
    let bestFactor = 0;
    let bestKey = '';
    Object.entries(window.CO2_FACTORS_KG).forEach(([key, val]) => {
      if (menu.includes(key) && val > bestFactor) {
        bestFactor = val;
        bestKey = key;
      }
    });
    if (bestFactor === 0) { bestFactor = 1.2; bestKey = '기타'; }
    const portion = 0.12; // 1인 분량 120g
    const co2g = bestFactor * portion * 1000; // grams
    total += co2g;
    perItem.push({ menu, factor:bestFactor, co2g:Math.round(co2g), matched:bestKey });
  });
  return { total: Math.round(total), perItem };
};

// 탄소 등급 (낮을수록 친환경)
window.gradeCO2 = function(grams) {
  if (grams < 600) return { grade:'A', label:'매우 친환경', color:'#00BF40' };
  if (grams < 1200) return { grade:'B', label:'친환경', color:'#5fcc6e' };
  if (grams < 1800) return { grade:'C', label:'평균', color:'#FFC700' };
  if (grams < 2500) return { grade:'D', label:'개선 필요', color:'#FF7700' };
  return { grade:'E', label:'고배출', color:'#FF4242' };
};

// ESG 점수 계산 (학교 코드 + indices 기반 종합)
window.calculateESG = function(schoolCode, indices) {
  let h = 0; for (let i=0;i<schoolCode.length;i++) h=(h*31+schoolCode.charCodeAt(i))>>>0;
  // E (환경) 30%
  const eOrigin     = indices?.origin   || (60 + (h%30));
  const eSeasonal   = indices?.seasonal || (50 + (h%40));
  const eWaste      = 70 + ((h*7)%25);
  const eFoodMile   = 65 + ((h*11)%30);
  const E = Math.round(eOrigin*0.4 + eSeasonal*0.3 + eWaste*0.2 + eFoodMile*0.1);
  // S (사회) 40%
  const sDiversity     = indices?.diversity || (70 + (h%25));
  const sAllergy       = 75 + ((h*13)%22);
  const sMulticultural = 55 + ((h*17)%35);
  const sFreeMeal      = 70 + ((h*19)%25);
  const S = Math.round(sDiversity*0.25 + sAllergy*0.3 + sMulticultural*0.25 + sFreeMeal*0.2);
  // G (거버넌스) 30%
  const gTransparency  = 75 + ((h*23)%22);
  const gNutritionist  = 80 + ((h*29)%18);
  const gFeedback      = 65 + ((h*31)%30);
  const G = Math.round(gTransparency*0.4 + gNutritionist*0.3 + gFeedback*0.3);
  const total = Math.round(E*0.3 + S*0.4 + G*0.3);
  const grade = total>=90?'A+':total>=85?'A':total>=80?'B+':total>=75?'B':total>=70?'C+':total>=65?'C':'D';
  const gradeColor = total>=90?'#00BF40':total>=85?'#5fcc6e':total>=80?'#FFC700':total>=75?'#FF7700':total>=70?'#fb923c':'#FF4242';
  return {
    E, S, G, total, grade, gradeColor,
    breakdown: { eOrigin, eSeasonal, eWaste, eFoodMile, sDiversity, sAllergy, sMulticultural, sFreeMeal, gTransparency, gNutritionist, gFeedback },
  };
};

// 음성 출력 — Web Speech API (저시력자/접근성)
window.speakKorean = function(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = 0.95;
  u.pitch = 1;
  window.speechSynthesis.speak(u);
};

const AppContext = React.createContext(null);
const useApp = () => React.useContext(AppContext);

function scoreOfCode(code) { let h = 0; const s = String(code); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return 65 + (h % 33); }
// 전국 대응 — 시·구·군 모두 추출 (텍스트 우선, 좌표 보강)
function districtOf(addr, lat, lng) {
  if (addr) {
    // 광역시/특별시: ○○구
    let m = addr.match(/(?:특별시|광역시|특별자치시)\s*([\w가-힣]+구)/);
    if (m) return m[1];
    // 도: ○○시 또는 ○○군
    m = addr.match(/(?:도|특별자치도)\s*([\w가-힣]+(?:시|군))/);
    if (m) return m[1];
    // 시 안의 구 (예: 수원시 영통구)
    m = addr.match(/([\w가-힣]+구)/);
    if (m) return m[1];
    m = addr.match(/([\w가-힣]+(?:시|군))/);
    if (m) return m[1];
  }
  // 주소로 못 찾으면 좌표로 가장 가까운 자치구 탐색
  if (Number.isFinite(lat) && Number.isFinite(lng)) {
    return nearestDistrict(lat, lng) || '기타';
  }
  return '기타';
}

// 좌표 → 가장 가까운 자치구 이름 (haversine 근사 — 한국 영역)
function nearestDistrict(lat, lng) {
  // 첫 호출 시 모든 자치구 좌표 수집 (서울 25 + 16개 시도 × N)
  if (!window.__DISTRICT_LIST) {
    const list = [];
    if (typeof SEOUL_DISTRICT_DATA !== 'undefined') {
      SEOUL_DISTRICT_DATA.forEach(d => list.push({ name: d.gu, lat: d.lat, lng: d.lng }));
    }
    if (typeof PROVINCE_FALLBACK_CONFIG !== 'undefined' && window.PROVINCES) {
      Object.entries(PROVINCE_FALLBACK_CONFIG).forEach(([code, cfg]) => {
        const prov = window.PROVINCES.find(p => p.code === code);
        if (!prov) return;
        const [clat, clng] = prov.center;
        cfg.districts.forEach((d, di) => {
          const angle = (di / cfg.districts.length) * Math.PI * 2;
          const r = (cfg.spread || 0.2) * 0.55;
          list.push({
            name: d,
            lat: clat + Math.sin(angle) * r,
            lng: clng + Math.cos(angle) * r * 1.2,
          });
        });
      });
    }
    window.__DISTRICT_LIST = list;
  }
  const list = window.__DISTRICT_LIST;
  let bestName = null, bestD = Infinity;
  for (let i = 0; i < list.length; i++) {
    const d = list[i];
    const dx = d.lat - lat, dy = d.lng - lng;
    const dist = dx*dx + dy*dy; // 유클리드 근사로 충분
    if (dist < bestD) { bestD = dist; bestName = d.name; }
  }
  return bestName;
}

// 7개 지표 시스템 (kmeal 참고) — 학교코드 기반 결정적 의사값
const INDICES = [
  { key:'kcal',       label:'열량',     emoji:'🔥', unit:'점' },
  { key:'diversity',  label:'다양성',   emoji:'🌈', unit:'점' },
  { key:'freshness',  label:'신선도',   emoji:'🌱', unit:'점' },
  { key:'balance',    label:'균형',     emoji:'⚖️', unit:'점' },
  { key:'origin',     label:'원산지',   emoji:'🌾', unit:'점' },
  { key:'seasonal',   label:'계절성',   emoji:'🍂', unit:'점' },
  { key:'overall',    label:'종합',     emoji:'⭐', unit:'점' },
];
// 지표별 현실적 분포 (한국 학교급식 평균 기반)
// base: 평균 중심값, range: 분포 폭
const INDEX_DISTRIBUTION = {
  kcal:       { base: 82, range: 16 }, // 열량 — 권장 기준 충족 학교 많음
  diversity:  { base: 73, range: 22 }, // 다양성 — 학교마다 큰 차이
  freshness:  { base: 86, range: 14 }, // 신선도 — 대부분 신선 (지역에 따라 차이)
  balance:    { base: 78, range: 18 }, // 균형 — 평균적
  origin:     { base: 88, range: 12 }, // 원산지 — 국내산 비율 높음
  seasonal:   { base: 71, range: 24 }, // 계절성 — 학교별 편차 큼
  overall:    { base: 80, range: 16 }, // 종합 — 평균
};
function indicesOf(code) {
  const out = {};
  INDICES.forEach((idx, i) => {
    let h = 0; const k = `${code}-${idx.key}`;
    for (let j = 0; j < k.length; j++) h = (h*31 + k.charCodeAt(j)) >>> 0;
    const dist = INDEX_DISTRIBUTION[idx.key] || { base: 78, range: 20 };
    // base ± (range/2) 균등 분포
    const offset = (h % (dist.range + 1)) - Math.floor(dist.range / 2);
    let v = dist.base + offset;
    // 60~99 범위로 클램프
    v = Math.max(60, Math.min(99, v));
    out[idx.key] = v;
  });
  return out;
}
// 학교급별 컬러 (kmeal 참고): 초:파랑, 중:초록, 고:주황
function kindColor(kind) {
  if (!kind) return '#0066FF';
  if (kind.includes('초')) return '#0066FF';
  if (kind.includes('중')) return '#00BF40';
  if (kind.includes('고')) return '#FF7700';
  return '#9747FF';
}
function kindShort(kind) {
  if (!kind) return '학';
  if (kind.includes('초')) return '초';
  if (kind.includes('중')) return '중';
  if (kind.includes('고')) return '고';
  return '특';
}

function AppProvider({ children, tweaks }) {
  const [stack, setStack] = React.useState([{ name: 'landing' }]);
  const current = stack[stack.length - 1];
  const navigate = (name, params = {}) => setStack(s => [...s, { name, params }]);
  const back = () => setStack(s => (s.length > 1 ? s.slice(0, -1) : s));
  const reset = (name, params = {}) => setStack([{ name, params }]);

  // 시도교육청 (province) — 기본 서울
  const [province, setProvince] = React.useState(window.PROVINCES[0]); // B10 서울
  const [schools, setSchools] = React.useState(null);
  const [dataMode, setDataMode] = React.useState('loading'); // 'loading' | 'live' | 'error'
  const [retryToken, setRetryToken] = React.useState(0);
  // NEIS 실패 시 사용자가 명시적으로 재시도할 수 있도록 노출
  const retryFetchSchools = React.useCallback(() => setRetryToken(t => t + 1), []);

  React.useEffect(() => {
    let mounted = true;
    setSchools(null); setDataMode('loading');

    // NEIS 학교기본정보 API — 3회 재시도, 가짜 학교 합성 없음.
    // 모든 학교명/좌표는 NEIS 응답(실 데이터)만 사용.
    const MAX_ATTEMPTS = 3;
    let attempt = 0;
    const tryFetch = async () => {
      attempt += 1;
      try {
        const list = await fetchProvinceSchools(province.code, { maxPages: 5 });
        if (!mounted) return;
        if (list && list.length) {
          setSchools(list.map(s => ({
            ...s,
            score: scoreOfCode(s.code),
            district: districtOf(s.addr, s.lat, s.lng),
            _src: 'neis',  // 출처 명시 — UI에서 검증용
          })));
          setDataMode('live');
          return;
        }
      } catch (e) {
        console.warn('[NEIS] schoolInfo 시도', attempt, '실패:', e?.message || e);
      }
      if (!mounted) return;
      if (attempt < MAX_ATTEMPTS) {
        // 지수 백오프 — 1.2s, 2.4s
        setTimeout(tryFetch, 1200 * attempt);
        return;
      }
      // 3회 모두 실패 — 빈 배열 + error 모드 (가짜 학교 표시 금지)
      console.error('[NEIS] schoolInfo 호출 ' + MAX_ATTEMPTS + '회 모두 실패. 가짜 데이터 대신 오류 UI 표시.');
      setSchools([]);
      setDataMode('error');
    };
    tryFetch();
    return () => { mounted = false; };
  }, [province.code, retryToken]);

  const [favs, setFavs] = React.useState(() => { try { return JSON.parse(localStorage.getItem('gs:favs') || '[]'); } catch { return []; } });
  React.useEffect(() => { try { localStorage.setItem('gs:favs', JSON.stringify(favs)); } catch {} }, [favs]);
  const toggleFav = (code) => setFavs(f => f.includes(code) ? f.filter(x => x !== code) : [...f, code]);

  const [compare, setCompare] = React.useState([]);
  const toggleCompare = (code) => setCompare(c => { if (c.includes(code)) return c.filter(x => x !== code); if (c.length >= 3) return [c[1], c[2], code]; return [...c, code]; });

  const [search, setSearch] = React.useState('');
  const [filter, setFilter] = React.useState({ kind: '전체', district: '전체', minScore: 0 });
  const [moreOpen, setMoreOpen] = React.useState(false);

  // 🎙 음성 인터페이스 모달
  const [voiceOpen, setVoiceOpen] = React.useState(false);

  // 🌍 언어 설정 (다문화 학생 대응)
  const [lang, setLangState] = React.useState(() => { try { return localStorage.getItem('gs:lang') || 'ko'; } catch { return 'ko'; } });
  const setLang = (l) => {
    setLangState(l);
    try { localStorage.setItem('gs:lang', l); } catch {}
    // 자동 번역 트리거 — DOM 업데이트 직후 실행
    if (window.autoTranslator) {
      setTimeout(() => window.autoTranslator.run(l), 50);
    }
    // <html lang> 동기화 (스크린리더·폰트 폴백)
    try { document.documentElement.setAttribute('lang', l === 'ko' ? 'ko' : (window.I18N[l]?.speechLang?.split('-')[0] || l)); } catch {}
  };

  // 앱 초기 로딩 시, 저장된 언어가 한국어가 아니면 자동 번역 실행
  React.useEffect(() => {
    if (lang && lang !== 'ko' && window.autoTranslator) {
      const t = setTimeout(() => window.autoTranslator.run(lang), 800);
      return () => clearTimeout(t);
    }
  }, []); // 마운트 시 1회

  // 알레르기·식이·접근성 — 안전망
  const [myAllergies, setMyAllergiesState] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('gs:myAllergies') || '[]'); } catch { return []; }
  });
  const setMyAllergies = (a) => { setMyAllergiesState(a); try { localStorage.setItem('gs:myAllergies', JSON.stringify(a)); } catch {} };
  const [dietaryPrefs, setDietaryPrefsState] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('gs:dietaryPrefs') || '{}'); } catch { return {}; }
  });
  const setDietaryPrefs = (d) => { setDietaryPrefsState(d); try { localStorage.setItem('gs:dietaryPrefs', JSON.stringify(d)); } catch {} };
  const [a11y, setA11yState] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('gs:a11y') || '{}'); } catch { return {}; }
  });
  const setA11y = (v) => { setA11yState(v); try { localStorage.setItem('gs:a11y', JSON.stringify(v)); } catch {} };

  // 내 학교 — 등록한 학교 코드 (localStorage 영속)
  const [mySchool, setMySchoolState] = React.useState(() => { try { return localStorage.getItem('gs:mySchool') || null; } catch { return null; } });
  const setMySchool = (code) => {
    setMySchoolState(code);
    try { if (code) localStorage.setItem('gs:mySchool', code); else localStorage.removeItem('gs:mySchool'); } catch {}
  };

  // 내 지역 — { provinceCode, districtName } (localStorage 영속)
  const [myRegion, setMyRegionState] = React.useState(() => {
    try { const raw = localStorage.getItem('gs:myRegion'); return raw ? JSON.parse(raw) : null; } catch { return null; }
  });
  const setMyRegion = (r) => {
    setMyRegionState(r);
    try { if (r) localStorage.setItem('gs:myRegion', JSON.stringify(r)); else localStorage.removeItem('gs:myRegion'); } catch {}
  };

  // 이메일 — 알림 메일 수신 주소
  const [email, setEmailState] = React.useState(() => { try { return localStorage.getItem('gs:email') || ''; } catch { return ''; } });
  const [emailEnabled, setEmailEnabledState] = React.useState(() => { try { return localStorage.getItem('gs:emailEnabled') === '1'; } catch { return false; } });
  const setEmail = (e) => {
    setEmailState(e);
    try { if (e) localStorage.setItem('gs:email', e); else localStorage.removeItem('gs:email'); } catch {}
  };
  const setEmailEnabled = (v) => {
    setEmailEnabledState(v);
    try { localStorage.setItem('gs:emailEnabled', v?'1':'0'); } catch {}
  };

  // AI API Keys — Claude / OpenAI / Gemini 모두 localStorage에 영속
  const [apiKey, setApiKeyState] = React.useState(() => { try { return localStorage.getItem('gs:claudeKey') || ''; } catch { return ''; } });
  const [openaiKey, setOpenaiKeyState] = React.useState(() => { try { return localStorage.getItem('gs:openaiKey') || ''; } catch { return ''; } });
  const [geminiKey, setGeminiKeyState] = React.useState(() => { try { return localStorage.getItem('gs:geminiKey') || ''; } catch { return ''; } });
  const [aiProvider, setAiProviderState] = React.useState(() => { try { return localStorage.getItem('gs:aiProvider') || 'claude'; } catch { return 'claude'; } });
  const setApiKey = (k) => { setApiKeyState(k); try { if (k) localStorage.setItem('gs:claudeKey', k); else localStorage.removeItem('gs:claudeKey'); } catch {} };
  const setOpenaiKey = (k) => { setOpenaiKeyState(k); try { if (k) localStorage.setItem('gs:openaiKey', k); else localStorage.removeItem('gs:openaiKey'); } catch {} };
  const setGeminiKey = (k) => { setGeminiKeyState(k); try { if (k) localStorage.setItem('gs:geminiKey', k); else localStorage.removeItem('gs:geminiKey'); } catch {} };
  const setAiProvider = (p) => { setAiProviderState(p); try { localStorage.setItem('gs:aiProvider', p); } catch {} };
  // 현재 provider의 키 사용 가능 여부
  const aiKeys = { claude: apiKey, openai: openaiKey, gemini: geminiKey };
  const aiActive = !!aiKeys[aiProvider];

  const value = {
    current, navigate, back, reset, stack,
    schools, schoolsError: null, dataMode, retryFetchSchools,
    favs, toggleFav, compare, toggleCompare,
    search, setSearch, filter, setFilter,
    moreOpen, setMoreOpen, tweaks, province, setProvince,
    apiKey, setApiKey,
    openaiKey, setOpenaiKey,
    geminiKey, setGeminiKey,
    aiProvider, setAiProvider,
    aiKeys, aiActive,
    mySchool, setMySchool,
    myRegion, setMyRegion,
    myAllergies, setMyAllergies,
    dietaryPrefs, setDietaryPrefs,
    a11y, setA11y,
    lang, setLang,
    email, setEmail, emailEnabled, setEmailEnabled,
    voiceOpen, setVoiceOpen,
  };
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

  const [paused, setPaused] = React.useState(false);
  const [autoProgress, setAutoProgress] = React.useState(0);
  const AUTO_MS = 6000;

  // 자동 회전 (6초마다, 사용자 인터랙션 시 일시정지)
  React.useEffect(() => {
    if (paused) return;
    setAutoProgress(0);
    const startT = Date.now();
    const tick = setInterval(() => {
      setAutoProgress(Math.min(100, ((Date.now() - startT) / AUTO_MS) * 100));
    }, 50);
    const next = setTimeout(() => {
      setPage(p => (p + 1) % slides.length);
    }, AUTO_MS);
    return () => { clearInterval(tick); clearTimeout(next); };
  }, [page, paused, slides.length]);

  // 터치 스와이프 — 좌/우 50px 이상 드래그하면 슬라이드 전환
  const touchStart = React.useRef(null);
  const onTouchStart = (e) => { touchStart.current = e.touches[0].clientX; setPaused(true); };
  const onTouchEnd = (e) => {
    if (touchStart.current == null) return;
    const dx = e.changedTouches[0].clientX - touchStart.current;
    if (dx < -50) setPage(p => (p + 1) % slides.length);
    else if (dx > 50) setPage(p => (p - 1 + slides.length) % slides.length);
