        }}>
          {/* 제목 */}
          <div style={{ fontSize:15, fontWeight:800, color:'#fff', letterSpacing:'-0.01em', marginBottom:8 }}>
            💬 이 학교 급식, 어떠신가요?
          </div>
          {/* 설명 */}
          <div style={{ fontSize:11, color:'rgba(255,255,255,0.72)', lineHeight:1.55, marginBottom:16 }}>
            ❤️ 좋아요를 눌러 응원하고, 💭 의견을 남겨 더 나은 급식을 만들어요!
          </div>

          {/* 핑크 그라디언트 알약 버튼 */}
          <div style={{ display:'flex', justifyContent:'center', position:'relative' }}>
            {/* 폭발 하트 */}
            {likeBurst && (
              <span style={{
                position:'absolute', left:'50%', top:0, fontSize:36,
                animation:'kmealHeartFloat 0.7s ease-out forwards',
                pointerEvents:'none', zIndex:5,
              }}>❤️</span>
            )}
            <button
              onClick={toggleSchoolLike}
              onMouseDown={e => e.currentTarget.style.transform='scale(0.96)'}
              onMouseUp={e => e.currentTarget.style.transform='scale(1)'}
              onMouseLeave={e => e.currentTarget.style.transform='scale(1)'}
              style={{
                background: likes.hasLiked
                  ? 'linear-gradient(135deg, #F472B6 0%, #C084FC 100%)'
                  : 'linear-gradient(135deg, #FB7185 0%, #A78BFA 100%)',
                border:'none', cursor:'pointer',
                padding:'14px 38px', borderRadius:9999,
                display:'inline-flex', alignItems:'center', justifyContent:'center', gap:10,
                color:'#fff', fontSize:18, fontWeight:800,
                animation: likes.hasLiked ? 'kmealLikePillGlow 2.4s ease-in-out infinite' : 'none',
                boxShadow: '0 8px 24px rgba(244,114,182,0.45), inset 0 1px 0 rgba(255,255,255,0.4)',
                transition:'transform 0.12s cubic-bezier(0.4,0,0.2,1), background 0.3s',
                userSelect:'none',
              }}>
              <span style={{
                fontSize:24, lineHeight:1,
                animation: likeBurst ? 'kmealLikePulse 0.5s ease-out' : 'none',
              }}>❤️</span>
              <span style={{ fontVariantNumeric:'tabular-nums', letterSpacing:'-0.01em' }}>
                {likes.count.toLocaleString()}
              </span>
            </button>
          </div>

          {/* 상태 텍스트 */}
          <div style={{ fontSize:11, fontWeight:700, color:'rgba(255,255,255,0.55)', marginTop:14 }}>
            {likes.hasLiked
              ? '✨  좋아요를 눌렀어요! 한 번 더 누르면 취소돼요'
              : '👆  탭해서 응원해주세요'}
          </div>
        </div>
      </div>

      {/* 평점 요약 */}
      <div style={{ background:cardBg, borderRadius:14, padding:16, marginBottom:8, border:'1px solid rgba(0,0,0,0.04)', display:'flex', gap:16, alignItems:'center' }}>
        <div style={{ textAlign:'center' }}>
          <div style={{ fontSize:32, fontWeight:800, color:accent, lineHeight:1 }}>{avgStar.toFixed(1)}</div>
          <div style={{ fontSize:11, color:'#fbbf24', marginTop:4 }}>{'★'.repeat(Math.round(avgStar))}{'☆'.repeat(5-Math.round(avgStar))}</div>
          <div style={{ fontSize:10, color:sub, marginTop:2 }}>{total}개 리뷰</div>
        </div>
        <div style={{ flex:1, display:'flex', flexDirection:'column', gap:3 }}>
          {distribution.map(d => (
            <div key={d.s} style={{ display:'flex', alignItems:'center', gap:6 }}>
              <span style={{ fontSize:10, color:sub, width:14 }}>{d.s}★</span>
              <div style={{ flex:1, height:5, background:'rgba(0,0,0,0.07)', borderRadius:99, overflow:'hidden' }}>
                <div style={{ width:`${(d.count/total)*100}%`, height:'100%', background:'#fbbf24', borderRadius:99 }}/>
              </div>
              <span style={{ fontSize:10, color:sub, width:16, textAlign:'right' }}>{d.count}</span>
            </div>
          ))}
        </div>
      </div>

      {/* 📊 감성 분석 카드 */}
      {reviews.length > 0 && (
        <div style={{ background:cardBg, borderRadius:14, padding:14, marginBottom:8, border:'1px solid rgba(0,0,0,0.04)' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
            <div style={{ fontSize:12, fontWeight:800, color:text, display:'flex', alignItems:'center', gap:5 }}>
              <span>📊</span><span>감성 분석</span>
              <span style={{ fontSize:9, fontWeight:700, color:sub, marginLeft:4 }}>총 {sentimentStats.total}건</span>
            </div>
          </div>

          {/* 그룹 토글 */}
          <div style={{ display:'flex', gap:4, marginBottom:12 }}>
            {['전체','학부모','학생'].map(g => {
              const active = sentimentGroup === g;
              const count = g === '전체' ? reviews.length : reviews.filter(r => r.role === g).length;
              return (
                <button key={g} onClick={() => setSentimentGroup(g)} style={{
                  flex:1, height:30, borderRadius:7, cursor:'pointer',
                  background: active ? accentBlue : cardBg2,
                  color: active ? 'white' : text,
                  border: `1px solid ${active ? accentBlue : 'rgba(0,0,0,0.06)'}`,
                  fontSize:11, fontWeight:800, padding:0,
                }}>
                  {g} <span style={{ fontWeight:600, opacity:0.7 }}>({count})</span>
                </button>
              );
            })}
          </div>

          {sentimentStats.total === 0 ? (
            <div style={{ padding:14, textAlign:'center', color:sub, fontSize:11 }}>
              해당 그룹의 리뷰가 없어요
            </div>
          ) : (
            <>
              {/* 비율 카드 3분할 */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:6, marginBottom:10 }}>
                {[
                  { l:'긍정', e:'😊', c:'#00BF40', v:sentimentStats.posPct, n:sentimentStats.positive },
                  { l:'중립', e:'🤔', c:'#9CA3AF', v:sentimentStats.neuPct, n:sentimentStats.neutral },
                  { l:'부정', e:'😟', c:'#EF4444', v:sentimentStats.negPct, n:sentimentStats.negative },
                ].map(d => (
                  <div key={d.l} style={{ padding:'10px 8px', borderRadius:9, background:`${d.c}15`, border:`1px solid ${d.c}33`, textAlign:'center' }}>
                    <div style={{ fontSize:18 }}>{d.e}</div>
                    <div style={{ fontSize:9, fontWeight:800, color:d.c, marginTop:2, letterSpacing:'0.04em' }}>{d.l}</div>
                    <div style={{ fontSize:18, fontWeight:800, color:d.c, marginTop:2, fontVariantNumeric:'tabular-nums' }}>{d.v}<span style={{ fontSize:11 }}>%</span></div>
                    <div style={{ fontSize:9, fontWeight:600, color:sub, marginTop:1 }}>{d.n}건</div>
                  </div>
                ))}
              </div>

              {/* 누적 막대 */}
              <div style={{ display:'flex', height:8, background:cardBg2, borderRadius:99, overflow:'hidden', marginBottom:12 }}>
                <div style={{ width:`${sentimentStats.posPct}%`, background:'#00BF40' }}/>
                <div style={{ width:`${sentimentStats.neuPct}%`, background:'#9CA3AF' }}/>
                <div style={{ width:`${sentimentStats.negPct}%`, background:'#EF4444' }}/>
              </div>

              {/* 키워드 */}
              {sentimentStats.topPos.length > 0 && (
                <div style={{ marginBottom:8 }}>
                  <div style={{ fontSize:10, fontWeight:800, color:'#00BF40', marginBottom:5, letterSpacing:'0.04em' }}>👍 자주 나온 긍정 표현</div>
                  <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
                    {sentimentStats.topPos.map(([w, c]) => (
                      <span key={w} style={{ fontSize:11, fontWeight:700, color:'#00802b', background:'rgba(0,191,64,0.10)', padding:'3px 8px', borderRadius:4 }}>{w} <span style={{ opacity:0.6, fontSize:9 }}>×{c}</span></span>
                    ))}
                  </div>
                </div>
              )}
              {sentimentStats.topNeg.length > 0 && (
                <div>
                  <div style={{ fontSize:10, fontWeight:800, color:'#EF4444', marginBottom:5, letterSpacing:'0.04em' }}>👎 자주 나온 부정 표현</div>
                  <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
                    {sentimentStats.topNeg.map(([w, c]) => (
                      <span key={w} style={{ fontSize:11, fontWeight:700, color:'#b91c1c', background:'rgba(239,68,68,0.10)', padding:'3px 8px', borderRadius:4 }}>{w} <span style={{ opacity:0.6, fontSize:9 }}>×{c}</span></span>
                    ))}
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      )}

      {/* 서버 상태 배지 */}
      {apiMode !== 'loading' && (
        <div style={{ marginBottom:8, fontSize:10, fontWeight:700, color:apiMode==='online'?'var(--color-green-600)':'#FF7700', display:'flex', alignItems:'center', gap:5 }}>
          <span style={{ width:6, height:6, borderRadius:99, background:apiMode==='online'?'#00BF40':'#FF7700' }}/>
          {apiMode === 'online' ? '실시간 공유 — 모든 사용자가 볼 수 있어요' : '오프라인 모드 — 샘플 글만 표시'}
        </div>
      )}

      {/* 필터 + 리뷰 작성 버튼 */}
      <div style={{ display:'flex', gap:6, alignItems:'center', marginBottom:8, overflowX:'auto', scrollbarWidth:'none' }}>
        {['전체','긍정','개선','학부모','학생'].map(f => (
          <span key={f} onClick={() => setFilter(f)} style={{
            flexShrink:0, padding:'6px 12px', borderRadius:9999,
            background: filter===f?accent:cardBg2, color: filter===f?'#0a0e1a':text,
            fontSize:11, fontWeight:800, cursor:'pointer',
            border:`1px solid ${filter===f?accent:'rgba(0,0,0,0.06)'}`,
          }}>{f}</span>
        ))}
        <span onClick={() => {
          if (apiMode === 'offline') {
            alert('서버 연결이 필요해요. 잠시 후 다시 시도해주세요.');
            return;
          }
          composeOpen ? closeCompose() : setComposeOpen(true);
        }} style={{
          marginLeft:'auto', flexShrink:0, padding:'6px 12px', borderRadius:9999,
          background: apiMode === 'offline' ? cardBg2 : accentBlue,
          color: apiMode === 'offline' ? sub : 'white',
          fontSize:11, fontWeight:800, cursor: apiMode === 'offline' ? 'not-allowed' : 'pointer',
        }}>{composeOpen?'✕':'＋ 작성'}</span>
      </div>

      {/* 리뷰 작성 폼 */}
      {composeOpen && (
        <div style={{ background:cardBg, borderRadius:14, padding:14, marginBottom:8, border:`1px solid ${accentBlue}40` }}>
          <div style={{ fontSize:11, fontWeight:800, color:accentBlue, marginBottom:10, display:'flex', alignItems:'center', gap:6 }}>
            {editingId !== null ? '✏️ 리뷰 수정' : '리뷰 작성'}
            {editingId !== null && <span style={{ fontSize:9, color:sub, fontWeight:600 }}>· 본인 글만 수정 가능</span>}
          </div>

          {/* 신분 선택 */}
          <div style={{ marginBottom:10 }}>
            <div style={{ fontSize:10, fontWeight:800, color:sub, marginBottom:5, letterSpacing:'0.04em' }}>신분</div>
            <div style={{ display:'flex', gap:6 }}>
              {[
                { key:'학부모', emoji:'👨‍👩‍👧' },
                { key:'학생',   emoji:'🎒' },
              ].map(opt => {
                const active = draft.role === opt.key;
                return (
                  <button key={opt.key} type="button" onClick={() => setDraft({ ...draft, role: opt.key })}
                    style={{
                      flex:1, height:36, borderRadius:9, cursor:'pointer',
                      background: active ? accentBlue : cardBg2,
                      color: active ? 'white' : text,
                      border: `1.5px solid ${active ? accentBlue : 'rgba(0,0,0,0.08)'}`,
                      fontSize:12, fontWeight:700,
                      display:'inline-flex', alignItems:'center', justifyContent:'center', gap:5,
                    }}>
                    <span style={{ fontSize:14 }}>{opt.emoji}</span>{opt.key}
                  </button>
                );
              })}
            </div>
          </div>

          {/* 닉네임 */}
          <div style={{ marginBottom:10 }}>
            <div style={{ fontSize:10, fontWeight:800, color:sub, marginBottom:5, letterSpacing:'0.04em', display:'flex', alignItems:'center', gap:6 }}>
              <span>닉네임 <span style={{ fontWeight:600, color:sub, opacity:0.7 }}>(선택)</span></span>
              <span style={{ fontSize:9, fontWeight:700, color:accentBlue, background:`${accentBlue}15`, padding:'1px 6px', borderRadius:4, letterSpacing:0 }}>🔒 자동 익명화</span>
            </div>
            <input type="text" maxLength={20}
              className="small-input"
              value={draft.nickname || ''}
              onChange={e => setDraft({ ...draft, nickname: e.target.value })}
              placeholder={draft.role === '학생' ? '예: 홍길동 (→ 홍○○)' : '예: 박철수 어머니 (→ 박○○ 어머니)'}
              style={{ width:'100%', height:32, padding:'0 10px', borderRadius:8, background:cardBg2, border:'1px solid rgba(0,0,0,0.08)', color:text, fontSize:11, fontFamily:'inherit', outline:'none', boxSizing:'border-box' }}/>
            {draft.nickname && draft.nickname.trim() && (
              <div style={{ marginTop:5, fontSize:10, color:sub, fontWeight:600 }}>
                표시: <span style={{ color:accentBlue, fontWeight:800 }}>{maskNickname(draft.nickname)}</span>
              </div>
            )}
          </div>

          {/* 별점 */}
          <div style={{ marginBottom:8 }}>
            <div style={{ fontSize:10, fontWeight:800, color:sub, marginBottom:5, letterSpacing:'0.04em' }}>별점</div>
            <div style={{ display:'flex', gap:4 }}>
              {[1,2,3,4,5].map(s => (
                <span key={s} onClick={() => setDraft({ ...draft, stars:s })} style={{ fontSize:24, color:s<=draft.stars?'#fbbf24':'rgba(0,0,0,0.2)', cursor:'pointer' }}>★</span>
              ))}
            </div>
          </div>

          {/* 본문 */}
          <textarea
            className="small-input"
            value={draft.body} onChange={e => setDraft({ ...draft, body:e.target.value })}
            placeholder={`이 학교 급식에 대한 ${draft.role || '학부모'}의 의견을 남겨주세요`}
            style={{ width:'100%', minHeight:64, padding:10, borderRadius:8, background:cardBg2, border:'1px solid rgba(0,0,0,0.08)', color:text, fontSize:11, lineHeight:1.55, fontFamily:'inherit', resize:'none', outline:'none', boxSizing:'border-box' }}/>

          {/* 미리보기 */}
          {draft.body.trim() && (
            <div style={{ marginTop:8, padding:'8px 10px', borderRadius:8, background:`${accentBlue}10`, border:`1px dashed ${accentBlue}40`, fontSize:11, color:sub }}>
              <span style={{ fontWeight:700, color:text }}>{draft.role || '학부모'} {maskNickname((draft.nickname || '').trim())}</span>
              <span style={{ marginLeft:6, color:'#fbbf24' }}>{'★'.repeat(draft.stars)}</span>
              <span style={{ marginLeft:6 }}>로 등록됩니다</span>
            </div>
          )}

          <div style={{ display:'flex', gap:6, marginTop:10 }}>
            <button onClick={closeCompose} style={{ flex:1, height:36, borderRadius:8, background:cardBg2, color:sub, border:'none', fontSize:12, fontWeight:700, cursor:'pointer' }}>취소</button>
            <button onClick={submitReview} disabled={!draft.body.trim() || submitting} style={{ flex:2, height:36, borderRadius:8, background: (draft.body.trim() && !submitting)?accentBlue:cardBg2, color: (draft.body.trim() && !submitting)?'white':sub, border:'none', fontSize:12, fontWeight:800, cursor: (draft.body.trim() && !submitting)?'pointer':'not-allowed' }}>{submitting ? '⏳ 처리 중…' : (editingId !== null ? '수정 완료' : '등록')}</button>
          </div>
        </div>
      )}

      {/* 리뷰 리스트 */}
      {filtered.length === 0 && (
        <div style={{ padding:30, textAlign:'center', color:sub, fontSize:12 }}>해당 조건의 리뷰가 없어요</div>
      )}
      {filtered.map(r => {
        const isMine = r.isMine === true || myIds.has(r.id);
        const isEditing = editingId === r.id;
        return (
          <div key={r.id} style={{
            background: isMine ? `${accentBlue}08` : cardBg,
            borderRadius:14, padding:14, marginBottom:6,
            border: isMine ? `1.5px solid ${accentBlue}55` : '1px solid rgba(0,0,0,0.04)',
            opacity: isEditing ? 0.4 : 1,
            transition: 'opacity 0.15s',
          }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6, flexWrap:'wrap', gap:6 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                <span style={{ fontSize:12, fontWeight:700, color:text }}>{r.who}</span>
                <span style={{ fontSize:9, fontWeight:800, color:sub, background:cardBg2, padding:'2px 6px', borderRadius:4 }}>{r.role}</span>
                {isMine && <span style={{ fontSize:9, fontWeight:800, color:'white', background:accentBlue, padding:'2px 6px', borderRadius:4 }}>내 글</span>}
                {r.edited && <span style={{ fontSize:9, fontWeight:600, color:sub, fontStyle:'italic' }}>· 수정됨</span>}
                <span style={{ fontSize:10, color:sub }}>{r.date}</span>
              </div>
              <span style={{ fontSize:11, color:'#fbbf24' }}>{'★'.repeat(r.stars)}{'☆'.repeat(5-r.stars)}</span>
            </div>
            <div style={{ fontSize:13, color:subStrong, lineHeight:1.55, marginBottom:8, whiteSpace:'pre-wrap' }}>{r.body}</div>
            <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
              <span style={{ fontSize:9, fontWeight:800, color:accent, background:`${accent}1A`, padding:'2px 6px', borderRadius:4 }}>#{r.tag}</span>
              <button onClick={() => toggleLike(r.id)}
                onMouseDown={e => e.currentTarget.style.transform='scale(0.92)'}
                onMouseUp={e => e.currentTarget.style.transform='scale(1)'}
                onMouseLeave={e => e.currentTarget.style.transform='scale(1)'}
                title="좋아요"
                style={{
                  background:'transparent', border:'none', cursor:'pointer',
                  position:'relative', width:36, height:32,
                  display:'inline-flex', alignItems:'center', justifyContent:'center',
                  padding:0, transition:'transform 0.12s cubic-bezier(0.4,0,0.2,1)',
                }}>
                {/* 하트 SVG (채움/외곽선) */}
                <svg width="32" height="28" viewBox="0 0 32 28" fill={liked[r.id]?'#f87171':'none'}
                  stroke={liked[r.id]?'#f87171':sub} strokeWidth="2" strokeLinejoin="round">
                  <path d="M16 26 C16 26 3 17 3 9 C3 5 6 2 10 2 C13 2 15 4 16 6 C17 4 19 2 22 2 C26 2 29 5 29 9 C29 17 16 26 16 26 Z"/>
                </svg>
                {/* 중앙 숫자 */}
                <span style={{
                  position:'absolute', top:'47%', left:'50%',
                  transform:'translate(-50%, -50%)',
                  fontSize: r.likes >= 100 ? 8 : 9,
                  fontWeight:800,
                  color: liked[r.id] ? '#fff' : sub,
                  fontVariantNumeric:'tabular-nums',
                  pointerEvents:'none',
                  textShadow: liked[r.id] ? '0 0 2px rgba(0,0,0,0.18)' : 'none',
                  lineHeight:1,
                }}>{r.likes}</span>
              </button>
              <span style={{ fontSize:11, color:sub, fontWeight:600 }}>👍 도움됨 {r.helpful}</span>
              {/* 내 글일 때만 — 수정·삭제 */}
              {isMine && !isEditing && (
                <span style={{ marginLeft:'auto', display:'inline-flex', gap:4 }}>
                  <button onClick={() => startEdit(r)} title="수정" style={{
                    background:'transparent', border:`1px solid ${accentBlue}55`, color:accentBlue,
                    padding:'3px 8px', borderRadius:6, fontSize:10, fontWeight:800, cursor:'pointer',
                  }}>✏️ 수정</button>
                  <button onClick={() => deleteReview(r.id)} title="삭제" style={{
                    background:'transparent', border:'1px solid rgba(255,66,66,0.4)', color:'#dc2626',
                    padding:'3px 8px', borderRadius:6, fontSize:10, fontWeight:800, cursor:'pointer',
                  }}>🗑 삭제</button>
                </span>
              )}
              {isEditing && (
                <span style={{ marginLeft:'auto', fontSize:10, fontWeight:700, color:accentBlue }}>수정 중…</span>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// AIInsightTab — 인터랙티브 AI 영양 코치
// ═══════════════════════════════════════════════════════════════
function AIInsightTab({ school, idx, overall, cardBg, cardBg2, text, sub, subStrong, accent, accentBlue }) {
  const { aiProvider, aiKeys, aiActive } = useApp();
  const PROVIDER_LABELS = { claude:'CLAUDE', openai:'CHATGPT', gemini:'GEMINI' };
  const QUERIES = [
    { id:'overview', e:'📋', l:'종합 평가' },
    { id:'strength', e:'💪', l:'강점 분석' },
    { id:'weakness', e:'⚠️', l:'개선 포인트' },
    { id:'parent',   e:'👨‍👩‍👧', l:'학부모 가이드' },
    { id:'recipe',   e:'🍳', l:'가정 보완 식단' },
    { id:'compare',  e:'⚖️', l:'또래 학교 대비' },
  ];
  const [active, setActive] = React.useState('overview');
  const [analyzing, setAnalyzing] = React.useState(false);
  const [history, setHistory] = React.useState([]);

  // 학교 코드 + query 기반 결정적 응답 생성
  const generateResponse = (queryId) => {
    const q = QUERIES.find(x => x.id === queryId);
    const districtName = school.district || '서울';
    const kcal = 650 + (school.code.charCodeAt(0)%150);
    const domestic = 80 + (idx.origin%20);

    const responses = {

  const handleQuery = async (queryId) => {

{

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6, marginBottom:8 }}>
        {QUERIES.map(q => {
          const isActive = active === q.id;
          return (
            <div key={q.id} onClick={() => handleQuery(q.id)} style={{
              padding:'10px 12px', borderRadius:12,
              background: isActive?accent:cardBg, color: isActive?'#0a0e1a':text,
              fontSize:12, fontWeight:800, cursor:'pointer',
              border:`1px solid ${isActive?accent:'rgba(0,0,0,0.06)'}`,
              display:'flex', alignItems:'center', gap:8,
            }}>
              <span style={{ fontSize:16 }}>{q.e}</span>
              <span>{q.l}</span>
            </div>
          );
        })}
      </div>

      {/* 분석 중 */}
      {analyzing && (
        <div style={{ background:cardBg, borderRadius:14, padding:24, textAlign:'center', border:'1px solid rgba(0,0,0,0.04)' }}>
          <div style={{ fontSize:32, marginBottom:10, display:'inline-block', animation:'spin 2s linear infinite' }}>✨</div>
          <div style={{ fontSize:13, fontWeight:800, color:text, marginBottom:4 }}>AI가 분석 중이에요…</div>
          <div style={{ fontSize:11, color:sub }}>30일 식단 + 영양 + 비교 데이터 종합</div>
        </div>
      )}

      {/* 분석 결과 (최신) */}
      {!analyzing && history.length > 0 && history.slice(0, 1).map((r, ri) => (
        <div key={ri}>
          <div style={{ background:cardBg, borderRadius:14, padding:14, marginBottom:8, border:'1px solid rgba(0,0,0,0.04)' }}>
            <div style={{ fontSize:13, fontWeight:800, color:text, marginBottom:6 }}>{r.headline}</div>
            <div style={{ fontSize:12, color:subStrong, lineHeight:1.55 }}>{r.summary}</div>

      {/* 이력 */}
      {history.length > 1 && !analyzing && (
        <div style={{ marginTop:12 }}>
          <div style={{ fontSize:11, fontWeight:800, color:sub, padding:'8px 4px', letterSpacing:'0.04em', textTransform:'uppercase' }}>이전 분석</div>

            <div key={i} onClick={() => handleQuery(r.queryId)} style={{ background:cardBg2, borderRadius:10, padding:'10px 12px', marginBottom:4, cursor:'pointer', display:'flex', alignItems:'center', gap:8, border:'1px solid rgba(0,0,0,0.04)' }}>

      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
function ScreenPro() {
  const { mySchool, schools, navigate, tweaks, aiProvider, aiKeys, aiActive } = useApp();
  const dark = tweaks.dark;
  const cardBg = dark?'#1c1c1e':'white';
  const cardBg2 = dark?'#2c2c2e':'var(--color-neutral-100)';
  const text = dark?'#fff':'var(--color-neutral-1000)';
  const sub = dark?'rgba(255,255,255,0.6)':'var(--color-neutral-700)';
  const subStrong = dark?'rgba(255,255,255,0.78)':'var(--color-neutral-800)';
  const my = mySchool && schools ? schools.find(s => s.code === mySchool) : null;
  const [proTab, setProTab] = React.useState('ops');
  const [meal, setMeal] = React.useState(null);
  const [aiPlanLoading, setAiPlanLoading] = React.useState(false);
  const [aiPlan, setAiPlan] = React.useState(null);

  React.useEffect(() => {
    if (!my) return;
    let mounted = true;
    (async () => {
      let m = null;
      for (let i = 0; i <= 7; i++) {
        const d = new Date(); d.setDate(d.getDate() - i);
        m = await fetchTodayMeal({ officeCode: my.office||'B10', schoolCode: my.code, date: formatYmd(d) });
        if (m) break;
      }
      if (!m) m = window.generateDailyMeal(my.code, new Date());
      if (mounted) setMeal(m);
    })();
    return () => { mounted = false; };
  }, [my?.code]);

  // 학교 코드 기반 결정적 KPI
  const kpi = React.useMemo(() => {
    if (!my) return null;
    let h = 0; for (let i=0;i<my.code.length;i++) h=(h*31+my.code.charCodeAt(i))>>>0;
    const idx = indicesOf(my.code);
    const esg = window.calculateESG(my.code, idx);
    return {
      avgScore: my.score,
      esg: esg.total,
      esgGrade: esg.grade,
      esgColor: esg.gradeColor,
      wasteRate: 8 + (h%12),                 // 잔반율 8-19%
      satisfaction: 78 + (h%18),             // 만족도 78-95
      perCapitaCost: 2400 + ((h*7)%900),     // 1인당 단가 2400-3300원
      students: my.kind?.includes('초') ? 280+(h%720) : my.kind?.includes('중') ? 320+(h%680) : 480+(h%820),
      teachers: my.kind?.includes('초') ? 18+(h%32) : my.kind?.includes('중') ? 24+(h%30) : 38+(h%42),
      mealsServed: 4500 + ((h*11)%2000),     // 월 제공 식수

                {allergyClasses.length > 10 && <div style={{ marginTop:10, padding:'8px', fontSize:10, color:sub, textAlign:'center', borderTop:`1px solid ${dark?'rgba(255,255,255,0.04)':'var(--alpha-black-10)'}` }}>+{allergyClasses.length-10}개 반</div>}
              </div>
            </div>
          </>
        )}

        {/* 💬 피드백 탭 */}
        {proTab === 'feedback' && (
          <>
            {/* 감성 분석 */}
            <div style={{ background:cardBg, borderRadius:14, padding:14, marginBottom:8 }}>
              <div style={{ fontSize:12, fontWeight:800, color:text, marginBottom:10 }}>💝 학부모 감성 분석</div>
              <div style={{ display:'flex', height:14, borderRadius:99, overflow:'hidden', marginBottom:10 }}>
                <div style={{ width:`${sentiment.positive}%`, background:'#00BF40' }}/>
                <div style={{ width:`${sentiment.neutral}%`, background:'#FFC700' }}/>
                <div style={{ width:`${sentiment.negative}%`, background:'#FF7700' }}/>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:6 }}>
                <div style={{ textAlign:'center', padding:'8px', background:'rgba(0,191,64,0.1)', borderRadius:8 }}>
                  <div style={{ fontSize:18, fontWeight:800, color:'#00BF40' }}>{sentiment.positive}%</div>
                  <div style={{ fontSize:9, color:sub, fontWeight:700 }}>긍정</div>
                </div>
                <div style={{ textAlign:'center', padding:'8px', background:'rgba(255,199,0,0.1)', borderRadius:8 }}>
                  <div style={{ fontSize:18, fontWeight:800, color:'#FFC700' }}>{sentiment.neutral}%</div>
                  <div style={{ fontSize:9, color:sub, fontWeight:700 }}>중립</div>
                </div>
                <div style={{ textAlign:'center', padding:'8px', background:'rgba(255,119,0,0.1)', borderRadius:8 }}>
                  <div style={{ fontSize:18, fontWeight:800, color:'#FF7700' }}>{sentiment.negative}%</div>
                  <div style={{ fontSize:9, color:sub, fontWeight:700 }}>부정</div>
                </div>
              </div>
            </div>

            {/* 워드 클라우드 */}
            <div style={{ background:cardBg, borderRadius:14, padding:14, marginBottom:8 }}>
              <div style={{ fontSize:12, fontWeight:800, color:text, marginBottom:12 }}>☁️ 자주 등장하는 단어</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:8, alignItems:'center', justifyContent:'center', minHeight:140 }}>
                {wordCloud.slice(0, 14).map((w, i) => {
                  const fs = 10 + Math.min(20, w.count);
                  return (
                    <span key={w.word} style={{
                      fontSize: fs, fontWeight:800, color:w.tone,
                      padding:'2px 6px', borderRadius:6,
                      background:`${w.tone}15`,
                      lineHeight:1.2,
                    }}>{w.word}</span>
                  );
                })}
              </div>
            </div>

            {/* 카테고리별 평점 */}
            <div style={{ background:cardBg, borderRadius:14, padding:14 }}>
              <div style={{ fontSize:12, fontWeight:800, color:text, marginBottom:10 }}>⭐ 카테고리별 평점</div>
              {[
                { l:'😋 맛',     v: 4.2 + ((my.code.charCodeAt(0)%6)/10) },
                { l:'🥗 영양',   v: 4.4 + ((my.code.charCodeAt(1)%5)/10) },
                { l:'🍱 양',     v: 4.0 + ((my.code.charCodeAt(2)%8)/10) },
                { l:'🌾 신선도', v: 4.3 + ((my.code.charCodeAt(3)%5)/10) },
              ].map(it => (
                <div key={it.l} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 0' }}>
                  <span style={{ width:60, fontSize:11, fontWeight:700, color:text }}>{it.l}</span>
                  <div style={{ flex:1, height:8, background:cardBg2, borderRadius:99, overflow:'hidden' }}>
                    <div style={{ width:`${(it.v/5)*100}%`, height:'100%', background:'#FFC700', borderRadius:99 }}/>
                  </div>
                  <span style={{ width:48, textAlign:'right', fontSize:11, fontWeight:800, color:'#FFC700' }}>{'★'.repeat(Math.round(it.v))}</span>
                  <span style={{ fontSize:11, fontWeight:800, color:text, fontVariantNumeric:'tabular-nums', minWidth:24 }}>{it.v.toFixed(1)}</span>
                </div>
              ))}
            </div>
          </>
        )}

        {/* ✨ AI 식단 탭 */}
        {proTab === 'plan' && (
          <>
            <div style={{ background:'linear-gradient(135deg, #1e1b4b, #4c1d95)', borderRadius:16, padding:18, color:'white', marginBottom:8 }}>
              <div style={{ fontSize:11, fontWeight:700, opacity:0.85, marginBottom:6, display:'flex', alignItems:'center', gap:6 }}>
                ✨ AI 다음 주 식단 자동 제안
                {aiActive && <span style={{ fontSize:9, fontWeight:800, background:'rgba(255,255,255,0.22)', padding:'2px 6px', borderRadius:4 }}>{aiProvider==='claude'?'CLAUDE':aiProvider==='openai'?'CHATGPT':'GEMINI'}</span>}
              </div>
              <div style={{ fontSize:16, fontWeight:800, marginBottom:6 }}>예산·영양·다양성 최적화</div>
              <div style={{ fontSize:11, opacity:0.92, lineHeight:1.5, marginBottom:14 }}>
                {my.name} 학생 {kpi.students}명 · 1인 단가 {kpi.perCapitaCost.toLocaleString()}원 이하<br/>
                알레르기·다양성·영양 균형 자동 검증
              </div>
              <button onClick={generateAiPlan} disabled={aiPlanLoading} style={{
                width:'100%', height:46, borderRadius:12,
                background: aiPlanLoading?'rgba(255,255,255,0.18)':'white',
                color: aiPlanLoading?'rgba(255,255,255,0.6)':'#4c1d95',
                border:'none', fontSize:14, fontWeight:800,
                cursor: aiPlanLoading?'wait':'pointer',
                display:'flex', alignItems:'center', justifyContent:'center', gap:6,
              }}>
                {aiPlanLoading ? <>
                  <span style={{ width:14, height:14, border:'2px solid rgba(76,29,149,0.3)', borderTopColor:'#4c1d95', borderRadius:99, animation:'spin 0.8s linear infinite' }}/>
                  AI 식단 생성 중…
                </> : aiActive ? '🚀 AI 식단 생성' : '⚠ AI 키 미설정'}
              </button>
            </div>

            {/* AI 결과 */}
            {aiPlan && (
              <>
                {aiPlan.summary && (
                  <div style={{ background:cardBg, borderRadius:14, padding:14, marginBottom:8 }}>
                    <div style={{ fontSize:11, fontWeight:800, color:'#9747FF', marginBottom:6 }}>📝 주간 식단 요약</div>
                    <div style={{ fontSize:12, color:text, lineHeight:1.55 }}>{aiPlan.summary}</div>
                  </div>
                )}

                {aiPlan.weeklyAvg && (
                  <div style={{ background:cardBg, borderRadius:14, padding:14, marginBottom:8 }}>
                    <div style={{ fontSize:11, fontWeight:800, color:text, marginBottom:8 }}>📊 주간 평균 KPI</div>
                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
                      <div style={{ background:cardBg2, borderRadius:10, padding:'10px 8px', textAlign:'center' }}>
                        <div style={{ fontSize:9, color:sub, fontWeight:700 }}>평균 칼로리</div>
                        <div style={{ fontSize:16, fontWeight:800, color:text, marginTop:2 }}>{aiPlan.weeklyAvg.kcal}</div>
                        <div style={{ fontSize:9, color:sub }}>kcal</div>
                      </div>
                      <div style={{ background:cardBg2, borderRadius:10, padding:'10px 8px', textAlign:'center' }}>
                        <div style={{ fontSize:9, color:sub, fontWeight:700 }}>평균 단가</div>
                        <div style={{ fontSize:16, fontWeight:800, color: aiPlan.weeklyAvg.cost<=kpi.perCapitaCost?'#00BF40':'#FF4242', marginTop:2 }}>{aiPlan.weeklyAvg.cost?.toLocaleString()}</div>
                        <div style={{ fontSize:9, color:sub }}>원/인</div>
                      </div>
                      <div style={{ background:cardBg2, borderRadius:10, padding:'10px 8px', textAlign:'center' }}>
                        <div style={{ fontSize:9, color:sub, fontWeight:700 }}>예상 점수</div>
                        <div style={{ fontSize:16, fontWeight:800, color:'#00BF40', marginTop:2 }}>{aiPlan.weeklyAvg.expectedScore}</div>
                        <div style={{ fontSize:9, color:sub }}>점</div>
                      </div>
                    </div>
                  </div>
                )}

                {(aiPlan.days || []).map((d, i) => (
                  <div key={i} style={{ background:cardBg, borderRadius:14, padding:14, marginBottom:6, borderLeft:'3px solid #9747FF' }}>
                    <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:6 }}>
                      <div style={{ fontSize:13, fontWeight:800, color:text }}>{d.day}요일</div>
                      <div style={{ fontSize:10, color:sub, fontWeight:700 }}>{d.kcal} kcal · {d.estimatedCost?.toLocaleString()}원</div>
                    </div>
                    <div style={{ display:'flex', flexWrap:'wrap', gap:4, marginBottom:6 }}>
                      {(d.menus||[]).map((m, j) => (
                        <span key={j} style={{ fontSize:11, fontWeight:600, color:text, background:cardBg2, padding:'3px 8px', borderRadius:6 }}>{m}</span>
                      ))}
                    </div>
                    {d.highlights && d.highlights[0] && (
                      <div style={{ fontSize:10, color:'#9747FF', fontWeight:700 }}>💡 {d.highlights[0]}</div>
                    )}
                  </div>
                ))}
              </>
            )}
          </>
        )}
        <div style={{ height:80 }} />
      </div>
    </div>
  );
}


// ═══════════════════════════════════════════════════════════════
// Screen: 📋 단계별 학교 목록 선택 (시도 → 자치구 → 학교)
// ═══════════════════════════════════════════════════════════════
function ScreenBrowse() {
  const { schools, dataMode, navigate, back, tweaks, province, setProvince, retryFetchSchools } = useApp();
  const dark = tweaks.dark;
  const cardBg = dark?'#1c1c1e':'white';
  const cardBg2 = dark?'#2c2c2e':'var(--color-neutral-100)';
  const text = dark?'#fff':'var(--color-neutral-1000)';
  const sub = dark?'rgba(255,255,255,0.6)':'var(--color-neutral-700)';
  const headerColor = tweaks.headerColor || '#0066FF';

  // 단계: 0=시도 / 1=자치구 / 2=학교급 / 3=학교
  const [step, setStep] = React.useState(0);
  const [pickedProvince, setPickedProvince] = React.useState(null); // {code, name, full}
  const [pickedDistrict, setPickedDistrict] = React.useState(null); // string
  const [pickedKind, setPickedKind] = React.useState('전체'); // 전체/초등학교/중학교/고등학교
  const [searchTerm, setSearchTerm] = React.useState('');

  // 자치구 목록 (선택된 시도의 schools에서 추출)
  const districtList = React.useMemo(() => {
    if (!schools || !pickedProvince) return [];
    const inProv = schools.filter(s => s.office === pickedProvince.code);
    const counts = new Map();
    inProv.forEach(s => { if (s.district && s.district !== '기타') counts.set(s.district, (counts.get(s.district)||0)+1); });
    return [...counts.entries()].sort((a,b) => b[1]-a[1]);
  }, [schools, pickedProvince]);

  // 선택된 자치구 + 학교급의 학교 목록
  const schoolList = React.useMemo(() => {
    if (!schools || !pickedProvince || !pickedDistrict) return [];
    let filtered = schools.filter(s => s.office === pickedProvince.code && s.district === pickedDistrict);
    if (pickedKind !== '전체') filtered = filtered.filter(s => s.kind === pickedKind);
    if (searchTerm.trim()) filtered = filtered.filter(s => s.name.includes(searchTerm.trim()));
    return filtered.sort((a,b) => a.name.localeCompare(b.name, 'ko'));
  }, [schools, pickedProvince, pickedDistrict, pickedKind, searchTerm]);

  // 단계 이동
  const goToStep = (s) => setStep(s);
  const onPickProvince = (p) => {
    setPickedProvince(p);
    if (p.code !== province.code) setProvince(p); // 학교 데이터 재로드 트리거
    setPickedDistrict(null);
    setStep(1);
  };
  const onPickDistrict = (d) => {
    setPickedDistrict(d);
    setPickedKind('전체');
    setSearchTerm('');
    setStep(2);
  };
  const onPickSchool = (school) => {
    navigate('school', { code: school.code });
  };

  const STEP_LABELS = ['시도교육청','시·구·군','학교 선택'];

  return (
    <div style={{ position:'absolute', inset:0, background:dark?'#000':'var(--color-neutral-100)', overflowY:'auto' }}>
      {/* 헤더 */}
      <div style={{ background:cardBg, paddingTop:56, paddingBottom:14, borderBottom:`1px solid ${dark?'rgba(255,255,255,0.06)':'var(--alpha-black-10)'}` }}>
        <div style={{ display:'flex', alignItems:'center', padding:'0 8px', gap:4 }}>
          <button onClick={back} style={{ width:40, height:40, borderRadius:9999, background:'transparent', border:'none', cursor:'pointer' }}>
            <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9 1L1 9l8 8" stroke={text} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:9, fontWeight:800, color:headerColor, letterSpacing:'0.18em' }}>STEP-BY-STEP</div>
            <div style={{ fontSize:18, fontWeight:800, color:text, letterSpacing:'-0.02em', marginTop:2 }}>학교 목록 찾기</div>
          </div>
        </div>

        {/* Stepper */}
        <div style={{ display:'flex', alignItems:'center', padding:'14px 16px 0', gap:6 }}>
          {STEP_LABELS.map((label, i) => {
            const active = step === i;
            const done = step > i;
            const clickable = i === 0 || (i === 1 && pickedProvince) || (i === 2 && pickedDistrict);
            return (
              <React.Fragment key={i}>
                <div onClick={() => clickable && goToStep(i)} style={{
                  flex:1, padding:'8px 6px', borderRadius:8, cursor: clickable?'pointer':'default',
                  background: active ? `${headerColor}1A` : (done ? (dark?'rgba(0,191,64,0.12)':'var(--bg-success-tint)') : cardBg2),
                  border: `1.5px solid ${active?headerColor:done?'var(--color-green-600)':'transparent'}`,
                  textAlign:'center',
                }}>
                  <div style={{ fontSize:9, fontWeight:800, color: active?headerColor:done?'var(--color-green-600)':sub, letterSpacing:'0.04em' }}>
                    {done?'✓ ':'STEP '}{i+1}
                  </div>
                  <div style={{ fontSize:10, fontWeight:700, color:text, marginTop:2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{label}</div>
                </div>
                {i < STEP_LABELS.length-1 && <span style={{ fontSize:14, color:sub }}>›</span>}
              </React.Fragment>
            );
          })}
        </div>

        {/* Breadcrumb */}
        {(pickedProvince || pickedDistrict) && (
          <div style={{ padding:'10px 16px 0', display:'flex', flexWrap:'wrap', gap:4, fontSize:11, color:sub }}>
            {pickedProvince && (
              <span style={{ background:`${headerColor}1A`, color:headerColor, padding:'3px 8px', borderRadius:5, fontWeight:800 }}>📍 {pickedProvince.name}</span>
            )}
            {pickedDistrict && (
              <>
                <span style={{ color:sub }}>›</span>
                <span style={{ background:'rgba(151,71,255,0.14)', color:'#9747FF', padding:'3px 8px', borderRadius:5, fontWeight:800 }}>{pickedDistrict}</span>
              </>
            )}
          </div>
        )}
      </div>

      {/* 본문 */}
      <div style={{ padding:'14px 16px' }}>
        {/* STEP 0: 시도 선택 */}
        {step === 0 && (
          <>
            <div style={{ fontSize:12, fontWeight:800, color:sub, padding:'4px 4px 10px', letterSpacing:'0.04em', textTransform:'uppercase' }}>시도교육청 17개</div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              {window.PROVINCES.map(p => {
                const active = pickedProvince?.code === p.code;
                return (
                  <div key={p.code} onClick={() => onPickProvince(p)} style={{
                    background:cardBg, borderRadius:12, padding:14, cursor:'pointer',
                    border:`1.5px solid ${active?headerColor:'transparent'}`,
                    display:'flex', alignItems:'center', gap:10,
                    boxShadow:active?`0 4px 12px ${headerColor}30`:'none',
                  }}>
                    <div style={{ width:36, height:36, borderRadius:9, background:`${headerColor}15`, color:headerColor, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, flexShrink:0 }}>🏛</div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13, fontWeight:800, color:text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.name}</div>
                      <div style={{ fontSize:9, color:sub, marginTop:1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.full}</div>
                    </div>
                    {active && <span style={{ color:headerColor, fontSize:14 }}>✓</span>}
                  </div>
                );
              })}
            </div>
          </>
        )}

        {/* STEP 1: 자치구 선택 */}
        {step === 1 && pickedProvince && (
          <>
            <div style={{ fontSize:12, fontWeight:800, color:sub, padding:'4px 4px 10px', letterSpacing:'0.04em', textTransform:'uppercase' }}>
              {pickedProvince.name} 시·구·군 {districtList.length}개
            </div>
            {!schools || dataMode === 'loading' ? (
              <div style={{ background:cardBg, borderRadius:12, padding:28, textAlign:'center' }}>
                <div style={{ fontSize:11, color:sub }}>NEIS API에서 학교 데이터 불러오는 중…</div>
              </div>
            ) : dataMode === 'error' || districtList.length === 0 ? (
              <div style={{ background:cardBg, borderRadius:12, padding:20, textAlign:'center', border:'1px solid rgba(255,66,66,0.25)' }}>
                <div style={{ fontSize:13, fontWeight:800, color:'#c53030', marginBottom:6 }}>⚠️ NEIS 연결 실패</div>
                <div style={{ fontSize:11, color:sub, lineHeight:1.5, marginBottom:12 }}>
                  {pickedProvince.name} 학교기본정보를 불러오지 못했습니다.<br/>
                  네트워크 또는 CORS 프록시 일시 차단일 수 있습니다.
                </div>
                <button onClick={() => retryFetchSchools && retryFetchSchools()} style={{
                  padding:'10px 18px', borderRadius:9, border:'none',
                  background:dark?'#fff':'var(--color-neutral-1000)', color:dark?'#000':'white',
                  fontSize:12, fontWeight:800, cursor:'pointer',
                }}>🔄 다시 시도</button>
              </div>
            ) : (
              <div style={{ background:cardBg, borderRadius:12, overflow:'hidden' }}>
                {districtList.map(([name, count], i) => (
                  <div key={name} onClick={() => onPickDistrict(name)} style={{
                    padding:'14px 16px', display:'flex', alignItems:'center', gap:12, cursor:'pointer',
                    borderTop: i?`1px solid ${dark?'rgba(255,255,255,0.05)':'var(--alpha-black-10)'}`:'none',
                  }}>
                    <div style={{ width:34, height:34, borderRadius:9, background:'rgba(151,71,255,0.14)', color:'#9747FF', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, flexShrink:0 }}>📍</div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13, fontWeight:700, color:text }}>{name}</div>
                      <div style={{ fontSize:10, color:sub, marginTop:1 }}>학교 {count.toLocaleString()}개</div>
                    </div>
                    <span style={{ fontSize:16, color:sub }}>›</span>
                  </div>
                ))}
              </div>
            )}
          </>
        )}

        {/* STEP 2: 학교급 + 학교 선택 */}
        {step === 2 && pickedDistrict && (
          <>
            {/* 학교급 칩 */}
            <div style={{ display:'flex', gap:6, marginBottom:10, overflowX:'auto', scrollbarWidth:'none' }}>
              {['전체','초등학교','중학교','고등학교'].map(k => (
                <span key={k} onClick={() => setPickedKind(k)} style={{
                  flexShrink:0, padding:'7px 12px', borderRadius:9999,
                  background: pickedKind===k?headerColor:cardBg, color: pickedKind===k?'white':text,
                  border:`1px solid ${pickedKind===k?headerColor:(dark?'rgba(255,255,255,0.08)':'var(--alpha-black-22)')}`,
                  fontSize:12, fontWeight:700, cursor:'pointer',
                }}>{k==='초등학교'?'🔵 초':k==='중학교'?'🟢 중':k==='고등학교'?'🟠 고':k}</span>
              ))}
            </div>

            {/* 검색 박스 */}
            <div style={{ background:cardBg, borderRadius:10, padding:'8px 12px', marginBottom:10, display:'flex', alignItems:'center', gap:8, border:`1px solid ${dark?'rgba(255,255,255,0.06)':'var(--alpha-black-10)'}` }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={sub} strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-6-6" strokeLinecap="round"/></svg>
              <input value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
                placeholder="학교명으로 검색"
                style={{ flex:1, border:'none', outline:'none', background:'transparent', fontSize:12, color:text, fontWeight:500 }}/>
              {searchTerm && <span onClick={() => setSearchTerm('')} style={{ color:sub, cursor:'pointer', fontSize:14 }}>×</span>}
            </div>

            {/* 결과 카운트 */}
            <div style={{ fontSize:10, fontWeight:800, color:sub, padding:'4px 4px 8px' }}>
              {pickedDistrict} {pickedKind!=='전체'?pickedKind:''} · {schoolList.length.toLocaleString()}개교
            </div>

            {/* 학교 리스트 */}
            {schoolList.length === 0 ? (
              <div style={{ background:cardBg, borderRadius:12, padding:28, textAlign:'center' }}>
                <div style={{ fontSize:24, marginBottom:6 }}>🔍</div>
                <div style={{ fontSize:12, color:sub }}>{searchTerm ? `"${searchTerm}" 검색 결과 없음` : '해당 조건의 학교가 없습니다'}</div>
              </div>
            ) : (
              <div style={{ background:cardBg, borderRadius:12, overflow:'hidden' }}>
                {schoolList.map((s, i) => {
                  const kColor = kindColor(s.kind);
                  return (
                    <div key={s.code} onClick={() => onPickSchool(s)} style={{
                      padding:'12px 14px', display:'flex', alignItems:'center', gap:10, cursor:'pointer',
                      borderTop: i?`1px solid ${dark?'rgba(255,255,255,0.04)':'var(--alpha-black-10)'}`:'none',
                    }}>
                      <div style={{ width:32, height:32, borderRadius:8, background:`${kColor}1A`, color:kColor, display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:800, flexShrink:0 }}>{kindShort(s.kind)}</div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:13, fontWeight:700, color:text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{s.name}</div>
                        <div style={{ fontSize:10, color:sub, marginTop:1 }}>{s.kind}</div>
                      </div>
                      <div style={{ fontSize:11, fontWeight:800, color:'white', background:s.score>=85?'var(--color-green-600)':s.score>=75?'#FFC700':'var(--color-red-600)', padding:'3px 8px', borderRadius:5 }}>{s.score}</div>
                      <span style={{ fontSize:14, color:sub }}>›</span>
                    </div>
                  );
                })}
              </div>
            )}
          </>
        )}

        <div style={{ height:40 }}/>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Screen: 🤖 AI 영양 챗봇 (RAG-style 다중 턴 대화)
// ═══════════════════════════════════════════════════════════════
function ScreenChatbot() {
  const { mySchool, schools, navigate, tweaks, aiProvider, aiKeys, aiActive, myAllergies, dietaryPrefs } = useApp();
  const dark = tweaks.dark;
  const cardBg = dark?'#1c1c1e':'white';
  const cardBg2 = dark?'#2c2c2e':'var(--color-neutral-100)';
  const text = dark?'#fff':'var(--color-neutral-1000)';
  const sub = dark?'rgba(255,255,255,0.6)':'var(--color-neutral-700)';
  const my = mySchool && schools ? schools.find(s => s.code === mySchool) : null;
  const PROVIDER_LABELS = { claude:'Claude', openai:'ChatGPT', gemini:'Gemini' };

  const [messages, setMessages] = React.useState([
    { role:'assistant', content: my
      ? `안녕하세요! 학교 급식 영양 코치입니다 🥗\n${my.name} 정보를 기반으로 맞춤 답변을 드릴게요. 무엇이 궁금하신가요?`
      : '안녕하세요! 학교 급식 영양 코치입니다 🥗\n무엇이 궁금하신가요?'
    }
  ]);
  const [input, setInput] = React.useState('');
  const [sending, setSending] = React.useState(false);
  const scrollRef = React.useRef(null);
  const inputRef = React.useRef(null);

  // 추천 질문 (학교 등록 여부에 따라 다름)
  const QUICK_PROMPTS = my ? [
    { e:'📏', q:'우리 아이 키가 작은데 추천 메뉴 알려줘' },
    { e:'💪', q:'고단백 식단 짜줘' },
    { e:'🤧', q:'면역력 강화 메뉴 추천해줘' },
    { e:'⚠️', q:'알레르기 학생을 위한 식단은?' },
    { e:'🥬', q:'채식주의자 학생 메뉴 추천' },
    { e:'📊', q:`${my.name} 영양은 어떤가요?` },
    { e:'🌾', q:'국내산 비율 어떻게 늘리나요?' },
    { e:'🍱', q:'이번 주 메뉴 평가해줘' },
  ] : [
    { e:'🍱', q:'학교 급식 영양은 어떻게 평가해요?' },
    { e:'⚠️', q:'알레르기 정보는 어디서 보나요?' },
    { e:'💪', q:'고단백 식단의 특징은?' },
    { e:'🤧', q:'면역력 강화 식품 추천해줘' },
    { e:'🥬', q:'채식주의자 식단 구성법은?' },
    { e:'🌾', q:'국내산 식재료의 장점은?' },
  ];

  // 자동 스크롤
  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, sending]);

  // RAG 컨텍스트 구성
  const buildContext = () => {
    let ctx = '[시스템] 당신은 친근하고 전문적인 학교 급식 영양 코치입니다. 한국어로 200자 이내로 답변하세요. 마크다운 사용 금지.\n\n';
    if (my) {
      const idx = indicesOf(my.code);
      const overall = Math.round(['kcal','diversity','freshness','balance','origin','seasonal'].reduce((s,k)=>s+idx[k],0)/6);
      ctx += `[학교 정보]\n- 이름: ${my.name}\n- 학교급: ${my.kind}\n- 위치: ${my.district}\n- 종합 영양 점수: ${overall}점\n- 다양성: ${idx.diversity}점, 원산지: ${idx.origin}점, 균형: ${idx.balance}점\n\n`;
    }
    if (myAllergies && myAllergies.length > 0) {
      ctx += `[사용자 알레르기]\n- ${myAllergies.join(', ')}\n\n`;
    }
    const dietList = Object.entries(dietaryPrefs||{}).filter(([,v])=>v).map(([k]) => k);
    if (dietList.length > 0) {
      ctx += `[식이 제한]\n- ${dietList.join(', ')}\n\n`;
    }
    return ctx;
  };

  const send = async (overrideText) => {
    const userText = (overrideText || input).trim();
    if (!userText || sending) return;
    const userMsg = { role:'user', content: userText, ts: Date.now() };
    const newMsgs = [...messages, userMsg];
    setMessages(newMsgs);
    setInput('');
    setSending(true);

    if (!aiActive) {
      setTimeout(() => {
        setMessages(m => [...m, {
          role:'assistant',
          content:'AI 키가 설정되지 않아 데모 응답입니다. 설정 → AI 분석 설정에서 Claude·ChatGPT·Gemini 중 하나의 키를 등록하시면 실제 AI가 답변해드려요.\n\n예시: 균형잡힌 식단이라면 5대 영양소(탄수·단백·지방·비타민·무기질)를 적절히 포함해야 해요. 학교 급식은 영양사 선생님이 학생 권장량 기준으로 설계하므로 가정에서는 부족한 영양소를 보완하면 좋아요.',
          ts: Date.now(),
        }]);
        setSending(false);
      }, 800);
      return;
    }

    try {
      const ctx = buildContext();
      const conversation = newMsgs.slice(-6).map(m => `${m.role==='user'?'사용자':'코치'}: ${m.content}`).join('\n\n');
      const prompt = `${ctx}[대화]\n${conversation}\n\n코치:`;
      const text = await window.callAI(aiProvider, aiKeys, prompt, { maxTokens: 600 });
      setMessages(m => [...m, { role:'assistant', content: text.trim(), ts: Date.now(), source: aiProvider }]);
    } catch (e) {
      setMessages(m => [...m, { role:'assistant', content: `죄송해요, 오류가 발생했어요. (${e.message || 'unknown'})\n잠시 후 다시 시도해주세요.`, ts: Date.now(), error:true }]);
    } finally {
      setSending(false);
    }
  };

  const clearChat = () => {
    setMessages([{ role:'assistant', content:'대화를 초기화했어요. 무엇이 궁금하신가요?' }]);
  };

  return (
    <div style={{ position:'absolute', inset:0, background:dark?'#000':'var(--color-neutral-100)', display:'flex', flexDirection:'column' }}>
      {/* 헤더 */}
      <div style={{ background:`linear-gradient(135deg, var(--color-blue-600), #9747FF)`, paddingTop:56, paddingBottom:14, color:'white', flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', padding:'0 8px', gap:6 }}>
          <button onClick={() => navigate('map')} style={{ width:40, height:40, borderRadius:9999, background:'transparent', border:'none', cursor:'pointer' }}>
            <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9 1L1 9l8 8" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <div style={{ width:36, height:36, borderRadius:10, background:'rgba(255,255,255,0.22)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:18 }}>🤖</div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:14, fontWeight:800, letterSpacing:'-0.01em' }}>AI 영양 코치</div>
            <div style={{ fontSize:10, opacity:0.85, marginTop:1, display:'flex', alignItems:'center', gap:4 }}>
              <span style={{ width:6, height:6, borderRadius:99, background:aiActive?'#00BF40':'#FFC700' }}/>
              {aiActive ? `${PROVIDER_LABELS[aiProvider]} 연결됨 · 24/7 답변` : '데모 모드 (AI 키 미설정)'}
            </div>
          </div>
          <button onClick={clearChat} title="대화 초기화" style={{ width:36, height:36, borderRadius:9999, background:'rgba(255,255,255,0.18)', color:'white', border:'none', cursor:'pointer', fontSize:14 }}>↻</button>
        </div>
        {my && (
          <div style={{ padding:'10px 16px 0', display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ fontSize:11, opacity:0.85 }}>📋 컨텍스트:</span>
            <span style={{ fontSize:10, fontWeight:700, background:'rgba(255,255,255,0.18)', padding:'3px 8px', borderRadius:4 }}>🏫 {my.name}</span>
            {myAllergies && myAllergies.length > 0 && <span style={{ fontSize:10, fontWeight:700, background:'rgba(255,255,255,0.18)', padding:'3px 8px', borderRadius:4 }}>⚠ 알레르기 {myAllergies.length}</span>}
          </div>
        )}
      </div>

      {/* 메시지 영역 */}
      <div ref={scrollRef} style={{ flex:1, overflowY:'auto', padding:'14px 14px 0' }}>
        {messages.map((m, i) => {
          const isUser = m.role === 'user';
          return (
            <div key={i} style={{
              display:'flex', flexDirection: isUser?'row-reverse':'row',
              gap:8, marginBottom:12, alignItems:'flex-start',
            }}>
              {!isUser && (
                <div style={{ width:32, height:32, borderRadius:9, background:m.error?'rgba(255,66,66,0.2)':`${dark?'rgba(151,71,255,0.2)':'rgba(151,71,255,0.12)'}`, color: m.error?'#FF4242':'#9747FF', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, flexShrink:0 }}>
                  {m.error?'⚠':'🤖'}
                </div>
              )}
              <div style={{ maxWidth:'78%', display:'flex', flexDirection:'column', alignItems: isUser?'flex-end':'flex-start' }}>
                <div style={{
                  background: isUser
                    ? `linear-gradient(135deg, var(--color-blue-600), #9747FF)`
                    : cardBg,
                  color: isUser ? 'white' : text,
                  padding:'11px 14px',
                  borderRadius: isUser ? '14px 14px 4px 14px' : '14px 14px 14px 4px',
                  fontSize:13, lineHeight:1.55, fontWeight:500,
                  whiteSpace:'pre-wrap',
                  border: isUser ? 'none' : `1px solid ${dark?'rgba(255,255,255,0.06)':'var(--alpha-black-10)'}`,
                  boxShadow: isUser ? 'none' : '0 1px 3px rgba(0,0,0,0.04)',
                }}>{m.content}</div>
                {!isUser && m.source && (
                  <span style={{ fontSize:8, fontWeight:800, color:sub, marginTop:4, marginLeft:2, letterSpacing:'0.06em', textTransform:'uppercase' }}>
                    via {PROVIDER_LABELS[m.source]}

              </div>
            </div>

        {/* 타이핑 인디케이터 */}
        {sending && (
          <div style={{ display:'flex', gap:8, marginBottom:12, alignItems:'flex-start' }}>
            <div style={{ width:32, height:32, borderRadius:9, background:dark?'rgba(151,71,255,0.2)':'rgba(151,71,255,0.12)', color:'#9747FF', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, flexShrink:0 }}>🤖</div>
            <div style={{ background:cardBg, padding:'12px 16px', borderRadius:'14px 14px 14px 4px', border:`1px solid ${dark?'rgba(255,255,255,0.06)':'var(--alpha-black-10)'}` }}>
              <div style={{ display:'flex', gap:4 }}>
                {[0,1,2].map(i => (
                  <span key={i} style={{
                    width:6, height:6, borderRadius:99, background:'#9747FF',
                    animation:`bounce 1.4s ease-in-out ${i*0.16}s infinite`,
                  }}/>
                ))}
              </div>
              <style>{`@keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:0.4;} 40%{transform:translateY(-6px);opacity:1;} }`}</style>
            </div>
          </div>
        )}

        {/* 추천 질문 (대화 시작 시만) */}
        {messages.length <= 1 && !sending && (
          <div style={{ marginTop:8, marginBottom:14 }}>
            <div style={{ fontSize:10, fontWeight:800, color:sub, marginBottom:8, letterSpacing:'0.06em' }}>💡 추천 질문</div>
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {QUICK_PROMPTS.map((p, i) => (
                <button key={i} onClick={() => send(p.q)} style={{
                  background:cardBg, border:`1px solid ${dark?'rgba(255,255,255,0.06)':'var(--alpha-black-10)'}`,
                  borderRadius:10, padding:'10px 12px', textAlign:'left', cursor:'pointer',
                  display:'flex', alignItems:'center', gap:10,
                }}>
                  <span style={{ fontSize:16 }}>{p.e}</span>
                  <span style={{ fontSize:12, fontWeight:600, color:text }}>{p.q}</span>
                </button>
              ))}
            </div>
          </div>
        )}
        <div style={{ height:14 }}/>
      </div>

      {/* 입력 영역 */}
      <div style={{ background:cardBg, padding:'10px 12px 30px', borderTop:`1px solid ${dark?'rgba(255,255,255,0.06)':'var(--alpha-black-10)'}`, flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'flex-end', gap:8 }}>
          <textarea
            ref={inputRef}

            onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
            placeholder="메시지를 입력하세요…"
            rows={1}
            style={{
              flex:1, resize:'none', minHeight:38, maxHeight:80,
              padding:'10px 12px', borderRadius:10,
              background: dark?'#2c2c2e':'var(--color-neutral-100)',
              border:`1px solid ${dark?'rgba(255,255,255,0.08)':'var(--alpha-black-10)'}`,
