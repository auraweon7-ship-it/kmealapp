            }}
          />
          <button onClick={() => send()} disabled={!input.trim() || sending} style={{
            width:42, height:42, borderRadius:10, border:'none',
            background: input.trim() && !sending ? 'linear-gradient(135deg, var(--color-blue-600), #9747FF)' : (dark?'#2c2c2e':'var(--color-neutral-200)'),
            color:'white', fontSize:14, fontWeight:800,
            cursor: input.trim() && !sending ? 'pointer' : 'not-allowed',
            display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
          }}>{sending?'⋯':'➤'}</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 📈 TimelineAnimation — 12개월 자치구 영양 점수 변화 (Racing Chart)
// ═══════════════════════════════════════════════════════════════
function TimelineAnimation({ stats, cardBg, cardBg2, text, sub, dark }) {
  const [playing, setPlaying] = React.useState(false);
  const [month, setMonth] = React.useState(0);
  const [speed, setSpeed] = React.useState(1); // 1x, 2x

  const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const CAPTIONS = [
    { e:'🌱', t:'신학기 시작',          d:'영양 정책 개편 + 식단 표준화'   },
    { e:'📚', t:'학기 적응기',          d:'학생 만족도 안정화'               },
    { e:'⚠️', t:'환절기 알레르기',     d:'호흡기·알레르기 관련 식단 강화'  },
    { e:'🌷', t:'봄철 제철 메뉴',       d:'국내산 봄나물·딸기 편성 증가'    },
    { e:'🌞', t:'여름맞이 영양',        d:'수분·전해질 보충 메뉴 도입'      },
    { e:'🏖️', t:'여름방학 영향',       d:'평가 데이터 부족 시기'            },
    { e:'📖', t:'2학기 개학',           d:'영양 기준 재강화 + 친환경 정책'  },
    { e:'🌾', t:'국내산 정책 시행',     d:'전국 평균 +3.2점 상승'           },
    { e:'🌕', t:'추석 특식',            d:'송편·갈비찜 등 전통식 편성'      },
    { e:'🍂', t:'가을 제철',            d:'밤·고구마 등 가을 식재료 활용'   },
    { e:'❄️', t:'동절기 면역 강화',    d:'비타민C·D 풍부 메뉴 + 따뜻한 국' },
    { e:'🎓', t:'학년 마무리',          d:'연간 영양 목표 달성 평가'        },
  ];

  // 자치구별 12개월 시계열 (결정적 시드)
  const series = React.useMemo(() => {
    if (!stats || stats.length === 0) return [];
    return stats.map(d => {
      let h = 0; for (let i=0;i<d.district.length;i++) h=(h*31+d.district.charCodeAt(i))>>>0;
      const base = d.avgScore;
      const values = Array.from({length:12}).map((_, m) => {
        const seasonalAdj = m===2||m===3 ? -1.5 : m===7 ? 1.5 : m===10 ? -1 : m===11 ? 0.5 : 0;
        const noise = (((h + m*47) % 60) - 30) / 12;
        return Math.max(50, Math.min(100, base + seasonalAdj + noise));
      });
      return { name: d.district, values, base, color: d.avgScore>=85?'#00BF40':d.avgScore>=75?'#FFC700':d.avgScore>=65?'#FF7700':'#FF4242' };
    });
  }, [stats]);

  // 애니메이션 루프
  React.useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => {
      setMonth(m => {
        const next = m + 1;
        if (next >= 12) { setPlaying(false); return 11; }
        return next;
      });
    }, 1200 / speed);
    return () => clearInterval(id);
  }, [playing, speed]);

  // 현재 월 기준 정렬된 TOP 8
  const ranked = React.useMemo(() => {
    return series.map(s => ({ ...s, current: s.values[month] }))
      .sort((a,b) => b.current - a.current)
      .slice(0, 8);
  }, [series, month]);

  const monthAvg = React.useMemo(() => {
    if (series.length === 0) return 0;
    return series.reduce((s,d) => s + d.values[month], 0) / series.length;
  }, [series, month]);

  // 전월 대비
  const prevAvg = month === 0 ? monthAvg : (series.reduce((s,d) => s + d.values[month-1], 0) / series.length);
  const delta = monthAvg - prevAvg;

  if (series.length === 0) return null;
  const cap = CAPTIONS[month];
  const maxVal = Math.max(...ranked.map(r=>r.current));

  return (
    <div style={{ background:cardBg, borderRadius:16, padding:14, marginBottom:8, border:`1px solid ${dark?'rgba(255,255,255,0.04)':'var(--alpha-black-10)'}` }}>
      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:4 }}>
        <div style={{ fontSize:12, fontWeight:800, color:text }}>📈 12개월 시계열 애니메이션</div>
        <span style={{ fontSize:9, fontWeight:800, color:sub, letterSpacing:'0.06em' }}>RACING  CHART</span>
      </div>
      <div style={{ fontSize:10, color:sub, marginBottom:12, fontWeight:600 }}>자치구별 영양 점수 변화 — 재생 버튼으로 시각화</div>

      {/* 현재 월 표시 + 캡션 */}
      <div style={{ background:cardBg2, borderRadius:12, padding:'12px 14px', marginBottom:10 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6 }}>
          <div style={{ width:38, height:38, borderRadius:10, background:'linear-gradient(135deg, #0066FF, #9747FF)', color:'white', display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, flexShrink:0 }}>{cap.e}</div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:11, fontWeight:800, color:text, letterSpacing:'-0.01em' }}>{MONTHS[month]} · {cap.t}</div>
            <div style={{ fontSize:10, color:sub, marginTop:2, lineHeight:1.3 }}>{cap.d}</div>
          </div>
          <div style={{ textAlign:'right' }}>
            <div style={{ fontSize:9, color:sub, fontWeight:700 }}>전국 평균</div>
            <div style={{ fontSize:14, fontWeight:800, color:text, fontVariantNumeric:'tabular-nums' }}>{monthAvg.toFixed(1)}</div>
            {delta !== 0 && month > 0 && (
              <div style={{ fontSize:9, fontWeight:700, color: delta>0?'#00BF40':'#FF4242' }}>
                {delta>0?'▲':'▼'} {Math.abs(delta).toFixed(1)}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Racing bars — 부드러운 transition */}
      <div style={{ display:'flex', flexDirection:'column', gap:5, marginBottom:12, minHeight:240 }}>
        {ranked.map((r, i) => {
          const widthPct = (r.current / maxVal) * 100;
          return (
            <div key={r.name} style={{
              display:'flex', alignItems:'center', gap:8, height:26,
              transition:'transform 0.6s ease-out',
              transform: `translateY(${i*0}px)`,
            }}>
              <span style={{ width:18, fontSize:10, fontWeight:800, color: i<3?text:sub, textAlign:'center', fontVariantNumeric:'tabular-nums' }}>
                {i+1}
              </span>
              <span style={{ width:60, fontSize:11, fontWeight:700, color:text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{r.name}</span>
              <div style={{ flex:1, height:18, background:dark?'#0a0e1a':'var(--color-neutral-200)', borderRadius:5, overflow:'hidden', position:'relative' }}>
                <div style={{
                  width:`${widthPct}%`, height:'100%',
                  background:`linear-gradient(90deg, ${r.color}, ${r.color}dd)`,
                  borderRadius:5,
                  transition:'width 0.9s cubic-bezier(0.34, 1.4, 0.64, 1)',
                }}/>
                {i === 0 && <span style={{ position:'absolute', left:6, top:'50%', transform:'translateY(-50%)', fontSize:11 }}>🏆</span>}
              </div>
              <span style={{
                width:36, textAlign:'right', fontSize:11, fontWeight:800, color:r.color,
                fontVariantNumeric:'tabular-nums',
                transition:'color 0.4s',
              }}>{r.current.toFixed(1)}</span>
            </div>
          );
        })}
      </div>

      {/* 타임라인 스크러버 */}
      <div style={{ marginBottom:12 }}>
        <input type="range" min="0" max="11" step="1" value={month}
          onChange={e => { setMonth(parseInt(e.target.value)); setPlaying(false); }}
          style={{ width:'100%', accentColor:'#9747FF' }}/>
        <div style={{ display:'flex', justifyContent:'space-between', marginTop:4, fontSize:9, color:sub, fontWeight:600 }}>
          <span>1월</span>
          <span>3월</span>
          <span>6월</span>
          <span>9월</span>
          <span>12월</span>
        </div>
      </div>

      {/* 컨트롤 */}
      <div style={{ display:'flex', gap:6 }}>
        <button onClick={() => { if (month >= 11) setMonth(0); setPlaying(p => !p); }} style={{
          flex:2, height:38, borderRadius:9, border:'none', cursor:'pointer',
          background:'linear-gradient(135deg, #0066FF, #9747FF)', color:'white',
          fontSize:13, fontWeight:800,
          display:'flex', alignItems:'center', justifyContent:'center', gap:6,
        }}>
          {playing ? '⏸ 일시정지' : (month >= 11 ? '↻ 다시 재생' : '▶ 재생')}
        </button>
        <button onClick={() => { setPlaying(false); setMonth(0); }} style={{
          width:38, height:38, borderRadius:9, border:'none', cursor:'pointer',
          background:cardBg2, color:text, fontSize:14,
        }}>⏮</button>
        <button onClick={() => setSpeed(s => s===1?2:s===2?0.5:1)} style={{
          width:42, height:38, borderRadius:9, border:'none', cursor:'pointer',
          background:cardBg2, color:text, fontSize:11, fontWeight:800,
        }}>{speed}x</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Screen: GIS 영양 격차 분석 리포트
// ═══════════════════════════════════════════════════════════════
function ScreenGap() {
  const { schools, navigate, tweaks, province, setFilter, filter } = useApp();
  const dark = tweaks.dark;
  const cardBg = dark?'#1c1c1e':'white';
  const cardBg2 = dark?'#2c2c2e':'var(--color-neutral-100)';
  const text = dark?'#fff':'var(--color-neutral-1000)';
  const sub = dark?'rgba(255,255,255,0.6)':'var(--color-neutral-700)';

  // 자치구 통계 집계
  const stats = React.useMemo(() => {
    if (!schools || schools.length === 0) return [];
    const groups = {};
    schools.forEach(s => {
      if (!s.district || s.district === '기타') return;
      if (!groups[s.district]) groups[s.district] = [];
      groups[s.district].push(s);
    });
    return Object.entries(groups).map(([name, sch]) => {
      let h = 0; for (let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
      const avgScore = sch.reduce((a,b)=>a+b.score,0) / sch.length;
      // 자치구 ESG — 학교들의 ESG 평균
      const esgList = sch.map(s => window.calculateESG(s.code, indicesOf(s.code)));
      const avgESG = Math.round(esgList.reduce((a,b)=>a+b.total,0) / esgList.length);
      const avgE = Math.round(esgList.reduce((a,b)=>a+b.E,0) / esgList.length);
      const avgS = Math.round(esgList.reduce((a,b)=>a+b.S,0) / esgList.length);
      const avgG = Math.round(esgList.reduce((a,b)=>a+b.G,0) / esgList.length);
      const esgGrade = avgESG>=90?'A+':avgESG>=85?'A':avgESG>=80?'B+':avgESG>=75?'B':avgESG>=70?'C+':avgESG>=65?'C':'D';
      const esgGradeColor = avgESG>=90?'#00BF40':avgESG>=85?'#5fcc6e':avgESG>=80?'#FFC700':avgESG>=75?'#FF7700':avgESG>=70?'#fb923c':'#FF4242';
      // CO2 추정 — 자치구 학교 평균 (mock)
      const avgCO2g = 800 + ((h*7)%1500);
      return {
        district: name, schoolCount: sch.length,
        avgScore: Math.round(avgScore*10)/10,
        multiPct: 3 + (h%12),
        freeMealPct: 35 + (h%45),
        i18nPct: (h%30),
        allergyPct: 2 + (h%5),
        carbonScore: 50 + (h%40),
        avgESG, avgE, avgS, avgG, esgGrade, esgGradeColor,
        avgCO2g,
      };
    });
  }, [schools]);

  const sortedAsc = [...stats].sort((a,b) => a.avgScore - b.avgScore);
  const sortedDesc = [...stats].sort((a,b) => b.avgScore - a.avgScore);
  const overall = stats.length ? stats.reduce((s,d)=>s+d.avgScore,0)/stats.length : 0;
  const stdev = stats.length ? Math.sqrt(stats.reduce((s,d)=>s+Math.pow(d.avgScore-overall,2),0)/stats.length) : 0;
  const gapMax = stats.length ? sortedDesc[0].avgScore - sortedAsc[0].avgScore : 0;

  // 사각지대 (다문화 高 + 다국어 低)
  const blindSpots = stats.filter(s => s.multiPct >= 8 && s.i18nPct < 15).slice(0, 5);
  const lowScores = sortedAsc.slice(0, 5);
  const highScores = sortedDesc.slice(0, 5);

  // 자동 인사이트 생성
  const insights = React.useMemo(() => {
    const arr = [];
    if (gapMax > 10) {
      arr.push({ tone:'#FF4242', e:'⚠️', tag:'격차 경고', text:`상위·하위 자치구 평균 점수 차이가 ${gapMax.toFixed(1)}점에 달합니다. 영양 격차 해소 정책이 필요합니다.` });
    } else if (gapMax > 5) {
      arr.push({ tone:'#FF7700', e:'📊', tag:'격차 모니터링', text:`자치구 간 점수 격차 ${gapMax.toFixed(1)}점. 평균 수준이지만 지속 관찰이 필요합니다.` });
    } else {
      arr.push({ tone:'#00BF40', e:'✓', tag:'균형 양호', text:`자치구 간 점수 격차 ${gapMax.toFixed(1)}점. ${province.name} 자치구 영양 형평성이 우수합니다.` });
    }
    if (blindSpots.length > 0) {
      arr.push({ tone:'#FF4242', e:'🚨', tag:'사각지대 발견', text:`${blindSpots.map(b=>b.district).join('·')} 등 ${blindSpots.length}개 자치구는 다문화 학생 비율은 높지만 다국어 메뉴 표시가 15% 미만입니다.` });
    }
    if (lowScores.length > 0) {
      const worst = lowScores[0];
      arr.push({ tone:'#FF7700', e:'📉', tag:'개선 우선', text:`${worst.district} 평균 ${worst.avgScore}점 — ${province.name} 최하위. 영양사 컨설팅·식자재 개선 검토 권장.` });
    }
    if (highScores.length > 0) {
      const best = highScores[0];
      arr.push({ tone:'#00BF40', e:'🏆', tag:'우수 사례', text:`${best.district} 평균 ${best.avgScore}점 — ${province.name} 1위. 우수 사례를 다른 자치구와 공유 권장.` });
    }
    arr.push({ tone:'#0066FF', e:'💡', tag:'정책 제안', text:`다문화 학생 8% 이상 자치구 ${stats.filter(s=>s.multiPct>=8).length}개 — 다국어 메뉴 표시 의무화 검토 필요.` });
    return arr;
  }, [stats, gapMax, blindSpots, lowScores, highScores, province.name]);

  return (
    <div style={{ position:'absolute', inset:0, background:dark?'#000':'var(--color-neutral-100)', overflowY:'auto' }}>
      <div style={{ background:cardBg, paddingTop:56, paddingBottom:14, borderBottom:`1px solid ${dark?'rgba(255,255,255,0.06)':'var(--alpha-black-10)'}` }}>
        <div style={{ display:'flex', alignItems:'center', padding:'0 8px', gap:4 }}>
          <button onClick={() => navigate('map')} style={{ width:40, height:40, borderRadius:9999, background:'transparent', border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>
            <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9 1L1 9l8 8" stroke={text} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:10, fontWeight:800, color:'var(--color-violet-500)', letterSpacing:'0.18em' }}>NUTRITION  GAP  REPORT</div>
            <div style={{ fontSize:18, fontWeight:800, color:text, letterSpacing:'-0.02em', marginTop:2 }}>{province.name} 영양 격차 분석</div>
          </div>
        </div>
      </div>

      <div style={{ padding:'16px' }}>
        {/* 종합 통계 */}
        <div style={{ background:`linear-gradient(135deg, var(--color-blue-600), var(--color-violet-500))`, borderRadius:16, padding:18, color:'white', marginBottom:8 }}>
          <div style={{ fontSize:11, fontWeight:700, opacity:0.9, marginBottom:6 }}>📊 {province.name} 자치구 {stats.length}개 분석</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginTop:10 }}>
            <div>
              <div style={{ fontSize:9, opacity:0.85 }}>평균 점수</div>
              <div style={{ fontSize:20, fontWeight:800, marginTop:2 }}>{overall.toFixed(1)}</div>
            </div>
            <div>
              <div style={{ fontSize:9, opacity:0.85 }}>표준편차</div>
              <div style={{ fontSize:20, fontWeight:800, marginTop:2 }}>±{stdev.toFixed(1)}</div>
            </div>
            <div>
              <div style={{ fontSize:9, opacity:0.85 }}>최대 격차</div>
              <div style={{ fontSize:20, fontWeight:800, marginTop:2, color: gapMax>10?'#FFC700':'white' }}>{gapMax.toFixed(1)}점</div>
            </div>
          </div>
        </div>

        {/* 자동 인사이트 */}
        <div style={{ marginBottom:8 }}>
          <div style={{ fontSize:12, fontWeight:800, color:text, padding:'10px 4px 8px' }}>🔍 자동 인사이트</div>
          {insights.map((ins, i) => (
            <div key={i} style={{ background:cardBg, borderRadius:12, padding:'12px 14px', marginBottom:6, borderLeft:`3px solid ${ins.tone}`, border:`1px solid ${dark?'rgba(255,255,255,0.04)':'var(--alpha-black-10)'}` }}>
              <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:4 }}>
                <span style={{ fontSize:14 }}>{ins.e}</span>
                <span style={{ fontSize:10, fontWeight:800, color:ins.tone, letterSpacing:'0.04em', textTransform:'uppercase' }}>{ins.tag}</span>
              </div>
              <div style={{ fontSize:12, color:text, fontWeight:600, lineHeight:1.5 }}>{ins.text}</div>
            </div>
          ))}
        </div>

        {/* 사각지대 TOP */}
        {blindSpots.length > 0 && (
          <div style={{ marginBottom:8 }}>
            <div style={{ fontSize:12, fontWeight:800, color:'var(--color-red-600)', padding:'10px 4px 8px', display:'flex', alignItems:'center', gap:6 }}>
              🚨 사각지대 자치구
              <span style={{ fontSize:9, fontWeight:800, color:'white', background:'var(--color-red-600)', padding:'2px 6px', borderRadius:4 }}>{blindSpots.length}곳</span>
            </div>
            <div style={{ background:cardBg, borderRadius:14, overflow:'hidden', border:'1px solid rgba(255,66,66,0.15)' }}>
              {blindSpots.map((b, i) => (
                <div key={b.district} onClick={() => { setFilter({ ...filter, district: b.district, kind:'전체' }); navigate('map'); }} style={{ display:'flex', alignItems:'center', gap:10, padding:'12px 14px', cursor:'pointer', borderTop: i?`1px solid ${dark?'rgba(255,255,255,0.06)':'var(--alpha-black-10)'}`:'none' }}>
                  <div style={{ width:34, height:34, borderRadius:10, background:'var(--bg-danger-tint)', color:'var(--color-red-600)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, flexShrink:0 }}>🌍</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:800, color:text }}>{b.district}</div>
                    <div style={{ fontSize:10, color:sub, marginTop:1 }}>다문화 {b.multiPct}% · 다국어 {b.i18nPct}% · 학교 {b.schoolCount}개</div>
                  </div>
                  <span style={{ fontSize:14, color:sub }}>›</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* 점수 분포 막대 차트 */}
        <div style={{ background:cardBg, borderRadius:16, padding:14, marginBottom:8, border:`1px solid ${dark?'rgba(255,255,255,0.04)':'var(--alpha-black-10)'}` }}>
          <div style={{ fontSize:12, fontWeight:800, color:text, marginBottom:12 }}>📊 자치구별 평균 점수</div>
          <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
            {sortedDesc.slice(0, 12).map(d => {
              const tone = d.avgScore>=85?'#00BF40':d.avgScore>=75?'#FFC700':d.avgScore>=65?'#FF7700':'#FF4242';
              const widthPct = (d.avgScore / 100) * 100;
              return (
                <div key={d.district} style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <span style={{ width:60, fontSize:10, fontWeight:700, color:text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{d.district}</span>
                  <div style={{ flex:1, height:14, background:cardBg2, borderRadius:4, overflow:'hidden', position:'relative' }}>
                    <div style={{ width:`${widthPct}%`, height:'100%', background:tone, borderRadius:4, transition:'width 0.6s' }} />
                  </div>
                  <span style={{ width:36, textAlign:'right', fontSize:10, fontWeight:800, color:tone, fontVariantNumeric:'tabular-nums' }}>{d.avgScore}</span>
                </div>
              );
            })}
          </div>
          {sortedDesc.length > 12 && <div style={{ fontSize:10, color:sub, marginTop:8, textAlign:'center' }}>+ {sortedDesc.length-12}개 자치구</div>}
        </div>

        {/* 📈 12개월 시계열 애니메이션 */}
        <TimelineAnimation stats={stats} cardBg={cardBg} cardBg2={cardBg2} text={text} sub={sub} dark={dark} />

        {/* 🌱 ESG 자치구 랭킹 */}
        <div style={{ background:cardBg, borderRadius:16, padding:14, marginBottom:8, border:`1px solid ${dark?'rgba(255,255,255,0.04)':'var(--alpha-black-10)'}` }}>
          <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:4 }}>
            <div style={{ fontSize:12, fontWeight:800, color:text }}>🌱 ESG 자치구 랭킹</div>
            <span style={{ fontSize:9, fontWeight:800, color:sub, letterSpacing:'0.06em' }}>ENV·SOCIAL·GOV</span>
          </div>
          <div style={{ fontSize:10, color:sub, marginBottom:10, fontWeight:600 }}>환경(30%) + 사회(40%) + 거버넌스(30%) 종합</div>
          {(() => {
            const esgSorted = [...stats].sort((a,b) => b.avgESG - a.avgESG);
            const showTop = esgSorted.slice(0, 8);
            return (
              <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                {showTop.map((d, i) => (
                  <div key={d.district} onClick={() => { setFilter({ ...filter, district: d.district, kind:'전체' }); navigate('map'); }} style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 10px', borderRadius:9, background:cardBg2, cursor:'pointer' }}>
                    <span style={{ width:18, fontSize:11, fontWeight:800, color: i<3?text:sub, textAlign:'center' }}>{i<3?(['🥇','🥈','🥉'][i]):(i+1)}</span>
                    <span style={{ flex:1, fontSize:12, fontWeight:700, color:text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{d.district}</span>
                    <span style={{ fontSize:10, color:sub, fontWeight:700, fontVariantNumeric:'tabular-nums' }}>E{d.avgE}·S{d.avgS}·G{d.avgG}</span>
                    <span style={{ fontSize:11, fontWeight:800, padding:'3px 8px', borderRadius:5, background:`${d.esgGradeColor}25`, color:d.esgGradeColor, minWidth:34, textAlign:'center' }}>{d.esgGrade}</span>
                    <span style={{ fontSize:13, fontWeight:800, color:d.esgGradeColor, minWidth:30, textAlign:'right', fontVariantNumeric:'tabular-nums' }}>{d.avgESG}</span>
                  </div>
                ))}
              </div>
            );
          })()}
        </div>

        {/* 🌍 탄소 발자국 자치구 비교 */}
        <div style={{ background:cardBg, borderRadius:16, padding:14, marginBottom:8, border:`1px solid ${dark?'rgba(255,255,255,0.04)':'var(--alpha-black-10)'}` }}>
          <div style={{ fontSize:12, fontWeight:800, color:text, marginBottom:4 }}>🌍 자치구 평균 탄소 배출</div>
          <div style={{ fontSize:10, color:sub, marginBottom:12, fontWeight:600 }}>1인 1식 추정 g CO₂e — 낮을수록 친환경</div>
          {(() => {
            const co2Sorted = [...stats].sort((a,b) => a.avgCO2g - b.avgCO2g);
            const maxCO2 = Math.max(...co2Sorted.map(d=>d.avgCO2g));
            const showCO2 = co2Sorted.slice(0, 8);
            return (
              <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                {showCO2.map((d, i) => {
                  const co2Grade = window.gradeCO2(d.avgCO2g);
                  return (
                    <div key={d.district} style={{ display:'flex', alignItems:'center', gap:8 }}>
                      <span style={{ width:60, fontSize:10, fontWeight:700, color:text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{d.district}</span>
                      <div style={{ flex:1, height:14, background:cardBg2, borderRadius:4, overflow:'hidden', position:'relative' }}>
                        <div style={{ width:`${(d.avgCO2g/maxCO2)*100}%`, height:'100%', background:co2Grade.color, borderRadius:4, transition:'width 0.6s' }}/>
                      </div>
                      <span style={{ width:48, textAlign:'right', fontSize:10, fontWeight:800, color:co2Grade.color, fontVariantNumeric:'tabular-nums' }}>{d.avgCO2g}g</span>
                    </div>
                  );
                })}
              </div>
            );
          })()}
        </div>

        {/* TOP/BOTTOM 5 양면 카드 */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:8 }}>
          <div style={{ background:cardBg, borderRadius:14, padding:14, border:`1px solid ${dark?'rgba(255,255,255,0.04)':'var(--alpha-black-10)'}` }}>
            <div style={{ fontSize:11, fontWeight:800, color:'#00BF40', marginBottom:8 }}>🏆 TOP 5</div>
            {highScores.map((d, i) => (
              <div key={d.district} style={{ display:'flex', alignItems:'center', gap:6, padding:'5px 0', borderTop: i?`1px solid ${dark?'rgba(255,255,255,0.04)':'var(--alpha-black-10)'}`:'none' }}>
                <span style={{ fontSize:10, fontWeight:800, color:'#00BF40', width:14 }}>{i+1}</span>
                <span style={{ flex:1, fontSize:11, fontWeight:700, color:text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{d.district}</span>
                <span style={{ fontSize:11, fontWeight:800, color:'#00BF40', fontVariantNumeric:'tabular-nums' }}>{d.avgScore}</span>
              </div>
            ))}
          </div>
          <div style={{ background:cardBg, borderRadius:14, padding:14, border:`1px solid ${dark?'rgba(255,255,255,0.04)':'var(--alpha-black-10)'}` }}>
            <div style={{ fontSize:11, fontWeight:800, color:'#FF4242', marginBottom:8 }}>📉 BOTTOM 5</div>
            {lowScores.map((d, i) => (
              <div key={d.district} style={{ display:'flex', alignItems:'center', gap:6, padding:'5px 0', borderTop: i?`1px solid ${dark?'rgba(255,255,255,0.04)':'var(--alpha-black-10)'}`:'none' }}>
                <span style={{ fontSize:10, fontWeight:800, color:'#FF4242', width:14 }}>{i+1}</span>

          {(() => {
            const W = 320, H = 200;
            const minScore = Math.min(...stats.map(s=>s.avgScore));
            const maxScore = Math.max(...stats.map(s=>s.avgScore));
            const minMulti = 0;
            const maxMulti = Math.max(...stats.map(s=>s.multiPct), 16);
            const midX = W/2, midY = H/2;
            return (
              <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} style={{ display:'block' }}>

                <line x1={0} y1={midY} x2={W} y2={midY} stroke={dark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.08)'} strokeWidth="1" />
                {/* 분면 라벨 */}
                <text x={W-8} y={14} textAnchor="end" fill="#00BF40" style={{ fontSize:9, fontWeight:800 }}>우수+다문화↑</text>
                <text x={8} y={14} textAnchor="start" fill={sub} style={{ fontSize:9, fontWeight:700 }}>우수+다문화↓</text>
                <text x={W-8} y={H-6} textAnchor="end" fill="#FF4242" style={{ fontSize:9, fontWeight:800 }}>사각지대</text>
                <text x={8} y={H-6} textAnchor="start" fill={sub} style={{ fontSize:9, fontWeight:700 }}>저점·다문화↓</text>
                {/* 점들 */}
                {stats.map((d, i) => {
                  const x = ((d.multiPct - minMulti) / (maxMulti - minMulti || 1)) * (W-30) + 15;
                  const y = H - (((d.avgScore - minScore) / (maxScore - minScore || 1)) * (H-30) + 15);
                  const tone = d.avgScore>=85?'#00BF40':d.avgScore>=75?'#FFC700':d.avgScore>=65?'#FF7700':'#FF4242';
                  return (
                    <g key={d.district}>
                      <circle cx={x} cy={y} r={Math.sqrt(d.schoolCount)+2} fill={tone} fillOpacity="0.65" stroke={tone} strokeWidth="1.5"/>
                    </g>
                  );
                })}
              </svg>
            );
          })()}
          <div style={{ display:'flex', alignItems:'center', gap:10, marginTop:8, justifyContent:'center', flexWrap:'wrap' }}>
            <span style={{ display:'inline-flex', alignItems:'center', gap:3, fontSize:9, color:sub, fontWeight:700 }}>● 원 크기 = 학교 수</span>
            <span style={{ display:'inline-flex', alignItems:'center', gap:3, fontSize:9, color:sub, fontWeight:700 }}>색상 = 점수 대역</span>

        {/* CTA */}
        <button onClick={() => navigate('map')} style={{ width:'100%', height:46, borderRadius:12, background:'var(--color-violet-500)', color:'white', border:'none', fontSize:13, fontWeight:800, cursor:'pointer', marginTop:8 }}>
          🗺 지도에서 GIS 모드로 보기
        </button>

        <div style={{ height:120 }} />
      </div>
    </div>
  );
}

// 🌐 ChartCompareTab — 자치구 ↔ 자치구 멀티 비교
// ═══════════════════════════════════════════════════════════════
// ───────────────────────────────────────────────
// 공통 헬퍼 — 자치구 단가·점수 결정적 계산
// 예산 탭과 비교 탭에서 동일한 값 사용 보장
// ───────────────────────────────────────────────
function districtMetricHash(provCode, districtName) {
  const str = String(provCode || 'B10') + String(districtName || '');
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}
function districtBudget(provCode, districtName) {
  const h = districtMetricHash(provCode, districtName);
  return {
    cost:  2200 + (h % 1300),          // 1인 단가 2,200~3,500원
    score: 70 + ((h >> 8) % 25),       // 영양 점수 70~95점
    h,                                  // 다른 지표 파생용
  };
}

function ChartCompareTab({ cardBg, text, sub, dark, headerColor }) {
  const { schools, province } = useApp();
  // localStorage에 시도별 비교 자치구 저장 — 다른 메뉴 이동·새로고침 후에도 유지
  const storageKey = `gs:compare:${province?.code || 'B10'}`;
  const loadInitial = () => {
    try {
      const raw = localStorage.getItem(storageKey);
      if (raw) {
        const j = JSON.parse(raw);
        if (j && j.a && j.b) return j;
      }
    } catch {}
    return null;
  };
  const initial = loadInitial();
  const [a, setAState] = React.useState(initial?.a || '강남구');
  const [b, setBState] = React.useState(initial?.b || '노원구');
  const setA = React.useCallback((v) => {
    setAState(v);
    try { localStorage.setItem(storageKey, JSON.stringify({ a: v, b })); } catch {}
  }, [b, storageKey]);
  const setB = React.useCallback((v) => {
    setBState(v);
    try { localStorage.setItem(storageKey, JSON.stringify({ a, b: v })); } catch {}
  }, [a, storageKey]);

  const districts = React.useMemo(() => {
    if (!schools) return ['강남구','노원구'];
    const set = new Set(schools.map(s => s.district).filter(d => d && d !== '기타'));
    return [...set].sort();
  }, [schools]);

  // 시도가 변경되면 — 저장된 값이 있으면 복원, 없으면 가장 학교 많은 두 자치구로 기본값
  React.useEffect(() => {
    const saved = loadInitial();
    if (saved && districts.includes(saved.a) && districts.includes(saved.b)) {
      setAState(saved.a);
      setBState(saved.b);
      return;
    }
    if (districts.length >= 2) {
      // 저장값 없을 때: 학교 수 기준 상위 두 자치구
      const counts = {};
      schools?.forEach(s => { if (s.district) counts[s.district] = (counts[s.district]||0)+1; });
      const sorted = districts.slice().sort((x, y) => (counts[y]||0) - (counts[x]||0));
      setAState(sorted[0]);
      setBState(sorted[1]);
    }
  }, [province?.code, districts.length]);  // eslint-disable-line react-hooks/exhaustive-deps

  const stats = (name) => {
    const provCode = province?.code || 'B10';
    const { cost, h } = districtBudget(provCode, name); // 예산 탭과 동일한 단가
    const sch = schools?.filter(s => s.district === name) || [];
    const avg = sch.length ? sch.reduce((s,x)=>s+x.score,0)/sch.length : 75;
    return {
      district: name, count: sch.length,
      score: Math.round(avg*10)/10,
      multiPct: 3 + (h%12),
      i18nPct: (h%30),
      freeMealPct: 35 + (h%45),
      domestic: 70 + (h%25),
      diversity: 65 + (h%30),
      cost,                                  // ← 통일된 단가
      satisfaction: 75 + ((h*11)%20),
      esg: 65 + ((h*13)%30),
      co2: 800 + ((h*17)%1500),
    };
  };

  const A = stats(a);
  const B = stats(b);
  const metrics = [
    { k:'score',        l:'영양 점수',     unit:'점',  max:100,  e:'⭐' },
    { k:'count',        l:'학교 수',       unit:'개',  max:Math.max(A.count,B.count,30), e:'🏫' },
    { k:'domestic',     l:'국내산 비율',   unit:'%',   max:100,  e:'🌾' },
    { k:'diversity',    l:'메뉴 다양성',   unit:'점',  max:100,  e:'🌈' },
    { k:'multiPct',     l:'다문화 비율',   unit:'%',   max:20,   e:'🌍' },
    { k:'i18nPct',      l:'다국어 표시',   unit:'%',   max:50,   e:'🗣️' },
    { k:'freeMealPct',  l:'무상급식',      unit:'%',   max:100,  e:'💝' },
    { k:'satisfaction', l:'만족도',        unit:'점',  max:100,  e:'😊' },
    { k:'esg',          l:'ESG 점수',     unit:'점',  max:100,  e:'🌱' },
    { k:'cost',         l:'1인 단가',     unit:'원',  max:3500, e:'💰' },
  ];

  const Selector = ({ value, onChange, color }) => (
    <select value={value} onChange={e=>onChange(e.target.value)} style={{
      flex:1, height:38, padding:'0 12px', borderRadius:9,
      background: dark?'#2c2c2e':'var(--color-neutral-100)',
      border:`2px solid ${color}`, color:text, fontSize:13, fontWeight:800, outline:'none',
      appearance:'none', WebkitAppearance:'none',
      backgroundImage:`url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='${encodeURIComponent(color)}' d='M0 0h10L5 6z'/></svg>")`,
      backgroundRepeat:'no-repeat', backgroundPosition:'right 12px center',
      paddingRight:30,
    }}>
      {districts.map(d => <option key={d} value={d}>{d}</option>)}
    </select>
  );

  return (
    <>
      <div style={{ background:cardBg, borderRadius:16, padding:14, marginBottom:8 }}>
        <div style={{ fontSize:13, fontWeight:800, color:text, marginBottom:4 }}>🌐 자치구 비교</div>
        <div style={{ fontSize:10, color:sub, marginBottom:12, fontWeight:600 }}>두 자치구의 모든 지표를 직접 비교</div>
        <div style={{ display:'flex', gap:8, alignItems:'center', marginBottom:14 }}>
          <Selector value={a} onChange={setA} color="#0066FF"/>
          <span style={{ fontSize:11, color:sub, fontWeight:800 }}>vs</span>
          <Selector value={b} onChange={setB} color="#FF7700"/>
        </div>
        {metrics.map(m => {
          const va = A[m.k], vb = B[m.k];
          const isCostMetric = m.k === 'cost'; // 단가는 낮을수록 좋음
          const winnerA = isCostMetric ? va<vb : va>vb;
          const aPct = (va/m.max)*100, bPct = (vb/m.max)*100;
          return (
            <div key={m.k} style={{ marginBottom:14 }}>
              <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:5 }}>
                <span style={{ fontSize:11, fontWeight:700, color:text }}>{m.e} {m.l}</span>
                <span style={{ fontSize:9, color:sub, fontWeight:600 }}>최대 {m.max}{m.unit}</span>
              </div>
              {/* A bar */}
              <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:3 }}>
                <span style={{ width:14, fontSize:10, fontWeight:800, color:'#0066FF' }}>{winnerA?'🏆':''}</span>
                <div style={{ flex:1, height:14, background:dark?'#2c2c2e':'var(--color-neutral-100)', borderRadius:4, overflow:'hidden' }}>
                  <div style={{ width:`${aPct}%`, height:'100%', background:'#0066FF', borderRadius:4, transition:'width 0.6s' }}/>
                </div>
                <span style={{ width:60, textAlign:'right', fontSize:11, fontWeight:800, color:'#0066FF', fontVariantNumeric:'tabular-nums' }}>{typeof va==='number'?va.toLocaleString():va}{m.unit}</span>
              </div>
              {/* B bar */}
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <span style={{ width:14, fontSize:10, fontWeight:800, color:'#FF7700' }}>{!winnerA?'🏆':''}</span>
                <div style={{ flex:1, height:14, background:dark?'#2c2c2e':'var(--color-neutral-100)', borderRadius:4, overflow:'hidden' }}>
                  <div style={{ width:`${bPct}%`, height:'100%', background:'#FF7700', borderRadius:4, transition:'width 0.6s' }}/>
                </div>
                <span style={{ width:60, textAlign:'right', fontSize:11, fontWeight:800, color:'#FF7700', fontVariantNumeric:'tabular-nums' }}>{typeof vb==='number'?vb.toLocaleString():vb}{m.unit}</span>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ background:cardBg, borderRadius:14, padding:14 }}>
        <div style={{ fontSize:12, fontWeight:800, color:text, marginBottom:10 }}>🏆 종합 결과</div>
        {(() => {
          const aWins = metrics.filter(m => m.k==='cost' ? A[m.k]<B[m.k] : A[m.k]>B[m.k]).length;
          const bWins = metrics.length - aWins;
          return (
            <div style={{ display:'flex', gap:8 }}>
              <div style={{ flex:1, padding:'14px', borderRadius:12, background: aWins>=bWins?'rgba(0,102,255,0.12)':'rgba(0,102,255,0.05)', borderTop:'3px solid #0066FF', textAlign:'center' }}>
                <div style={{ fontSize:11, fontWeight:800, color:'#0066FF' }}>{a}</div>
                <div style={{ fontSize:24, fontWeight:800, color:'#0066FF', marginTop:4 }}>{aWins}<span style={{ fontSize:11, fontWeight:600 }}>/{metrics.length}</span></div>
                <div style={{ fontSize:9, color:sub, marginTop:2 }}>지표 우수</div>
              </div>
              <div style={{ flex:1, padding:'14px', borderRadius:12, background: bWins>aWins?'rgba(255,119,0,0.12)':'rgba(255,119,0,0.05)', borderTop:'3px solid #FF7700', textAlign:'center' }}>
                <div style={{ fontSize:11, fontWeight:800, color:'#FF7700' }}>{b}</div>
                <div style={{ fontSize:24, fontWeight:800, color:'#FF7700', marginTop:4 }}>{bWins}<span style={{ fontSize:11, fontWeight:600 }}>/{metrics.length}</span></div>
                <div style={{ fontSize:9, color:sub, marginTop:2 }}>지표 우수</div>
              </div>
            </div>
          );
        })()}
      </div>
    </>
  );
}

                  <div>
                    <div style={{ fontSize:9, opacity:0.85 }}>최저</div>
                    <div style={{ fontSize:14, fontWeight:800 }}>{minItem.cost.toLocaleString()}원</div>
                    <div style={{ fontSize:9, opacity:0.85 }}>{minItem.n}</div>
                  </div>
                  <div>
                    <div style={{ fontSize:9, opacity:0.85 }}>격차</div>
                    <div style={{ fontSize:14, fontWeight:800 }}>{gap.toLocaleString()}원</div>
                    <div style={{ fontSize:9, opacity:0.85 }}>{ratio}배</div>
                  </div>
                </div>
              </div>

              <div style={{ background:cardBg, borderRadius:14, padding:14, marginBottom:8 }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10 }}>
                  <div style={{ fontSize:12, fontWeight:800, color:text }}>📊 자치구별 단가 분포</div>
                  <div style={{ fontSize:10, color:sub, fontWeight:700 }}>{data.length}개 자치구 전체</div>
                </div>
                <div style={{ maxHeight:380, overflowY:'auto' }}>
                  {(() => {
                    const max = Math.max(...data.map(d=>d.cost));
                    return data.map(d => (
                      <div key={d.n} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6 }}>
                        <span style={{ width:62, fontSize:11, fontWeight:700, color:text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }} title={d.n + ' ('+d.count+'개교)'}>{d.n}</span>
                        <div style={{ flex:1, height:14, background:dark?'#2c2c2e':'var(--color-neutral-100)', borderRadius:4, overflow:'hidden' }}>
                          <div style={{ width:`${(d.cost/max)*100}%`, height:'100%', background:'#00BF40', borderRadius:4 }}/>
                        </div>
                        <span style={{ width:64, textAlign:'right', fontSize:11, fontWeight:800, color:text, fontVariantNumeric:'tabular-nums' }}>{d.cost.toLocaleString()}원</span>
                      </div>
                    ));
                  })()}
                </div>
              </div>

              <div style={{ background:cardBg, borderRadius:14, padding:14, marginBottom:8 }}>
                <div style={{ fontSize:12, fontWeight:800, color:text, marginBottom:6 }}>🎯 가성비 4분면 (단가 vs 점수)</div>
                <div style={{ fontSize:10, color:sub, marginBottom:12 }}>X축: 단가 · Y축: 영양 점수 · 전체 {data.length}개 자치구</div>
                {(() => {
                  const W=320, H=240;
                  const minC = Math.min(...data.map(d=>d.cost)) - 100;
                  const maxC = Math.max(...data.map(d=>d.cost)) + 100;
                  const minS = Math.min(...data.map(d=>d.score)) - 2;
                  const maxS = Math.max(...data.map(d=>d.score)) + 2;
                  // 라벨 충돌 방지 — 16개 이상이면 인접한 점만 라벨 표시
                  const showAllLabels = data.length <= 16;
                  return (
                    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`}>
                      <line x1={W/2} y1="0" x2={W/2} y2={H} stroke={dark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.08)'}/>
                      <line x1="0" y1={H/2} x2={W} y2={H/2} stroke={dark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.08)'}/>
                      <text x={W-5} y={14} textAnchor="end" fill="#00BF40" style={{ fontSize:9, fontWeight:800 }}>고가·고점</text>
                      <text x={5} y={14} fill="#0066FF" style={{ fontSize:9, fontWeight:800 }}>가성비 우수</text>
                      <text x={W-5} y={H-3} textAnchor="end" fill="#FF7700" style={{ fontSize:9, fontWeight:800 }}>고가·저점</text>
                      <text x={5} y={H-3} fill="#FF4242" style={{ fontSize:9, fontWeight:800 }}>저가·저점</text>
                      {data.map(d => {
                        const x = ((d.cost-minC)/(maxC-minC))*(W-30)+15;
                        const y = H-(((d.score-minS)/(maxS-minS))*(H-30)+15);
                        const isBest = d.n === bestVfm.n;
                        return (
                          <g key={d.n}>
                            <circle cx={x} cy={y} r={isBest ? 7 : 5}
                              fill={isBest ? '#0066FF' : headerColor}
                              fillOpacity={isBest ? 0.9 : 0.7}
                              stroke={isBest ? '#0066FF' : headerColor}
                              strokeWidth={isBest ? 2 : 1}>
                              <title>{d.n}: {d.cost.toLocaleString()}원 · {d.score}점 · {d.count}개교</title>
                            </circle>
                            {(showAllLabels || isBest) && (
                              <text x={x} y={y-10} textAnchor="middle" fill={isBest ? '#0066FF' : text} style={{ fontSize:9, fontWeight:isBest?800:700 }}>{d.n}</text>
                            )}
                          </g>
                        );
                      })}
                    </svg>
                  );
                })()}
                <div style={{ marginTop:8, padding:'10px 12px', borderRadius:8, background:dark?'#2c2c2e':'var(--color-neutral-100)', fontSize:11, color:sub, lineHeight:1.5 }}>
                  💡 <strong style={{ color:'#0066FF' }}>{bestVfm.n}</strong>이(가) 단가 {bestVfm.cost.toLocaleString()}원 · 점수 {bestVfm.score}점 — 가성비 모범 사례
                </div>
              </div>
            </>
            );
          })()}
        </div>
        <div style={{ height:100 }} />
      </div>
    </ScreenShell>
  );
}

    setPhotoResult(null); setPhotoError(null); setPhotoLoading(true);

    // 파일 크기 검증 (10MB 제한)
    const MAX_SIZE = 10 * 1024 * 1024;
    if (file.size > MAX_SIZE) {
      setPhotoError(`파일 크기가 너무 큽니다 (${(file.size/1024/1024).toFixed(1)}MB) — 10MB 이하로 줄여주세요`);
      setPhotoLoading(false);
      e.target.value = '';
      return;
    }

    // 이미지 타입 확인 (HEIC도 일부 브라우저에서 image/heic으로 인식되므로 통과시킴)
    const fname = (file.name || '').toLowerCase();
    const isHeic = fname.endsWith('.heic') || fname.endsWith('.heif') || file.type === 'image/heic' || file.type === 'image/heif';
    if (file.type && !file.type.startsWith('image/') && !isHeic) {
      setPhotoError('이미지 파일만 선택할 수 있습니다');
      setPhotoLoading(false);
      e.target.value = '';
      return;
    }

    try {
      const compressed = await window.compressImage(file, 1024);
      if (!compressed || !compressed.base64) throw new Error('압축 결과가 비어있음');
      setPhotoData(compressed);
    } catch (err) {
      console.error('Photo compress failed:', err);
      const msg = err?.message || '알 수 없는 오류';

    '피자':['밀','우유'], '치즈':['우유'], '치즈볶음밥':['우유'], '크림스프':['우유'],
    '크림리조또':['우유'], '요거트':['우유'], '우유':['우유'],
    '새우볶음밥':['새우','난류'], '새우필라프':['새우'], '튀김':['밀','난류'],
    '연어구이':[], '연어덮밥':[], '고등어구이':['고등어'], '삼치구이':[],
    '오징어볶음':['오징어'], '짬뽕':['새우','오징어','조개','밀'], '짬뽕국':['새우','오징어','조개'],
    '짜장면':['밀','대두'], '짜장밥':['대두'], '탕수육':['돼지','밀','난류'],
    '만두':['밀','돼지'], '라면':['밀'], '우동':['밀'], '라멘':['밀','난류'],
    '김밥':['난류','밀'], '잔치국수':['밀','난류'], '쫄면':['밀'],
  };

  // 결정적 의사 랜덤 (학년/스타일/목표/알레르기 조합 → 같은 결과)
  const seedFromInputs = () => {
    const s = `${grade}|${style}|${goal}|${[...allergies].sort().join(',')}|${domesticFirst}`;
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  };

  const generate = async () => {
    setGenerating(true);
    setResult(null);

    // 활성 AI provider 키 있으면 실제 호출
    if (aiActive) {
      try {
        const prompt = `당신은 학교 영양사입니다. 아래 조건에 맞는 일주일(월~금) 급식 메뉴를 한국어로 제안해주세요.

학년: ${grade}
선호 스타일: ${style}
영양 목표: ${goal}
알레르기 제외: ${allergies.join(', ') || '없음'}
국내산 우선: ${domesticFirst ? '예' : '아니오'}

다음 JSON 형식으로만 답변해주세요(앞뒤 설명 없이):
{
  "days": [
    { "day": "월", "menus": ["밥","국","메인","반찬","김치","디저트"], "kcal": 650, "highlight": "한 줄 강조 메시지" }
  ],
  "summary": { "avgKcal": 650, "note": "전체 식단 특징 1-2문장" }
}
5일치(월~화수목금), 메뉴 6개씩, 알레르기 식품 절대 포함 금지.`;

        const text = await window.callAI(aiProvider, aiKeys, prompt, { maxTokens: 2048 });
        const m = text.match(/\{[\s\S]*\}/);
        if (!m) throw new Error('응답 파싱 실패');
        const json = JSON.parse(m[0]);
        setResult({
          days: json.days || [],
          summary: {
            grade, style, goal,
            avgKcal: json.summary?.avgKcal || Math.round((json.days || []).reduce((s,d)=>s+(d.kcal||0),0)/(json.days?.length||1)),
            excludedAllergies: allergies.length,
            domesticFirst,
            note: json.summary?.note,
            source: aiProvider,
            sourceLabel: PROVIDER_LABELS[aiProvider] || 'AI',
          },
        });
        setGenerating(false);
        return;
      } catch (e) {
        console.warn(`${aiProvider} failed, falling back to local:`, e.message);
      }
    }

    setTimeout(() => {
      const seed = seedFromInputs();
      const pool = MENU_POOLS[style] || MENU_POOLS['한식'];
      const days = ['월','화','수','목','금'];
      // 알레르기 필터
      const isAllergyFree = (menu) => {
        const triggers = MENU_ALLERGY_MAP[menu] || [];
        return !triggers.some(t => allergies.includes(t));
      };
      const pickFromPool = (arr, dayIdx, slotSeed) => {
        const filtered = arr.filter(isAllergyFree);
        const final = filtered.length ? filtered : arr;
        return final[(seed + dayIdx*7 + slotSeed*13) % final.length];
      };
      // 영양 목표별 주안점
      const goalHint = {
        '균형':       '5대 영양소 골고루 배합',
        '고단백':     '단백질 함량 +20% 강화',
        '저나트륨':   '나트륨 1,200mg 이하',
        '고섬유':     '식이섬유 풍부한 메뉴 우선',
        '면역강화':   '비타민C·D 풍부 식재료',
        '체중관리':   '칼로리 600-650kcal 조절',
      };
      // 학년별 칼로리
      const baseKcal = grade==='유치원'?500 : grade==='초등'?620 : grade==='중학교'?720 : 820;
      // 5일 생성
      const generatedDays = days.map((d, i) => {
        const menus = [
          pickFromPool(pool.rice, i, 1),
          pickFromPool(pool.soup, i, 2),
          pickFromPool(pool.main, i, 3),
          pickFromPool(pool.side, i, 4),
          pickFromPool(pool.kim, i, 5),
          pickFromPool(pool.dessert, i, 6),
        ];
        const variance = ((seed + i*47) % 80) - 40;
        const kcal = baseKcal + variance;
        const highlights = [
          `${goalHint[goal]} 적용`,
          domesticFirst ? '국내산 식재료 우선 편성' : '신선 식재료 중심',
          allergies.length>0 ? `${allergies.join('·')} 제외` : '알레르기 제한 없음',
        ];
        const highlight = highlights[i % highlights.length];
        return { day: d, menus, kcal, highlight };
      });
      const summary = {
        grade, style, goal,
        avgKcal: Math.round(generatedDays.reduce((s,d)=>s+d.kcal,0)/5),
        excludedAllergies: allergies.length,
        domesticFirst,
      };
      setResult({ days: generatedDays, summary });
      setGenerating(false);
    }, 900);
  };
  return (

            {[

              return (
                <div key={m.id} onClick={() => setAiMode(m.id)} style={{

              <div style={{ position:'relative' }}>
                <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:10, fontWeight:800, opacity:0.92, letterSpacing:'0.1em', marginBottom:8 }}>

function ScreenAlerts() {
  const { tweaks, navigate, mySchool, setMySchool, schools, email, emailEnabled, myAllergies, dietaryPrefs, a11y, setVoiceOpen } = useApp();
  const dark = tweaks.dark;
  const headerColor = tweaks.headerColor || '#0066FF';
  const cardBg = dark?'#1c1c1e':'white';
  const text = dark?'#fff':'var(--color-neutral-1000)';
  const sub = dark?'rgba(255,255,255,0.6)':'var(--color-neutral-700)';
  const today = new Date();
  const dateStr = `${today.getMonth()+1}월 ${today.getDate()}일`;

  // 내 학교 정보
  const my = mySchool && schools ? schools.find(s => s.code === mySchool) : null;
  const [myMeal, setMyMeal] = React.useState(null);
  const [mealLoading, setMealLoading] = React.useState(false);
  const [myExtra, setMyExtra] = React.useState(null);  // 전화번호·홈페이지
  React.useEffect(() => {
    if (!my) { setMyMeal(null); setMyExtra(null); return; }
    let mounted = true;
    setMealLoading(true);
    // 학교 상세 정보 (전화·홈페이지) 비동기 로드
    fetchSchoolExtra({ schoolCode: my.code, office: my.office }).then(x => mounted && setMyExtra(x));
    (async () => {
      // 오늘부터 -7일까지 최근 식단 시도
      for (let i = 0; i <= 7; i++) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const m = await fetchTodayMeal({ officeCode: my.office||'B10', schoolCode: my.code, date: formatYmd(d) });
        if (m && mounted) { setMyMeal(m); setMealLoading(false); return; }
      }
      // NEIS 응답 없으면 결정적 폴백
      if (mounted) {
        const gen = window.generateDailyMeal(my.code, new Date());
        setMyMeal(gen.isWeekend ? null : gen);
        setMealLoading(false);
      }
    })();
    return () => { mounted = false; };
  }, [my?.code]);

  // 다가오는 5일 알레르기 위험 스캔
  const [upcomingRisks, setUpcomingRisks] = React.useState([]);
  React.useEffect(() => {
    if (!my || (myAllergies.length === 0 && !Object.values(dietaryPrefs||{}).some(Boolean))) {
      setUpcomingRisks([]);
      return;
    }
    let mounted = true;
    (async () => {
      const dows = ['일','월','화','수','목','금','토'];
      const scans = [];
      const today = new Date();
      for (let i = 0; i <= 5; i++) {
        const d = new Date(); d.setDate(today.getDate() + i);
        if (d.getDay() === 0 || d.getDay() === 6) continue;
        let m = await fetchTodayMeal({ officeCode: my.office||'B10', schoolCode: my.code, date: formatYmd(d) });
        if (!m) m = window.generateDailyMeal(my.code, d);
        if (!m || m.isWeekend) continue;
        const r = window.checkMealRisk(m, myAllergies, dietaryPrefs);
        if (r.allergies.length > 0 || r.dietary.length > 0) {
          const dDay = i === 0 ? '오늘' : i === 1 ? '내일' : `D-${i}`;
          scans.push({
            date: d, dDay, dayName: dows[d.getDay()],
            meal: m, risks: r,
          });
        }
      }
      if (mounted) setUpcomingRisks(scans);
    })();
    return () => { mounted = false; };
  }, [my?.code, JSON.stringify(myAllergies), JSON.stringify(dietaryPrefs)]);

  // 오늘 메뉴 음성 출력
  const speakTodayMeal = () => {
    if (!myMeal || !myMeal.menus) return;
    const txt = `${my.name} 오늘 점심 메뉴는 ${myMeal.menus.join(', ')} 입니다. 칼로리는 ${myMeal.kcal || '미상'} 입니다.`;
    window.speakKorean(txt);
  };

  // 학교 코드 기반 결정적 하이라이트
  const highlights = React.useMemo(() => {
    if (!my) return [
      { tone:'#00BF40', label:'긍정', text:'이번 주 전국 급식 영양 점수 평균 상승' },
      { tone:'#FF7700', label:'주의', text:'알레르기 식품이 포함된 메뉴가 운영됩니다' },
      { tone:'#0066FF', label:'소식', text:'NEIS 공공데이터 1,300+개교 실시간 연동' },
    ];

      { tone:'#FF7700', label:'주의',     text:`내일 메뉴 — 알레르기 ${(h%2)+1}종 포함 가능` },
      { tone:'#0066FF', label:'소식',     text:`${my.district} 평균 대비 국내산 비율 +${(h%15)+5}%p 높음` },
    ];

          <div style={{ padding:'0 20px', display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:12 }}>
            <div>
              <div style={{ fontSize:11, fontWeight:700, color:sub }}>{dateStr}</div>
              <div style={{ fontSize:24, fontWeight:800, color:text, marginTop:2 }}>분석센터</div>
            </div>
            <div style={{ display:'flex', gap:6 }}>
              <button onClick={() => navigate('chatbot')} title="AI 챗봇" style={{
                width:42, height:42, borderRadius:12, cursor:'pointer',
                background: dark?'rgba(40,40,46,0.95)':'#fff',
                border:'1px solid ' + (dark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)'),
                color: dark?'#fff':'#1a1a1a', fontSize:18, fontWeight:700,
                boxShadow: dark?'0 4px 12px rgba(0,0,0,0.4)':'0 4px 12px rgba(0,0,0,0.08)',
                display:'flex', alignItems:'center', justifyContent:'center',
              }}>🤖</button>
              <button onClick={() => navigate('voice')} title="음성 명령" style={{
                width:42, height:42, borderRadius:12, cursor:'pointer',

// ═══════════════════════════════════════════════════════════════
// 🎙 VoiceModal — 핸즈프리 음성 인터페이스
// ═══════════════════════════════════════════════════════════════
// ─────────────────────────────────────────────
// AI 음성 코치 — 풀스크린 화면 (ScreenChatbot과 동일 패턴)
// ─────────────────────────────────────────────
function ScreenVoice() {
  const { mySchool, schools, navigate, back, lang, aiProvider, aiKeys, aiActive, myAllergies, tweaks } = useApp();
  const dark = tweaks.dark;
  const [listening, setListening] = React.useState(false);
  const [transcript, setTranscript] = React.useState('');
  const [answer, setAnswer] = React.useState('');
  const [processing, setProcessing] = React.useState(false);
  const [error, setError] = React.useState(null);
  const recognitionRef = React.useRef(null);
  const my = mySchool && schools ? schools.find(s => s.code === mySchool) : null;

  // 화면 진입 시 자동 시작 + 떠날 때 정리
  React.useEffect(() => {
    setTranscript(''); setAnswer(''); setError(null);
    setTimeout(() => startListening(), 300);
    return () => {
      try { recognitionRef.current?.stop(); } catch {}
      window.stopSpeaking?.();
    };
  }, []);

  const startListening = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setError('이 브라우저는 음성 인식을 지원하지 않습니다 (Chrome·Edge 권장)'); return; }
    try {
      const r = new SR();
      r.lang = window.I18N?.[lang||'ko']?.speechLang || 'ko-KR';
      r.continuous = false;
      r.interimResults = true;
      r.maxAlternatives = 1;
      r.onresult = (e) => {
        const txt = Array.from(e.results).map(r => r[0].transcript).join('');
        setTranscript(txt);
        if (e.results[e.results.length-1].isFinal) processQuery(txt);
      };
      r.onerror = (e) => {
        setError(e.error === 'not-allowed' ? '마이크 권한이 필요해요' : `오류: ${e.error}`);
        setListening(false);
      };
      r.onend = () => setListening(false);
      r.start();
      recognitionRef.current = r;
      setListening(true);
    } catch (e) { setError('음성 인식 시작 실패'); }
  };

  const detectIntent = (text) => {
    if (/내일/.test(text) && /(점심|급식|메뉴)/.test(text)) return 'tomorrow';
    if (/(오늘|지금)/.test(text) && /(점심|급식|메뉴|밥)/.test(text)) return 'today';
    if (/(이번\s*주|주간)/.test(text)) return 'week';
    if (/(영양|점수|등급|얼마)/.test(text)) return 'score';
    if (/(알레르기|allergy)/.test(text)) return 'allergy';
    if (/(칼로리|kcal)/.test(text)) return 'kcal';
    if (/(국내산|원산지)/.test(text)) return 'origin';
    if (/(분석|리포트|상세)/.test(text)) return 'report';
    if (/(지도|map|위치)/.test(text)) return 'map';
    if (/(검색|찾아|찾아줘)/.test(text)) return 'search';
    return 'unknown';
  };

  const processQuery = async (text) => {
    setProcessing(true);
    let response = '';
    let action = null;
    const intent = detectIntent(text);
    if (!my && (intent === 'today' || intent === 'tomorrow' || intent === 'score' || intent === 'allergy' || intent === 'kcal' || intent === 'origin')) {
      response = '먼저 내 학교를 등록해주세요. 검색 화면으로 이동할게요.';
      action = () => navigate('search');
    } else if (intent === 'today' || intent === 'tomorrow') {
      const isToday = intent === 'today';
      let m = null;
      if (isToday) {
        for (let i = 0; i <= 7; i++) {
          const d = new Date(); d.setDate(d.getDate() - i);
          m = await fetchTodayMeal({ officeCode: my.office||'B10', schoolCode: my.code, date: formatYmd(d) });
          if (m) break;
        }
        if (!m) m = window.generateDailyMeal(my.code, new Date());
      } else {
        const t = new Date(); t.setDate(t.getDate() + 1);
        m = await fetchTodayMeal({ officeCode: my.office||'B10', schoolCode: my.code, date: formatYmd(t) });
        if (!m) m = window.generateDailyMeal(my.code, t);
      }
      if (m && m.menus) {
        response = `${my.name} ${isToday?'오늘':'내일'} 점심은 ${m.menus.slice(0, 6).join(', ')} 입니다. 칼로리는 ${m.kcal || '미상'} 입니다.`;
        if (!isToday && myAllergies && myAllergies.length > 0) {
          const risk = window.checkMealRisk(m, myAllergies, {});
          if (risk.allergies.length > 0) response += ` 주의: ${risk.allergies.join(', ')} 알레르기 식품 포함.`;
        }
      } else { response = `${isToday?'오늘':'내일'} 점심 정보를 찾을 수 없어요.`; }
    } else if (intent === 'score') {
      response = `${my.name} 종합 영양 점수는 ${my.score}점입니다.`;
    } else if (intent === 'report') {
      response = `${my.name} 심층 분석으로 이동할게요.`;
      action = () => navigate('report', { code: my.code });
    } else if (intent === 'map') {
      response = '지도 화면으로 이동할게요.'; action = () => navigate('map');
    } else if (intent === 'search') {
      response = '학교 검색 화면으로 이동할게요.'; action = () => navigate('search');
    } else if (aiActive) {
      try {
        const ctx = my ? `참고 — 등록 학교: ${my.name} (${my.kind}, ${my.district}), 영양 점수 ${my.score}점.` : '';
        const prompt = `학교 급식 앱 음성 질의에 50자 이내 한국어로 답하세요.\n${ctx}\n질문: ${text}`;
        response = await window.callAI(aiProvider, aiKeys, prompt, { maxTokens: 200 });
        response = response.trim().replace(/^["']|["']$/g, '');
      } catch { response = '죄송해요, "오늘 점심 뭐야?"처럼 물어보세요.'; }
    } else { response = '"오늘 점심 뭐야?", "영양 점수 알려줘"처럼 물어보세요.'; }
    setAnswer(response);
    setProcessing(false);
    window.speakKorean?.(response);
    if (action) setTimeout(action, 2200);
  };

  const exampleQueries = ['오늘 점심 뭐야?','영양 점수 알려줘','알레르기 있어?','내일 메뉴 뭐야?','심층 분석 보여줘','학교 검색해줘'];
  const text = '#fff';
  const sub = 'rgba(255,255,255,0.65)';

  return (
    <div style={{ position:'absolute', inset:0, background:'linear-gradient(180deg, #0a0e1a 0%, #1a1f33 100%)', overflowY:'auto', color:text }}>
      <CompactNavLive title="AI 음성 코치" onBack={back} dark sticky />

      {/* 본문 — 마이크 + 답변 */}
      <div style={{ padding:'24px 24px 40px', display:'flex', flexDirection:'column', alignItems:'center', minHeight:'calc(100% - 80px)' }}>
        {/* 마이크 시각화 */}
        <div style={{ marginTop:16, marginBottom:24, position:'relative' }}>
          <div style={{
            width:140, height:140, borderRadius:9999,
            background: listening
              ? 'linear-gradient(135deg, #FF4242, #9747FF)'
              : processing ? 'linear-gradient(135deg, #0066FF, #9747FF)'
              : 'rgba(255,255,255,0.1)',
            display:'flex', alignItems:'center', justifyContent:'center',
            color:'#fff', boxShadow: listening?'0 0 80px rgba(255,66,66,0.5)':'none',
            animation: listening ? 'kmealVoicePulse 1.4s ease-in-out infinite' : 'none',
          }}>
            {/* SVG 마이크 (대형) */}
            {processing ? (
              <span style={{ fontSize:48 }}>🤔</span>
            ) : answer && !listening ? (
              <span style={{ fontSize:48 }}>💬</span>
            ) : (
              <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3" fill="#fff" stroke="none"/>
                <path d="M5 11v1a7 7 0 0 0 14 0v-1"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
                <line x1="8" y1="22" x2="16" y2="22"/>
              </svg>
            )}
          </div>
          {listening && (
            <>
              <style>{`@keyframes kmealVoicePulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }`}</style>
              <div style={{ position:'absolute', inset:-22, borderRadius:9999, border:'2px solid rgba(255,66,66,0.3)', animation:'kmealVoicePulse 1.6s ease-in-out infinite' }}/>
            </>
          )}
        </div>

        {/* 상태 라벨 */}
        <div style={{ color:'rgba(255,255,255,0.85)', fontSize:14, fontWeight:700, marginBottom:14 }}>
          {error ? '⚠ ' + error : listening ? '듣고 있어요…' : processing ? '답변 생성 중…' : answer ? '답변 완료' : '준비 중…'}
        </div>

        {/* 질문 */}
        {transcript && (
          <div style={{ background:'rgba(255,255,255,0.08)', borderRadius:14, padding:'14px 18px', marginBottom:10, maxWidth:360, color:'#fff', fontSize:13, fontWeight:600, lineHeight:1.55, textAlign:'center', border:'1px solid rgba(255,255,255,0.12)' }}>
            <div style={{ fontSize:9, fontWeight:800, opacity:0.7, marginBottom:5, letterSpacing:'0.06em' }}>나의 질문</div>
            {transcript}
          </div>
        )}

        {/* 답변 */}
        {answer && (
          <div style={{
            background:'linear-gradient(135deg, rgba(0,102,255,0.28), rgba(151,71,255,0.28))',
            borderRadius:14, padding:'16px 20px', marginBottom:14, maxWidth:360,
            color:'#fff', fontSize:14.5, fontWeight:600, lineHeight:1.6, textAlign:'center',
            border:'1px solid rgba(255,255,255,0.2)',
          }}>
            <div style={{ fontSize:9, fontWeight:800, opacity:0.85, marginBottom:6, letterSpacing:'0.06em' }}>💬 답변</div>
            {answer}
          </div>
        )}

        {/* 예시 질문 */}
        {!listening && !transcript && !answer && (
          <div style={{ marginTop:12, maxWidth:360, textAlign:'center' }}>
            <div style={{ color:'rgba(255,255,255,0.55)', fontSize:11, fontWeight:700, marginBottom:12, letterSpacing:'0.06em' }}>이렇게 물어보세요</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:6, justifyContent:'center' }}>
              {exampleQueries.map(q => (
                <span key={q} style={{ fontSize:11, fontWeight:700, color:'#fff', background:'rgba(255,255,255,0.1)', padding:'7px 13px', borderRadius:9999, border:'1px solid rgba(255,255,255,0.15)' }}>"{q}"</span>
              ))}
            </div>
          </div>
        )}

        {/* 다시 듣기 */}
        {!listening && !processing && (transcript || error) && (
          <button onClick={startListening} style={{
            marginTop:18, padding:'12px 26px', borderRadius:9999,
            background:'#fff', color:'#0a0e1a', border:'none',
            fontSize:13, fontWeight:800, cursor:'pointer',
            display:'inline-flex', alignItems:'center', gap:6,
          }}>🎙 다시 말하기</button>
        )}
        {answer && !processing && (
          <button onClick={() => window.speakKorean?.(answer)} style={{
            marginTop:8, padding:'8px 18px', borderRadius:9999,
            background:'transparent', color:'rgba(255,255,255,0.7)',
            border:'1px solid rgba(255,255,255,0.25)',
            fontSize:11, fontWeight:700, cursor:'pointer',
          }}>🔊 다시 듣기</button>
        )}
      </div>
    </div>
  );
}

function VoiceModal() {
  const { voiceOpen, setVoiceOpen, mySchool, schools, navigate, lang, aiProvider, aiKeys, aiActive, myAllergies } = useApp();
  const [listening, setListening] = React.useState(false);
  const [transcript, setTranscript] = React.useState('');
  const [answer, setAnswer] = React.useState('');
  const [processing, setProcessing] = React.useState(false);
  const [error, setError] = React.useState(null);
  const recognitionRef = React.useRef(null);
  const my = mySchool && schools ? schools.find(s => s.code === mySchool) : null;

  // 모달 열릴 때 자동 시작
  React.useEffect(() => {
    if (voiceOpen) {
      setTranscript(''); setAnswer(''); setError(null);
      setTimeout(() => startListening(), 200);
    } else {
      stopListening();
      window.stopSpeaking?.();
    }
  }, [voiceOpen]);

  const startListening = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setError('이 브라우저는 음성 인식을 지원하지 않습니다 (Chrome·Edge 권장)');
      return;
    }
    try {
      const r = new SR();
      r.lang = window.I18N?.[lang||'ko']?.speechLang || 'ko-KR';
      r.continuous = false;
      r.interimResults = true;
      r.maxAlternatives = 1;
      r.onresult = (e) => {
        const txt = Array.from(e.results).map(r => r[0].transcript).join('');
        setTranscript(txt);
        if (e.results[e.results.length-1].isFinal) {
          processQuery(txt);
        }
      };
      r.onerror = (e) => {
        setError(e.error === 'not-allowed' ? '마이크 권한이 필요해요' : `오류: ${e.error}`);
        setListening(false);
      };
      r.onend = () => setListening(false);
      r.start();
      recognitionRef.current = r;
      setListening(true);
    } catch (e) { setError('음성 인식 시작 실패'); }
  };

  const stopListening = () => {
    try { recognitionRef.current?.stop(); } catch {}
    setListening(false);
  };

  // 의도 인식 (규칙 기반)
  const detectIntent = (text) => {
    if (/내일/.test(text) && /(점심|급식|메뉴)/.test(text)) return 'tomorrow';
    if (/(오늘|지금)/.test(text) && /(점심|급식|메뉴|밥)/.test(text)) return 'today';
    if (/(이번\s*주|주간)/.test(text)) return 'week';
    if (/(영양|점수|등급|얼마)/.test(text)) return 'score';
    if (/(알레르기|allergy)/.test(text)) return 'allergy';
    if (/(칼로리|kcal)/.test(text)) return 'kcal';
    if (/(국내산|원산지)/.test(text)) return 'origin';
    if (/(분석|리포트|상세)/.test(text)) return 'report';
    if (/(지도|map|위치)/.test(text)) return 'map';
    if (/(검색|찾아|찾아줘)/.test(text)) return 'search';
    return 'unknown';
  };

  const processQuery = async (text) => {
    setProcessing(true);
    let response = '';
    let action = null;
    const intent = detectIntent(text);

    if (!my && (intent === 'today' || intent === 'tomorrow' || intent === 'score' || intent === 'allergy' || intent === 'kcal' || intent === 'origin')) {
      response = '먼저 내 학교를 등록해주세요. 검색 화면으로 이동할게요.';
      action = () => navigate('search');
    } else {
      switch (intent) {
        case 'today': {
          let m = null;
          for (let i = 0; i <= 7; i++) {
            const d = new Date(); d.setDate(d.getDate() - i);
            m = await fetchTodayMeal({ officeCode: my.office||'B10', schoolCode: my.code, date: formatYmd(d) });
            if (m) break;
          }
          if (!m) m = window.generateDailyMeal(my.code, new Date());
          if (m && m.menus) {
            response = `${my.name} 오늘 점심은 ${m.menus.slice(0, 6).join(', ')} 입니다. 칼로리는 ${m.kcal || '미상'} 입니다.`;
          } else {
            response = '오늘 점심 정보를 찾을 수 없어요.';
          }
          break;
        }
        case 'tomorrow': {
          const t = new Date(); t.setDate(t.getDate() + 1);
          let m = await fetchTodayMeal({ officeCode: my.office||'B10', schoolCode: my.code, date: formatYmd(t) });
          if (!m) m = window.generateDailyMeal(my.code, t);
          if (m && m.menus) {
            response = `내일 점심은 ${m.menus.slice(0, 6).join(', ')} 입니다.`;
            // 알레르기 체크
            if (myAllergies && myAllergies.length > 0) {
              const risk = window.checkMealRisk(m, myAllergies, {});
              if (risk.allergies.length > 0) {
                response += ` 주의: ${risk.allergies.join(', ')} 알레르기 식품이 포함되어 있어요.`;
              }
            }
          } else {
            response = '내일 점심 정보가 없어요.';
          }
          break;
        }
        case 'score': {
          const idx = indicesOf(my.code);
          const overall = Math.round(['kcal','diversity','freshness','balance','origin','seasonal'].reduce((s,k)=>s+idx[k],0)/6);
          response = `${my.name} 종합 영양 점수는 ${overall}점입니다. ${overall>=85?'우수한 편이에요':overall>=75?'평균 이상이에요':'개선 여지가 있어요'}.`;
          break;
        }
        case 'allergy': {
          let m = null;
          for (let i = 0; i <= 7; i++) {
            const d = new Date(); d.setDate(d.getDate() - i);
            m = await fetchTodayMeal({ officeCode: my.office||'B10', schoolCode: my.code, date: formatYmd(d) });
            if (m) break;
          }
          if (!m) m = window.generateDailyMeal(my.code, new Date());
          if (m && myAllergies && myAllergies.length > 0) {
            const risk = window.checkMealRisk(m, myAllergies, {});
            response = risk.allergies.length > 0
              ? `오늘 메뉴에 ${risk.allergies.join(', ')} 알레르기 식품이 포함되어 있어요. 주의하세요.`
              : '오늘 메뉴에 등록된 알레르기 식품은 없어요. 안전합니다.';
          } else if (!myAllergies || myAllergies.length === 0) {
            response = '먼저 설정에서 알레르기를 등록해주세요.';
          }
          break;
        }
        case 'kcal': {
          let m = null;
          for (let i = 0; i <= 7; i++) {
            const d = new Date(); d.setDate(d.getDate() - i);
            m = await fetchTodayMeal({ officeCode: my.office||'B10', schoolCode: my.code, date: formatYmd(d) });
            if (m) break;
          }
          if (!m) m = window.generateDailyMeal(my.code, new Date());
          response = `오늘 점심 칼로리는 ${m?.kcal || '미상'} 입니다.`;
          break;
        }
        case 'origin': {
          response = `${my.name}의 국내산 식재료 비율은 평균 약 ${80 + (my.code.charCodeAt(0)%20)}% 입니다.`;
          break;
        }
        case 'report': {
          response = `${my.name} 심층 분석 리포트로 이동할게요.`;
          action = () => navigate('report', { code: my.code });
          break;
        }
        case 'map': {
          response = '지도 화면으로 이동할게요.';
          action = () => navigate('map');
          break;
        }
        case 'search': {
          response = '학교 검색 화면으로 이동할게요.';
          action = () => navigate('search');
          break;
        }
        default: {
          // AI 폴백
          if (aiActive) {
            try {
              const ctx = my ? `참고 — 사용자 등록 학교: ${my.name} (${my.kind}, ${my.district}), 영양 점수 ${my.score}점.` : '';
              const prompt = `학교 급식 앱에서 사용자가 음성으로 질문했어요. 50자 이내 한국어로 짧게 답하세요.\n${ctx}\n질문: ${text}`;
              response = await window.callAI(aiProvider, aiKeys, prompt, { maxTokens: 200 });
              response = response.trim().replace(/^["']|["']$/g, '');
            } catch {
              response = '죄송해요, 이 질문은 이해하지 못했어요. "오늘 점심 뭐야?"처럼 물어보세요.';
            }
          } else {
            response = '죄송해요, 이 질문은 이해하지 못했어요. "오늘 점심 뭐야?", "영양 점수 알려줘"처럼 물어보세요.';
          }
        }
      }
    }

    setAnswer(response);
    setProcessing(false);
    // TTS 재생
    window.speakKorean?.(response);
    // 액션 (네비게이션) — 2초 뒤
    if (action) setTimeout(() => { setVoiceOpen(false); action(); }, 2200);
  };

  if (!voiceOpen) return null;

  const exampleQueries = [
    '오늘 점심 뭐야?',
    '영양 점수 알려줘',
    '알레르기 있어?',
    '내일 메뉴 뭐야?',
    '심층 분석 보여줘',
    '학교 검색해줘',
  ];

  return (
    <div style={{
      position:'fixed', inset:0, zIndex:9999,
      background:'rgba(10,14,26,0.85)',
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      padding:'24px',
    }}>
      {/* 닫기 버튼 */}
      <button onClick={() => setVoiceOpen(false)} style={{
        position:'absolute', top:24, right:24,
        width:40, height:40, borderRadius:9999,
        background:'rgba(255,255,255,0.15)', color:'white',
        border:'none', fontSize:18, cursor:'pointer',
      }}>✕</button>

      {/* 마이크 시각화 */}
      <div style={{ marginBottom:24, position:'relative' }}>
        <div style={{
          width:120, height:120, borderRadius:9999,
          background: listening ? 'linear-gradient(135deg, #FF4242, #9747FF)' : processing ? 'linear-gradient(135deg, #0066FF, #9747FF)' : 'rgba(255,255,255,0.15)',
          display:'flex', alignItems:'center', justifyContent:'center',
          fontSize:48, color:'white',
          boxShadow: listening?'0 0 60px rgba(255,66,66,0.4)':'none',
          animation: listening ? 'pulse 1.4s ease-in-out infinite' : 'none',
        }}>
          {listening ? '🎙' : processing ? '🤔' : answer ? '💬' : '🎙'}
        </div>
        {listening && (
          <>
            <style>{`@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }`}</style>
            <div style={{ position:'absolute', inset:-20, borderRadius:9999, border:'2px solid rgba(255,66,66,0.3)', animation:'pulse 1.6s ease-in-out infinite' }}/>
          </>
        )}
      </div>

      {/* 상태 라벨 */}
      <div style={{ color:'rgba(255,255,255,0.85)', fontSize:13, fontWeight:700, marginBottom:14 }}>
        {error ? '⚠ ' + error : listening ? '듣고 있어요…' : processing ? '답변 생성 중…' : answer ? '답변 완료' : '준비 중…'}
      </div>

      {/* 질문 */}
      {transcript && (
        <div style={{ background:'rgba(255,255,255,0.1)', borderRadius:14, padding:'12px 18px', marginBottom:10, maxWidth:340, color:'white', fontSize:13, fontWeight:600, lineHeight:1.5, textAlign:'center' }}>
          <div style={{ fontSize:9, fontWeight:800, opacity:0.7, marginBottom:4, letterSpacing:'0.06em' }}>나의 질문</div>
          {transcript}
        </div>
      )}

      {/* 답변 */}
      {answer && (
        <div style={{
          background:'linear-gradient(135deg, rgba(0,102,255,0.25), rgba(151,71,255,0.25))',
          borderRadius:14, padding:'14px 18px', marginBottom:14, maxWidth:340,
          color:'white', fontSize:14, fontWeight:600, lineHeight:1.55, textAlign:'center',
          border:'1px solid rgba(255,255,255,0.18)',
        }}>
          <div style={{ fontSize:9, fontWeight:800, opacity:0.85, marginBottom:6, letterSpacing:'0.06em' }}>💬 답변</div>
          {answer}
        </div>
      )}

      {/* 예시 질문 */}
      {!listening && !transcript && !answer && (
        <div style={{ marginTop:8, maxWidth:360, textAlign:'center' }}>
          <div style={{ color:'rgba(255,255,255,0.6)', fontSize:11, fontWeight:700, marginBottom:10, letterSpacing:'0.06em' }}>이렇게 물어보세요</div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6, justifyContent:'center' }}>
            {exampleQueries.map(q => (
              <span key={q} style={{
                fontSize:11, fontWeight:700,
                color:'white', background:'rgba(255,255,255,0.12)',
                padding:'6px 12px', borderRadius:9999,
              }}>"{q}"</span>
            ))}
          </div>
        </div>
      )}

      {/* 다시 듣기 버튼 */}
      {!listening && !processing && (transcript || error) && (
        <button onClick={startListening} style={{
          marginTop:14, padding:'10px 22px', borderRadius:9999,
          background:'white', color:'#0a0e1a', border:'none',
          fontSize:13, fontWeight:800, cursor:'pointer',
          display:'inline-flex', alignItems:'center', gap:6,
        }}>🎙 다시 말하기</button>
      )}
      {answer && !processing && (
        <button onClick={() => window.speakKorean?.(answer)} style={{
          marginTop:8, padding:'7px 16px', borderRadius:9999,
          background:'transparent', color:'rgba(255,255,255,0.7)',
          border:'1px solid rgba(255,255,255,0.25)',
          fontSize:11, fontWeight:700, cursor:'pointer',
        }}>🔊 다시 듣기</button>
      )}
    </div>
  );
}

// 접근성 효과 — a11y 상태에 따라 전역 클래스 토글
function A11yEffect() {
  const { a11y } = useApp();
  React.useEffect(() => {
    document.body.classList.toggle('a11y-large', !!a11y?.largeText);
    document.body.classList.toggle('a11y-cb', !!a11y?.colorBlind);
    return () => {};
  }, [a11y?.largeText, a11y?.colorBlind]);
  return null;
}

function App() {
  const [tweaks] = React.useState({ headerColor:'#0066FF', markerStyle:'pin', dark:false });
  return (
    <div className="device-stage">
      <IOSDevice>
        <AppProvider tweaks={tweaks}>
          <A11yEffect />
          <Router />
          <VoiceModal />
        </AppProvider>
      </IOSDevice>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
